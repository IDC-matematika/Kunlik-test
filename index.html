{"id":"7-27","q":"Devorning 15% bo'yalgan bo'lsa, uning qancha qismi bo'yalmagan?","options":["17/20","0,8","0,9","0,75"],"correct":0,"solution":"Bo'yalmagan = 100% − 15% = 85% = 85/100 = 17/20.","topic":"m7"},
{"id":"7-55","q":"Kostyumning narxi 30% ga tushirilgach, 210 000 so'm bo'ldi. Chegirma necha so'mni tashkil etgan?","options":["90 000 so'm","63 000 so'm","70 000 so'm","300 000 so'm"],"correct":0,"solution":"Yangi narx dastlabki narxning 70% i: x · 0,7 = 210 000 → x = 300 000 so'm.\nChegirma: 300 000 − 210 000 = 90 000 so'm.","topic":"m7"},
{"id":"10-41","q":"40700 m² ni gektar va arda ifodalang.","options":["4 ga 7 ar","40 ga 7 ar","407 ar","4 ga 700 ar"],"correct":0,"solution":"1 ga = 10000 m², 1 ar = 100 m².\n40700 m² = 40000 + 700 = 4 ga + 7 ar.","topic":"m10"},
{"id":"7-5","q":"600 gektar yerning 150 gektari necha foizini tashkil etadi?","options":["25%","50%","15%","30%"],"correct":0,"solution":"150/600 × 100% = 25%.","topic":"m7"},
{"id":"8-51","q":"Chizmada kvadrat va muntazam uchburchak umumiy tomonga ega. Kvadratning yuzi 36 ga teng bo'lsa, uchburchakning perimetrini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 225' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='95,100 150,4.7 205,100' fill='#e5f6ee' stroke='#1f9d63' stroke-width='2.5' stroke-linejoin='round'/><polygon points='95,100 205,100 205,210 95,210' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='127.7' y1='55.4' x2='117.3' y2='49.4' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='172.3' y1='55.4' x2='182.7' y2='49.4' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='150' y1='106' x2='150' y2='94' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><text x='150' y='70' text-anchor='middle' dominant-baseline='central' font-size='14' font-weight='700' fill='#1f9d63'>P = ?</text><text x='150' y='155' text-anchor='middle' dominant-baseline='central' font-size='16' font-weight='700' fill='#1170c4'>S = 36</text></svg>","options":["18","16","24","12"],"correct":0,"solution":"Kvadrat yuzi = a² = 36 → a = 6.\nMuntazam uchburchak tomoni = kvadrat tomoni = 6.\nPerimetr = 3 × 6 = 18.","topic":"m8"},
{"id":"8-50","q":"Chizmada kvadrat va muntazam uchburchak umumiy tomonga ega. Kvadratning yuzi 4 ga teng bo'lsa, uchburchakning perimetrini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 225' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='95,100 150,4.7 205,100' fill='#e5f6ee' stroke='#1f9d63' stroke-width='2.5' stroke-linejoin='round'/><polygon points='95,100 205,100 205,210 95,210' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='127.7' y1='55.4' x2='117.3' y2='49.4' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='172.3' y1='55.4' x2='182.7' y2='49.4' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='150' y1='106' x2='150' y2='94' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><text x='150' y='70' text-anchor='middle' dominant-baseline='central' font-size='14' font-weight='700' fill='#1f9d63'>P = ?</text><text x='150' y='155' text-anchor='middle' dominant-baseline='central' font-size='16' font-weight='700' fill='#1170c4'>S = 4</text></svg>","options":["6","8","10","12"],"correct":0,"solution":"Kvadrat yuzi = a² = 4 → a = 2.\nUchburchak tomoni = 2.\nPerimetr = 3 × 2 = 6.","topic":"m8"},
{"id":"17-39","q":"Teng yonli uchburchakning asosidagi burchagi 50°. Chizmadagi x burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 190' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='40,160.5 260,160.5 150,29.5' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='99.6' y1='98.9' x2='90.4' y2='91.1' stroke='#1f9d63' stroke-width='2' stroke-linecap='round'/><line x1='209.6' y1='91.1' x2='200.4' y2='98.9' stroke='#1f9d63' stroke-width='2' stroke-linecap='round'/><path d='M 66 160.5 A 26 26 0 0 0 56.7 140.6' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='77.9' y='142.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>50°</text><path d='M 243.3 140.6 A 26 26 0 0 0 234 160.5' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='224.7' y='144.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>x</text></svg>","options":["60°","80°","40°","50°"],"correct":3,"solution":"Teng yonli uchburchakda asos burchaklari teng.\nBir asos burchagi 50° bo'lsa, ikkinchisi (x) ham 50°.","topic":"m17"},
{"id":"17-50","q":"ABC uchburchakda B uchidagi burchak 64°, A burchak α, C burchak β. Agar 2α = 64° bo'lsa, β burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 190' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='49.1,160 257.2,30 270.9,160' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><path d='M 238.5 41.7 A 22 22 0 0 0 259.5 51.9' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='241.8' y='61.5' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>64°</text><path d='M 79.1 160 A 30 30 0 0 0 74.6 144.1' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='90.5' y='148.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>α</text><path d='M 268.8 140.1 A 20 20 0 0 0 250.9 160' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='246.3' y='137.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>β</text><text x='35.7' y='164.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='265.6' y='18.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='283.1' y='166.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text></svg>","options":["84°","54°","45°","92°"],"correct":0,"solution":"2α = 64° → α = 32°.\nUchburchak burchaklari yig'indisi: 64° + α + β = 180°.\n64° + 32° + β = 180°.\nβ = 180° − 96° = 84°.","topic":"m17"},
{"id":"17-38","q":"AD va BC to'g'ri chiziqlar O nuqtada kesishadi. ∠AOB = 30° bo'lsa, ∠BOD ni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 200' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='39.4' y1='66.4' x2='290.6' y2='133.6' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><line x1='39.4' y1='133.6' x2='290.6' y2='66.4' stroke='#1f9d63' stroke-width='2.5' stroke-linecap='round'/><path d='M 130.2 90.7 A 36 36 0 0 0 130.2 109.3' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='107' y='100' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>30°</text><path d='M 143.7 105.7 A 22 22 0 0 0 186.3 105.7' fill='none' stroke='#8aa0b0' stroke-width='2.2'/><text x='165' y='135' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#8aa0b0'>?</text><circle cx='165' cy='100' r='3.5' fill='#1f3447'/><text x='165' y='84' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>O</text><text x='37.4' y='54.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='37.4' y='146.6' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='292.6' y='54.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><text x='292.6' y='146.6' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text></svg>","options":["150°","30°","60°","120°"],"correct":0,"solution":"∠AOB va ∠BOD qo'shni burchaklar (A, O, D bir to'g'ri chiziqda).\n∠BOD = 180° − 30° = 150°.","topic":"m17"},
{"id":"17-43","q":"ABCD kvadrat, BD diagonal. B uchidagi α burchakning qiymatini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 290 210' width='290' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='70,180 70,30 220,30 220,180' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='70' y1='30' x2='220' y2='180' stroke='#d65745' stroke-width='2.2' stroke-linecap='round'/><path d='M 70 60 A 30 30 0 0 0 91.2 51.2' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='86.5' y='69.7' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>α</text><polyline points='70,169 81,169 81,180' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><polyline points='209,30 209,41 220,41' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><text x='60.1' y='189.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='60.1' y='20.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='229.9' y='20.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><text x='229.9' y='189.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text></svg>","options":["40°","90°","180°","45°"],"correct":3,"solution":"Kvadrat diagonali burchakni teng ikkiga bo'ladi.\nKvadrat burchagi 90°.\nDiagonal: α = 90°/2 = 45°.","topic":"m17"},
{"id":"17-45","q":"Chizmadagi to'g'ri burchakli uchburchakda x burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 210' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='54.9,182 245.1,182 54.9,28' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><polyline points='65.9,182 65.9,171 54.9,171' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><path d='M 218.7 160.6 A 34 34 0 0 0 211.1 182' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='195.2' y='164.3' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>39°</text><path d='M 54.9 56 A 28 28 0 0 0 76.7 45.6' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='72.6' y='65' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>x</text></svg>","options":["39°","51°","61°","49°"],"correct":1,"solution":"To'g'ri burchakli uchburchakda burchaklar yig'indisi 180°.\n90° (to'g'ri burchak) + 39° + x = 180°.\nx = 180° − 90° − 39° = 51°.","topic":"m17"},
{"id":"8-54","q":"Chizmadagi pog'onali shaklning perimetrini toping (barcha burchaklar to'g'ri).<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 185' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='30,28 132,28 132,113 268,113 268,164 30,164' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><text x='81' y='16' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>6</text><text x='144' y='70.5' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>5</text><text x='200' y='101' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>8</text><text x='280' y='138.5' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>3</text><polyline points='39,28 39,37 30,37' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><polyline points='123,28 123,37 132,37' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><polyline points='259,113 259,122 268,122' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><polyline points='268,155 259,155 259,164' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><polyline points='39,164 39,155 30,155' fill='none' stroke='#8aa0b0' stroke-width='1.6'/></svg>","options":["50","60","44","35"],"correct":2,"solution":"Yuqori gorizontal: 6, vertikal: 5, gorizontal: 8, vertikal: 3.\nPastki gorizontal = 6+8 = 14, chap vertikal = 5+3 = 8.\nPerimetr = 6+5+8+3+14+8 = 44.","topic":"m8"},
{"id":"8-36","q":"To'g'ri burchakli uchburchakning yuzi 30 sm², bir kateti 6 sm. Ikkinchi katet x ni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 190' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='45,158 255,158 45,32' fill='#cfe3f6' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><polyline points='56,158 56,147 45,147' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><text x='23' y='95' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>6 sm</text><text x='150' y='172' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>x</text><text x='109' y='130' text-anchor='middle' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1170c4'>S = 30 sm²</text></svg>","options":["10 sm","5 sm","15 sm","20 sm"],"correct":0,"solution":"S = (a · b) : 2 → 30 = (6 · x) : 2 = 3x.\nx = 10 sm.","topic":"m8"},
{"id":"8-47","q":"To'g'ri to'rtburchak diagonallari bilan 4 ta uchburchakka bo'lingan. Bo'yalgan qism (yuqori va pastki uchburchaklar) butun shaklning necha foizini tashkil etadi?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 190' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='30,25 270,25 270,165 30,165' fill='#fff' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><polygon points='30,25 270,25 150,95' fill='#a9cdee' stroke='#1170c4' stroke-width='1.5' stroke-linejoin='round'/><polygon points='30,165 270,165 150,95' fill='#a9cdee' stroke='#1170c4' stroke-width='1.5' stroke-linejoin='round'/><line x1='30' y1='25' x2='270' y2='165' stroke='#1170c4' stroke-width='1.8' stroke-linecap='round'/><line x1='270' y1='25' x2='30' y2='165' stroke='#1170c4' stroke-width='1.8' stroke-linecap='round'/><polygon points='30,25 270,25 270,165 30,165' fill='none' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/></svg>","options":["65%","75%","50%","25%"],"correct":2,"solution":"Diagonallar to'rtburchakni 4 teng uchburchakka bo'ladi.\nYuqori va pastki uchburchak bo'yalgan = 2/4 = 50%.","topic":"m8"},
{"id":"17-44","q":"To'g'ri burchakli uchburchakning bir o'tkir burchagi 20°. Chizmadagi tashqi x burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 210' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='88.1,184 145.6,184 88.1,26' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='145.6' y1='184' x2='211.9' y2='184' stroke='#1f3447' stroke-width='2' stroke-linecap='round'/><polyline points='99.1,184 99.1,173 88.1,173' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><path d='M 88.1 66 A 40 40 0 0 0 101.7 63.6' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='66.1' y='66' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>20°</text><path d='M 138.7 165.2 A 20 20 0 0 1 165.6 184' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='164.5' y='157' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>x</text></svg>","options":["100°","110°","80°","120°"],"correct":1,"solution":"To'g'ri burchakli uchburchakda: 90° + 20° + C = 180° → C = 70°.\nx — C burchakning tashqi burchagi.\nx = 180° − 70° = 110°.","topic":"m17"},
{"id":"8-49","q":"Chizmadagi ma'lumotlardan foydalanib ABC uchburchakning yuzini toping (BD — balandlik).<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 215' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='36,165.1 264,165.1 198.9,34.9' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='198.9' y1='34.9' x2='198.9' y2='165.1' stroke='#1f9d63' stroke-width='2' stroke-linecap='round' stroke-dasharray='6 4'/><polyline points='208.9,165.1 208.9,155.1 198.9,155.1' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><text x='117.4' y='180.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>5 m</text><text x='231.4' y='180.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>2 m</text><text x='180.9' y='100' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>4 m</text><text x='22.7' y='169.6' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='203.8' y='21.7' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='276.8' y='170.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><text x='198.9' y='195.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text></svg>","options":["14 m²","15 m²","16 m²","28 m²"],"correct":0,"solution":"Asos AC = AD + DC = 5 + 2 = 7 m.\nBalandlik = 4 m.\nS = (7 × 4)/2 = 14 m².","topic":"m8"},
{"id":"17-47","q":"Chizmadagi ma'lumotlardan foydalanib x burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 190' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='20' y1='154.5' x2='310' y2='154.5' stroke='#1f3447' stroke-width='2' stroke-linecap='round'/><polygon points='80.7,154.5 249.3,154.5 149.4,35.5' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><path d='M 138.4 54.5 A 22 22 0 0 0 163.6 52.3' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='152.5' y='70.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>70°</text><path d='M 91.7 135.5 A 22 22 0 0 0 58.7 154.5' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='63.2' y='124.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>120°</text><path d='M 271.3 154.5 A 22 22 0 0 0 235.2 137.7' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='264.1' y='122.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>x</text><text x='66.4' y='161.7' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='147.6' y='21.6' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='263.9' y='161' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text></svg>","options":["130°","140°","120°","160°"],"correct":0,"solution":"A dagi ichki burchak = 180°−120° = 60°.\nUchburchak: 70° + 60° + C_ichki = 180° → C_ichki = 50°.\nx (C dagi tashqi) = 180° − 50° = 130°.","topic":"m17"},
{"id":"9-49","q":"O'lchamlari 10 sm, 10 sm va 6 sm bo'lgan parallelepipeddan qirrasi 6 sm bo'lgan kub kesib olindi (chizmada punktir bilan). Qolgan qismning hajmini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 230' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='224.5,176.1 247.5,156.8 247.5,66.8 224.5,86.1' fill='#c9e0f5' stroke='#1170c4' stroke-width='2' stroke-linejoin='round'/><polygon points='134.5,176.1 224.5,176.1 224.5,86.1 134.5,86.1' fill='#e4f0fb' stroke='#1170c4' stroke-width='2' stroke-linejoin='round'/><polygon points='100,205 134.5,176.1 134.5,86.1 100,115' fill='#c9e0f5' stroke='#1170c4' stroke-width='2' stroke-linejoin='round'/><polygon points='40,205 100,205 100,115 40,115' fill='#e4f0fb' stroke='#1170c4' stroke-width='2' stroke-linejoin='round'/><polygon points='40,115 100,115 134.5,86.1 224.5,86.1 247.5,66.8 97.5,66.8' fill='#f2f8fd' stroke='#1170c4' stroke-width='2' stroke-linejoin='round'/><line x1='100' y1='205' x2='190' y2='205' stroke='#d65745' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='5 4'/><line x1='190' y1='205' x2='224.5' y2='176.1' stroke='#d65745' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='5 4'/><line x1='100' y1='115' x2='190' y2='115' stroke='#d65745' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='5 4'/><line x1='190' y1='115' x2='224.5' y2='86.1' stroke='#d65745' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='5 4'/><line x1='190' y1='205' x2='190' y2='115' stroke='#d65745' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='5 4'/><text x='28' y='160' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>6</text><text x='56.7' y='82.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>10</text><text x='172.5' y='54.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>10</text><text x='145' y='218' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>6</text></svg>","options":["384 sm³","216 sm³","125 sm³","512 sm³"],"correct":0,"solution":"Butun parallelepiped: 10×10×6 = 600.\nKesilgan kub: 6×6×6 = 216.\nQolgan: 600 − 216 = 384 sm³.","topic":"m9"},
{"id":"17-53","q":"a ∥ b. Chizmadagi ma'lumotlardan foydalanib x burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 345 230' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='20' y1='40' x2='330' y2='40' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><line x1='20' y1='200' x2='330' y2='200' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><text x='14' y='40' text-anchor='end' dominant-baseline='central' font-size='13' font-weight='700' fill='#0e7cc4'>a</text><text x='14' y='200' text-anchor='end' dominant-baseline='central' font-size='13' font-weight='700' fill='#0e7cc4'>b</text><line x1='159.4' y1='40' x2='70' y2='115' stroke='#1f3447' stroke-width='2.2' stroke-linecap='round'/><line x1='70' y1='115' x2='303.5' y2='200' stroke='#1f3447' stroke-width='2.2' stroke-linecap='round'/><path d='M 181.4 40 A 22 22 0 0 1 142.5 54.1' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='171.4' y='72.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>140°</text><path d='M 265.9 186.3 A 40 40 0 0 0 263.5 200' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='246.4' y='189.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>20°</text><path d='M 86.9 100.9 A 22 22 0 0 1 90.7 122.5' fill='none' stroke='#7c4dcc' stroke-width='2.2'/><text x='104.5' y='108.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#7c4dcc'>x</text><circle cx='159.4' cy='40' r='3' fill='#1f3447'/><circle cx='303.5' cy='200' r='3' fill='#1f3447'/><circle cx='70' cy='115' r='3' fill='#1f3447'/></svg>","options":["40°","50°","60°","70°"],"correct":2,"solution":"x burchak uchidan a va b ga parallel yordamchi chiziq o'tkazamiz.\nBu chiziq x ni ikki qismga bo'ladi.\nYuqori qism = 180° − 140° = 40° (ichki bir tomonli burchaklar).\nPastki qism = 20° (almashinuvchi ichki burchaklar).\nx = 40° + 20° = 60°.","topic":"m17"},
{"id":"16-52","q":"Jadvaldagi mahsulotlar uchun jami to'lovni (so'm) toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 326 160' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='8' y='8' width='310' height='144' rx='10' fill='#fff' stroke='#cfdbe5' stroke-width='1.5'/><path d='M 8 44 V 18 Q 8 8 18 8 H 308 Q 318 8 318 18 V 44 Z' fill='#0e7cc4'/><text x='58' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Mahsulot</text><text x='173' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Narx (so'm/kg)</text><text x='278' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Miqdor</text><line x1='9' y1='44' x2='317' y2='44' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Pomidor</text><text x='173' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>9 000</text><text x='278' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>3 kg</text><rect x='9' y='80' width='308' height='36' fill='#f0f6fb'/><line x1='9' y1='80' x2='317' y2='80' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Baklajon</text><text x='173' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>13 000</text><text x='278' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>4 kg</text><line x1='9' y1='116' x2='317' y2='116' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Bodring</text><text x='173' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8 000</text><text x='278' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>5 kg</text><line x1='108' y1='8' x2='108' y2='152' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><line x1='238' y1='8' x2='238' y2='152' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/></svg>","options":["120000","119000","103000","140000"],"correct":1,"solution":"Pomidor: 9000×3 = 27000.\nBaklajon: 13000×4 = 52000.\nBodring: 8000×5 = 40000.\nJami: 27000+52000+40000 = 119000 so'm.","topic":"m16"},
{"id":"15-48","q":"3 ta qopning jami og'irligi 84 kg. Birinchi qop ikkinchidan 5 kg og'ir, ikkinchi qop uchinchidan 4 kg yengil bo'lsa, uchinchi qop og'irligini toping.","options":["11","25","7","29"],"correct":3,"solution":"3-qop = x. 2-qop = x−4. 1-qop = (x−4)+5 = x+1.\nYig'indi: (x+1)+(x−4)+x = 84.\n3x−3 = 84 → 3x = 87 → x = 29 kg.","topic":"m15"},
{"id":"1-40","q":"Eng kichik uch xonali son bilan eng katta ikki xonali sonning ayirmasini toping.","options":["1","11","9","10"],"correct":0,"solution":"Eng kichik uch xonali son = 100.\nEng katta ikki xonali son = 99.\nAyirma = 100 − 99 = 1.","topic":"m1"},
{"id":"3-9","q":"1/2 + 1/3 + 1/6 ni hisoblang.","options":["1","5/6","2/3","1/2"],"correct":0,"solution":"Umumiy maxraj 6: 3/6 + 2/6 + 1/6 = 6/6 = 1.","topic":"m3"},
{"id":"3-19","q":"3/4 dan 1/4 ni ayiring, so'ng 1/2 ga ko'paytiring.","options":["1/4","1/2","1","3/8"],"correct":0,"solution":"3/4 − 1/4 = 2/4 = 1/2.\n1/2 × 1/2 = 1/4.","topic":"m3"},
{"id":"4-23","q":"0,25 + 0,4 yig'indisini oddiy kasr ko'rinishida yozing.","options":["13/20","2/3","5/8","3/5"],"correct":0,"solution":"0,25 + 0,4 = 0,65 = 65/100 = 13/20.","topic":"m4"},
{"id":"4-45","q":"2,5 × 0,4 ni hisoblang.","options":["1","10","0,1","2,9"],"correct":0,"solution":"2,5 × 0,4 = 1,00 = 1.\n(25 × 4 = 100, ikkita kasr xonasi → 1,00.)","topic":"m4"},
{"id":"4-24","q":"1,2 ni oddiy kasrga aylantiring (qisqartirilgan holda).","options":["6/5","3/5","5/6","3/2"],"correct":0,"solution":"1,2 = 12/10 = 6/5 (2 ga qisqartirildi).","topic":"m4"},
{"id":"6-22","q":"2⁵ · 2³ : 2⁶ ni hisoblang.","options":["4","2","8","16"],"correct":0,"solution":"Daraja xossalari: 2^(5+3−6) = 2² = 4.","topic":"m6"},
{"id":"6-20","q":"(3²)³ ni hisoblang.","options":["729","243","216","81"],"correct":0,"solution":"(aᵐ)ⁿ = aᵐⁿ → 3^(2·3) = 3⁶ = 729.","topic":"m6"},
{"id":"6-38","q":"5⁰ + 3¹ − 2² ni hisoblang.","options":["0","1","2","4"],"correct":0,"solution":"5⁰ = 1, 3¹ = 3, 2² = 4.\n1 + 3 − 4 = 0.","topic":"m6"},
{"id":"11-49","q":"−5x²y · 2xy³ ko'paytmasini toping.","options":["−10x³y⁴","−10x²y³","10x³y⁴","−7x³y⁴"],"correct":0,"solution":"Koeffitsiyentlar: −5 · 2 = −10.\nx²·x = x³, y·y³ = y⁴.\nNatija: −10x³y⁴.","topic":"m11"},
{"id":"11-33","q":"6a⁴b³ : 2a²b ni soddalashtiring.","options":["3a²b²","3a²b","3a⁶b⁴","4a²b²"],"correct":0,"solution":"6:2 = 3, a⁴:a² = a², b³:b = b².\nNatija: 3a²b².","topic":"m11"},
{"id":"11-8","q":"(2x³)² birhadni standart shaklga keltiring.","options":["4x⁶","2x⁶","4x⁵","8x⁶"],"correct":0,"solution":"(2x³)² = 2²·(x³)² = 4·x⁶ = 4x⁶.","topic":"m11"},
{"id":"11-37","q":"−3a²bc va 4a²bc o'xshash birhadlarni qo'shing.","options":["a²bc","7a²bc","−12a²bc","a⁴b²c²"],"correct":0,"solution":"O'xshash birhadlar qo'shilganda koeffitsiyentlar qo'shiladi:\n−3 + 4 = 1 → a²bc.","topic":"m11"},
{"id":"14-29","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 10</span><span>x − y = 4</span></span></span>","options":["(7, 3)","(6, 4)","(3, 7)","(5, 5)"],"correct":0,"solution":"Ikki tenglamani qo'shamiz: 2x = 14 → x = 7.\ny = 10 − 7 = 3.\nYechim: (7, 3).","topic":"m14"},
{"id":"14-18","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x − y = 7</span><span>x + y = 5</span></span></span>","options":["(3, 2)","(2, 3)","(4, 1)","(1, 4)"],"correct":0,"solution":"Qo'shamiz: 4x = 12 → x = 3.\ny = 5 − 3 = 2.\nYechim: (3, 2).","topic":"m14"},
{"id":"14-37","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 2x</span><span>x + y = 9</span></span></span>","options":["(3, 6)","(6, 3)","(2, 7)","(4, 5)"],"correct":0,"solution":"y = 2x ni ikkinchiga qo'yamiz: x + 2x = 9 → 3x = 9 → x = 3.\ny = 2·3 = 6.\nYechim: (3, 6).","topic":"m14"},
{"id":"16-39","q":"Diagrammada do'konning 4 kunlik savdosi (dona) berilgan. O'rtacha kunlik savdoni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 306 205' width='306' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='34' y1='171' x2='294' y2='171' stroke='#9cb2c0' stroke-width='1.4' stroke-linecap='round'/><text x='26' y='171' text-anchor='end' dominant-baseline='central' font-size='11' font-weight='600' fill='#9cb2c0'>0</text><rect x='46.4' y='103.3' width='40.3' height='67.7' rx='4' fill='#0e7cc4'/><text x='66.5' y='93.3' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>12</text><text x='66.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>Du</text><rect x='111.4' y='69.5' width='40.3' height='101.5' rx='4' fill='#2aaec8'/><text x='131.5' y='59.5' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>18</text><text x='131.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>Se</text><rect x='176.4' y='86.4' width='40.3' height='84.6' rx='4' fill='#22a06b'/><text x='196.5' y='76.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>15</text><text x='196.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>Ch</text><rect x='241.4' y='30' width='40.3' height='141' rx='4' fill='#f4a23a'/><text x='261.5' y='20' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>25</text><text x='261.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>Pa</text></svg>","options":["17,5","16","18","20"],"correct":0,"solution":"Jami: 12 + 18 + 15 + 25 = 70 dona.\nO'rtacha = 70 / 4 = 17,5 dona.","topic":"m16"},
{"id":"16-35","q":"Grafikda 5 kunlik harorat (°C) berilgan. Eng yuqori va eng past harorat farqini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 350 210' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='44' y1='178' x2='328' y2='178' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='178' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>18°</text><line x1='44' y1='152.7' x2='328' y2='152.7' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='152.7' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>19°</text><line x1='44' y1='127.3' x2='328' y2='127.3' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='127.3' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>20°</text><line x1='44' y1='102' x2='328' y2='102' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='102' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>21°</text><line x1='44' y1='76.7' x2='328' y2='76.7' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='76.7' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>22°</text><line x1='44' y1='51.3' x2='328' y2='51.3' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='51.3' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>23°</text><line x1='44' y1='26' x2='328' y2='26' stroke='#e6eef3' stroke-width='1' stroke-linecap='round'/><text x='37' y='26' text-anchor='end' dominant-baseline='central' font-size='10.5' font-weight='600' fill='#9cb2c0'>24°</text><line x1='44' y1='20' x2='44' y2='178' stroke='#9cb2c0' stroke-width='1.3' stroke-linecap='round'/><line x1='44' y1='178' x2='328' y2='178' stroke='#9cb2c0' stroke-width='1.3' stroke-linecap='round'/><polyline points='66,127.3 128.5,76.7 191,152.7 253.5,51.3 316,102' fill='none' stroke='#0e7cc4' stroke-width='2.5' stroke-linejoin='round'/><circle cx='66' cy='127.3' r='4.2' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='66' y='114.3' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f3447'>20°</text><text x='66' y='193' text-anchor='middle' dominant-baseline='central' font-size='11.5' font-weight='600' fill='#46637a'>1-kun</text><circle cx='128.5' cy='76.7' r='4.2' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='128.5' y='63.7' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f3447'>22°</text><text x='128.5' y='193' text-anchor='middle' dominant-baseline='central' font-size='11.5' font-weight='600' fill='#46637a'>2-kun</text><circle cx='191' cy='152.7' r='4.2' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='191' y='167.7' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f3447'>19°</text><text x='191' y='193' text-anchor='middle' dominant-baseline='central' font-size='11.5' font-weight='600' fill='#46637a'>3-kun</text><circle cx='253.5' cy='51.3' r='4.2' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='253.5' y='38.3' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f3447'>23°</text><text x='253.5' y='193' text-anchor='middle' dominant-baseline='central' font-size='11.5' font-weight='600' fill='#46637a'>4-kun</text><circle cx='316' cy='102' r='4.2' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='316' y='89' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f3447'>21°</text><text x='316' y='193' text-anchor='middle' dominant-baseline='central' font-size='11.5' font-weight='600' fill='#46637a'>5-kun</text></svg>","options":["4°","3°","5°","2°"],"correct":0,"solution":"Eng yuqori = 23°, eng past = 19°.\nFarq = 23° − 19° = 4°.","topic":"m16"},
{"id":"16-42","q":"Doiraviy diagrammada o'quvchilarning fan to'garagiga yozilishi berilgan. Matematikani tanlaganlar necha foizni tashkil etadi?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 190' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><path d='M 92 95 L 92 17 A 78 78 0 0 1 92 173 Z' fill='#0e7cc4' stroke='#fff' stroke-width='2'/><text x='140.4' y='95' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#fff'>50%</text><rect x='190' y='47' width='16' height='16' rx='4' fill='#0e7cc4'/><text x='214' y='55' text-anchor='start' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1f3447'>Matematika (90)</text><path d='M 92 95 L 92 173 A 78 78 0 0 1 14 95 Z' fill='#2aaec8' stroke='#fff' stroke-width='2'/><text x='57.8' y='129.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#fff'>25%</text><rect x='190' y='77' width='16' height='16' rx='4' fill='#2aaec8'/><text x='214' y='85' text-anchor='start' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1f3447'>Fizika (45)</text><path d='M 92 95 L 14 95 A 78 78 0 0 1 92 17 Z' fill='#22a06b' stroke='#fff' stroke-width='2'/><text x='57.8' y='60.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#fff'>25%</text><rect x='190' y='107' width='16' height='16' rx='4' fill='#22a06b'/><text x='214' y='115' text-anchor='start' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1f3447'>Kimyo (45)</text></svg>","options":["50%","40%","30%","60%"],"correct":0,"solution":"Jami: 90 + 45 + 45 = 180 o'quvchi.\nMatematika: 90/180 × 100% = 50%.","topic":"m16"},
{"id":"1-39","q":"Eng katta 4 xonali son bilan eng kichik 4 xonali sonning yig'indisini toping.","options":["19999","11000","10999","9999"],"correct":2,"solution":"Eng katta 4 xonali son = 9999.\nEng kichik 4 xonali son = 1000.\n9999 + 1000 = 10999.","topic":"m1"},
{"id":"1-29","q":"5 678 sonida 6 raqami qaysi xonada va uning qiymati nechaga teng?","options":["O'nlar, 60","Yuzlar, 600","Minglar, 6000","Birlar, 6"],"correct":1,"solution":"5678 = 5·1000 + 6·100 + 7·10 + 8.\n6 raqami yuzlar xonasida turibdi, qiymati 6·100 = 600.","topic":"m1"},
{"id":"1-34","q":"3 472 sonini eng yaqin yuzlikkacha yaxlitlang.","options":["3400","3000","3500","3470"],"correct":2,"solution":"Yuzlikka yaxlitlashda o'nlar xonasiga qaraladi: 7 ≥ 5, demak yuqoriga yaxlitlanadi.\n3472 ≈ 3500.","topic":"m1"},
{"id":"1-19","q":"Sonlarni o'sish tartibida joylang: 4 050, 4 005, 4 500, 4 055.","options":["4005, 4050, 4055, 4500","4005, 4055, 4050, 4500","4500, 4055, 4050, 4005","4050, 4005, 4055, 4500"],"correct":0,"solution":"Xonama-xona taqqoslaymiz:\n4005 < 4050 < 4055 < 4500.","topic":"m1"},
{"id":"1-25","q":"Bir sonni 10 ga ko'paytirib, 7 qo'shilsa, 247 hosil bo'ldi. Shu sonni toping.","options":["25","24","240","17"],"correct":1,"solution":"10·x + 7 = 247.\n10·x = 240.\nx = 24.","topic":"m1"},
{"id":"1-5","q":"7 ta yuzlik, 0 ta o'nlik va 9 ta birlikdan iborat son qanday yoziladi?","options":["79","790","7009","709"],"correct":3,"solution":"7·100 + 0·10 + 9 = 700 + 0 + 9 = 709.","topic":"m1"},
{"id":"1-16","q":"345 + 199 ni qulay usulda hisoblang.","options":["534","544","554","444"],"correct":1,"solution":"199 = 200 − 1.\n345 + 200 − 1 = 545 − 1 = 544.","topic":"m1"},
{"id":"1-17","q":"846 − 298 ni qulay usulda hisoblang.","options":["552","542","548","458"],"correct":2,"solution":"298 = 300 − 2.\n846 − 300 + 2 = 546 + 2 = 548.","topic":"m1"},
{"id":"1-41","q":"Eng katta ikki xonali toq son bilan eng kichik ikki xonali juft sonning yig'indisini toping.","options":["108","110","99","109"],"correct":3,"solution":"Eng katta ikki xonali toq son = 99.\nEng kichik ikki xonali juft son = 10.\n99 + 10 = 109.","topic":"m1"},
{"id":"1-18","q":"Qatordagi qonuniyatni davom ettiring: 2, 5, 8, 11, …  Keyingi son qaysi?","options":["13","14","15","12"],"correct":1,"solution":"Har bir son oldingisidan 3 ga ortadi.\n11 + 3 = 14.","topic":"m1"},
{"id":"1-45","q":"5 ta ketma-ket natural sonning yig'indisi 100 ga teng. Eng kichigini toping.","options":["18","19","20","16"],"correct":0,"solution":"Sonlar: n, n+1, n+2, n+3, n+4.\nYig'indi = 5n + 10 = 100 → 5n = 90 → n = 18.\nTekshirish: 18+19+20+21+22 = 100 ✓","topic":"m1"},
{"id":"1-36","q":"1 dan 100 gacha bo'lgan barcha natural sonlar yig'indisini toping.","options":["5000","5050","10100","550"],"correct":1,"solution":"Gauss usuli: 1+2+…+100 = n(n+1)/2 = 100·101/2 = 5050.\n(50 ta juftlik, har biri 101 ga teng: 1+100, 2+99, …)","topic":"m1"},
{"id":"1-35","q":"Uch xonali sonning yuzlar xonasi 4, birlar xonasi 7, o'nlar xonasi esa yuzlar va birlar xonasidagi raqamlar ayirmasiga teng. Shu sonni toping.","options":["437","433","477","413"],"correct":0,"solution":"Yuzlar = 4, birlar = 7.\nO'nlar = 7 − 4 = 3.\nSon = 437.","topic":"m1"},
{"id":"1-47","q":"Diyor 1 dan 50 gacha bo'lgan natural sonlarni yozdi. U jami nechta raqam yozgan?","options":["50","91","92","100"],"correct":1,"solution":"1 dan 9 gacha: 9 ta bir xonali son → 9 ta raqam.\n10 dan 50 gacha: 41 ta ikki xonali son → 41×2 = 82 ta raqam.\nJami: 9 + 82 = 91 ta raqam.","topic":"m1"},
{"id":"1-32","q":"Sonlar o'qida A nuqta qaysi songa mos keladi?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 92' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='12' y1='52' x2='320' y2='52' stroke='#1f3447' stroke-width='2'/><path d='M 322 52 l -9 -5 v 10 z' fill='#1f3447'/><line x1='24' y1='46' x2='24' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='24' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>0</text><line x1='52.2' y1='46' x2='52.2' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><line x1='80.4' y1='46' x2='80.4' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='80.4' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>2</text><line x1='108.6' y1='46' x2='108.6' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><line x1='136.8' y1='46' x2='136.8' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='136.8' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>4</text><line x1='165' y1='46' x2='165' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><line x1='193.2' y1='46' x2='193.2' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='193.2' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>6</text><line x1='221.4' y1='46' x2='221.4' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><line x1='249.6' y1='46' x2='249.6' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='249.6' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>8</text><line x1='277.8' y1='46' x2='277.8' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><line x1='306' y1='46' x2='306' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='306' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>10</text><circle cx='221.4' cy='52' r='6' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='221.4' y='33' text-anchor='middle' dominant-baseline='central' font-size='14' font-weight='700' fill='#0e7cc4'>A</text></svg>","options":["6","7","8","5"],"correct":1,"solution":"A nuqta 6 va 8 oralig'ining o'rtasidan keyingi bo'linmada, ya'ni 7 da turibdi.","topic":"m1"},
{"id":"2-30","q":"126 soni qaysi sonlarga bo'linadi?","options":["2, 3 va 9 ga ham","Faqat 2 va 3 ga","Faqat 3 ga","Hech qaysiga"],"correct":0,"solution":"126 juft son → 2 ga bo'linadi.\nRaqamlar yig'indisi 1+2+6 = 9 → 3 ga va 9 ga ham bo'linadi.","topic":"m2"},
{"id":"2-31","q":"EKUB(24; 36) ni toping.","options":["6","12","72","4"],"correct":1,"solution":"24 = 2³·3, 36 = 2²·3².\nEKUB = umumiy ko'paytuvchilarning eng kichik darajalari = 2²·3 = 12.","topic":"m2"},
{"id":"2-16","q":"EKUK(6; 8) ni toping.","options":["48","12","24","2"],"correct":2,"solution":"6 = 2·3, 8 = 2³.\nEKUK = 2³·3 = 24.","topic":"m2"},
{"id":"2-49","q":"Quyidagilardan qaysi son ham 4 ga, ham 9 ga bo'linadi?","options":["18","24","36","54"],"correct":2,"solution":"4 ga bo'linish: oxirgi ikki raqam 4 ga karrali.\n9 ga bo'linish: raqamlar yig'indisi 9 ga karrali.\n36: 36÷4=9 ✓ va 3+6=9 ✓. Demak 36.","topic":"m2"},
{"id":"2-4","q":"120 sonini tub ko'paytuvchilarga ajrating.","options":["2²·3·5","2³·3·5","2³·3²·5","2·3·5"],"correct":1,"solution":"120 = 2·60 = 2·2·30 = 2·2·2·15 = 2³·3·5.","topic":"m2"},
{"id":"2-26","q":"3 ga ham, 5 ga ham bo'linadigan eng kichik ikki xonali sonni toping.","options":["30","45","10","15"],"correct":3,"solution":"3 va 5 ga bo'linsa, 15 ga bo'linadi (EKUK).\nEng kichik ikki xonali bunday son = 15.","topic":"m2"},
{"id":"2-43","q":"Ikki sonning EKUBi 6, EKUKi 36. Sonlardan biri 12 bo'lsa, ikkinchisini toping.","options":["6","36","9","18"],"correct":3,"solution":"Qoida: a·b = EKUB·EKUK = 6·36 = 216.\nb = 216 ÷ 12 = 18.\nTekshirish: EKUB(12,18)=6, EKUK(12,18)=36 ✓","topic":"m2"},
{"id":"2-22","q":"300 dan kichik bo'lgan, 7 ga bo'linadigan eng katta sonni toping.","options":["301","287","294","299"],"correct":2,"solution":"300 ÷ 7 = 42 (qoldiq 6).\n7·42 = 294. Demak eng katta = 294.","topic":"m2"},
{"id":"2-44","q":"1-avtobus har 12 daqiqada, 2-avtobus har 18 daqiqada jo'naydi. Hozir ular birga jo'nadi. Necha daqiqadan keyin yana birga jo'naydi?","options":["30 daqiqa","36 daqiqa","54 daqiqa","24 daqiqa"],"correct":1,"solution":"EKUK(12; 18) ni topamiz: 12 = 2²·3, 18 = 2·3².\nEKUK = 2²·3² = 36.\n36 daqiqadan keyin birga jo'naydi.","topic":"m2"},
{"id":"3-30","q":"3/8 + 1/8 ni hisoblang.","options":["1/2","1/4","3/16","5/8"],"correct":0,"solution":"Maxrajlar bir xil: suratlarni qo'shamiz.\n3/8 + 1/8 = 4/8 = 1/2.","topic":"m3"},
{"id":"3-22","q":"5/6 − 1/3 ni hisoblang.","options":["1/3","2/3","1/2","4/3"],"correct":2,"solution":"Umumiy maxraj 6: 1/3 = 2/6.\n5/6 − 2/6 = 3/6 = 1/2.","topic":"m3"},
{"id":"3-39","q":"2/3 va 3/4 kasrlardan qaysi biri katta?","options":["2/3","3/4","Teng","Taqqoslab bo'lmaydi"],"correct":1,"solution":"Umumiy maxraj 12: 2/3 = 8/12, 3/4 = 9/12.\n9/12 > 8/12, demak 3/4 katta.","topic":"m3"},
{"id":"3-25","q":"36 sonining 5/9 qismini toping.","options":["16","45","24","20"],"correct":3,"solution":"Avval 1/9 qismi: 36 ÷ 9 = 4.\n5/9 qismi: 4 × 5 = 20.","topic":"m3"},
{"id":"3-41","q":"Bir sonning 3/7 qismi 12 ga teng. Shu sonni toping.","options":["28","21","36","84"],"correct":0,"solution":"3/7 qismi 12 bo'lsa, 1/7 qismi: 12 ÷ 3 = 4.\nButun son (7/7): 4 × 7 = 28.","topic":"m3"},
{"id":"3-44","q":"1 2/5 + 2 3/5 ni hisoblang.","options":["3 1/5","4","3 4/5","4 1/5"],"correct":1,"solution":"Butunlar: 1 + 2 = 3.\nKasrlar: 2/5 + 3/5 = 5/5 = 1.\n3 + 1 = 4.","topic":"m3"},
{"id":"3-31","q":"18/24 kasrini qisqartiring.","options":["3/4","2/3","3/8","4/3"],"correct":0,"solution":"Surat va maxrajni EKUB(18,24)=6 ga bo'lamiz.\n18÷6 / 24÷6 = 3/4.","topic":"m3"},
{"id":"3-32","q":"Pitsa 8 ta teng bo'lakka bo'lindi. Aziz 3 bo'lak, Vali 2 bo'lak yedi. Pitsaning qancha qismi qoldi?","options":["3/8","5/8","1/4","6/8"],"correct":0,"solution":"Yeyilgan: 3 + 2 = 5 bo'lak.\nQolgan: 8 − 5 = 3 bo'lak = 3/8 qism.","topic":"m3"},
{"id":"3-18","q":"1 − 3/7 ni hisoblang.","options":["3/7","1/7","7/3","4/7"],"correct":3,"solution":"1 = 7/7.\n7/7 − 3/7 = 4/7.","topic":"m3"},
{"id":"3-21","q":"10 ning 2/5 qismini toping.","options":["20","4","2","25"],"correct":1,"solution":"10 : 5 = 2 — bitta beshdan bir qism.\n2 · 2 = 4.","topic":"m3"},
{"id":"3-23","q":"Soatning 1/4 qismi necha daqiqaga teng?","options":["15 daqiqa","20 daqiqa","25 daqiqa","30 daqiqa"],"correct":0,"solution":"1 soat = 60 daqiqa.\n1/4 qismi: 60 ÷ 4 = 15 daqiqa.","topic":"m3"},
{"id":"3-10","q":"Stakanda 3/4 qism suv bor edi, ustiga yana 1/2 stakan quyildi. Necha stakan suv bo'ldi?","options":["1 1/2 stakan","1 stakan","1 1/4 stakan","5/6 stakan"],"correct":2,"solution":"3/4 + 1/2 = 3/4 + 2/4 = 5/4 = 1 1/4 stakan.","topic":"m3"},
{"id":"3-42","q":"Quyidagi kasrlardan qaysi biri 1 dan katta?","options":["3/4","5/6","7/5","2/3"],"correct":2,"solution":"Surat maxrajdan katta bo'lsa, kasr 1 dan katta bo'ladi.\n7/5 da 7 > 5, demak 7/5 > 1.","topic":"m3"},
{"id":"3-46","q":"Kesma 6 ta teng bo'lakka bo'lingan va 4 tasi bo'yalgan. Bo'yalgan qism qaysi qisqarmas kasrga teng?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 328 90' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='20' y='22' width='48' height='46' fill='#a9cdee' stroke='#1170c4' stroke-width='2'/><rect x='68' y='22' width='48' height='46' fill='#a9cdee' stroke='#1170c4' stroke-width='2'/><rect x='116' y='22' width='48' height='46' fill='#a9cdee' stroke='#1170c4' stroke-width='2'/><rect x='164' y='22' width='48' height='46' fill='#a9cdee' stroke='#1170c4' stroke-width='2'/><rect x='212' y='22' width='48' height='46' fill='#fff' stroke='#1170c4' stroke-width='2'/><rect x='260' y='22' width='48' height='46' fill='#fff' stroke='#1170c4' stroke-width='2'/></svg>","options":["2/3","1/3","3/4","3/5"],"correct":0,"solution":"Bo'yalgan: 4/6.\nEKUB(4,6)=2 ga qisqartiramiz: 4/6 = 2/3.","topic":"m3"},
{"id":"4-28","q":"0,7 + 0,25 ni hisoblang.","options":["0,32","0,95","0,12","1,05"],"correct":1,"solution":"Vergullarni tenglashtiramiz: 0,70 + 0,25 = 0,95.","topic":"m4"},
{"id":"4-42","q":"3,5 − 1,8 ni hisoblang.","options":["1,7","2,3","1,3","2,7"],"correct":0,"solution":"3,5 − 1,8 = 1,7.\n(35 − 18 = 17, bir kasr xonasi → 1,7.)","topic":"m4"},
{"id":"4-25","q":"0,6 · 5 ni hisoblang.","options":["0,3","30","3","3,5"],"correct":2,"solution":"6 · 5 = 30, bitta kasr xonasi → 3,0 = 3.","topic":"m4"},
{"id":"4-39","q":"4,8 : 4 ni hisoblang.","options":["1,2","12","0,12","1,02"],"correct":0,"solution":"4,8 ÷ 4 = 1,2.\n(48 ÷ 4 = 12, bir kasr xonasi → 1,2.)","topic":"m4"},
{"id":"4-33","q":"0,2 · 0,3 ni hisoblang.","options":["0,6","0,5","0,12","0,06"],"correct":3,"solution":"2 · 3 = 6. Ikki kasr xonasi (0,2 va 0,3) → natijada 2 ta kasr xonasi: 0,06.","topic":"m4"},
{"id":"4-43","q":"1,25 ni oddiy kasrga aylantiring (qisqartirilgan).","options":["1/4","5/4","4/5","25/4"],"correct":1,"solution":"1,25 = 125/100.\nEKUB(125,100)=25 ga qisqartiramiz: 5/4.","topic":"m4"},
{"id":"4-40","q":"Sonlarni o'sish tartibida joylang: 0,45;  0,5;  0,405;  0,54.","options":["0,405; 0,45; 0,5; 0,54","0,45; 0,405; 0,5; 0,54","0,54; 0,5; 0,45; 0,405","0,405; 0,5; 0,45; 0,54"],"correct":0,"solution":"Xonama-xona taqqoslaymiz:\n0,405 < 0,45 < 0,5 < 0,54.","topic":"m4"},
{"id":"4-47","q":"7,382 sonini yuzdan birgacha (ikki kasr xonasigacha) yaxlitlang.","options":["7,39","7,4","7,38","7,3"],"correct":2,"solution":"Mingdan bir xonasi 2 (< 5), shuning uchun pastga tashlanadi.\n7,382 ≈ 7,38.","topic":"m4"},
{"id":"4-48","q":"0,001 ni 1000 ga ko'paytiring.","options":["0,1","10","100","1"],"correct":3,"solution":"1000 ga ko'paytirilganda vergul 3 xonaga o'ngga suriladi.\n0,001 · 1000 = 1.","topic":"m4"},
{"id":"4-30","q":"1 kg olma 8 500 so'm. 2,5 kg olma necha so'm bo'ladi?","options":["21 250 so'm","17 000 so'm","21 000 so'm","25 500 so'm"],"correct":0,"solution":"8 500 · 2,5 = 8 500·2 + 8 500·0,5 = 17 000 + 4 250 = 21 250 so'm.","topic":"m4"},
{"id":"4-34","q":"3,2 metr necha santimetrga teng?","options":["32 sm","320 sm","3 200 sm","0,32 sm"],"correct":1,"solution":"1 m = 100 sm.\n3,2 · 100 = 320 sm.","topic":"m4"},
{"id":"4-49","q":"Bitta daftar 4 200 so'm. Aziz 3 ta daftar oldi va 20 000 so'm berdi. Qancha qaytim oladi?","options":["8 400 so'm","6 800 so'm","7 400 so'm","12 600 so'm"],"correct":2,"solution":"3 ta daftar: 3 · 4 200 = 12 600 so'm.\nQaytim: 20 000 − 12 600 = 7 400 so'm.","topic":"m4"},
{"id":"4-46","q":"0,75 ni foizga aylantiring.","options":["75%","7,5%","0,75%","750%"],"correct":0,"solution":"Foizga aylantirish uchun 100 ga ko'paytiramiz.\n0,75 · 100 = 75%.","topic":"m4"},
{"id":"4-38","q":"Qaysi son kattaroq: 0,8 yoki 0,75?","options":["0,75","0,8","Teng","Aniqlab bo'lmaydi"],"correct":1,"solution":"0,8 = 0,80.\n0,80 > 0,75, demak 0,8 katta.","topic":"m4"},
{"id":"5-48","q":"−5 + 8 ni hisoblang.","options":["3","−3","13","−13"],"correct":0,"solution":"Belgilar har xil → modullar ayiriladi, katta modulning belgisi qoladi.\n8 − 5 = 3 (musbat).","topic":"m5"},
{"id":"5-41","q":"−3 − 7 ni hisoblang.","options":["−4","10","−10","4"],"correct":2,"solution":"−3 − 7 = −3 + (−7) = −10.\n(Ikkala son ham manfiy tomonga qo'shiladi.)","topic":"m5"},
{"id":"5-27","q":"−6 · (−4) ni hisoblang.","options":["−24","24","−10","10"],"correct":1,"solution":"Manfiy × manfiy = musbat.\n6 · 4 = 24.","topic":"m5"},
{"id":"5-29","q":"−20 : 5 ni hisoblang.","options":["−4","4","−15","−100"],"correct":0,"solution":"Manfiy : musbat = manfiy.\n20 ÷ 5 = 4 → −4.","topic":"m5"},
{"id":"5-24","q":"|−9| + |4| ni hisoblang.","options":["5","13","−13","36"],"correct":1,"solution":"|−9| = 9, |4| = 4.\n9 + 4 = 13.","topic":"m5"},
{"id":"5-42","q":"−7 sonining qarama-qarshi sonini toping.","options":["−7","1/7","7","0"],"correct":2,"solution":"Qarama-qarshi son belgisi bilan farq qiladi: −(−7) = 7.\n(−7) + 7 = 0.","topic":"m5"},
{"id":"5-34","q":"−12 va −8 sonlaridan qaysi biri katta?","options":["−12","−8","Teng","−20"],"correct":1,"solution":"Manfiy sonlarda 0 ga yaqinrog'i katta.\n−8 > −12.","topic":"m5"},
{"id":"5-40","q":"(−2)³ ni hisoblang.","options":["8","−8","−6","6"],"correct":1,"solution":"(−2)³ = (−2)·(−2)·(−2) = 4·(−2) = −8.\nToq daraja → natija manfiy.","topic":"m5"},
{"id":"5-35","q":"−15 + 15 ni hisoblang.","options":["0","30","−30","1"],"correct":0,"solution":"Qarama-qarshi sonlar yig'indisi 0 ga teng.\n−15 + 15 = 0.","topic":"m5"},
{"id":"5-1","q":"Termometr −4° ko'rsatardi. Harorat 9° ga ko'tarildi. Hozir necha gradus?","options":["−13°","13°","5°","−5°"],"correct":2,"solution":"−4 + 9 = 5°.","topic":"m5"},

{"id":"6-28","q":"2³ · 2² ni hisoblang.","options":["16","32","64","8"],"correct":1,"solution":"Asoslar bir xil → ko'rsatkichlar qo'shiladi: 2³·2² = 2⁵ = 32.","topic":"m6"},
{"id":"6-27","q":"7⁵ : 7³ ni hisoblang.","options":["7","49","343","14"],"correct":1,"solution":"Asoslar bir xil → ko'rsatkichlar ayiriladi: 7⁵:7³ = 7² = 49.","topic":"m6"},
{"id":"6-36","q":"(2³)² ni hisoblang.","options":["32","12","64","16"],"correct":2,"solution":"Daraja darajaga ko'tarilsa, ko'rsatkichlar ko'paytiriladi: 2^(3·2) = 2⁶ = 64.","topic":"m6"},
{"id":"6-47","q":"10⁰ ni hisoblang.","options":["0","10","1","100"],"correct":2,"solution":"Noldan farqli har qanday sonning nolinchi darajasi 1 ga teng.\n10⁰ = 1.","topic":"m6"},
{"id":"6-41","q":"(−3)² ni hisoblang.","options":["−9","6","9","−6"],"correct":2,"solution":"(−3)² = (−3)·(−3) = 9.\nJuft daraja → natija musbat.","topic":"m6"},
{"id":"6-40","q":"√64 ning qiymatini toping.","options":["8","32","16","6"],"correct":0,"solution":"Qaysi sonning kvadrati 64? 8² = 64.\n√64 = 8.","topic":"m6"},
{"id":"6-31","q":"√81 + √9 ni hisoblang.","options":["12","18","90","30"],"correct":0,"solution":"√81 = 9, √9 = 3.\n9 + 3 = 12.","topic":"m6"},
{"id":"6-2","q":"5³ ni hisoblang.","options":["15","125","25","75"],"correct":1,"solution":"5³ = 5·5·5 = 125.","topic":"m6"},
{"id":"6-6","q":"(1/2)³ ni hisoblang.","options":["1/6","3/2","1/8","1/4"],"correct":2,"solution":"(1/2)³ = 1³/2³ = 1/8.","topic":"m6"},
{"id":"6-34","q":"√100 − √36 ni hisoblang.","options":["8","64","2","4"],"correct":3,"solution":"√100 = 10, √36 = 6.\n10 − 6 = 4.","topic":"m6"},
{"id":"6-32","q":"3² + 4² ni hisoblang.","options":["49","25","7","12"],"correct":1,"solution":"3² = 9, 4² = 16.\n9 + 16 = 25.","topic":"m6"},
{"id":"6-30","q":"√49 · 2 ni hisoblang.","options":["98","18","14","7"],"correct":2,"solution":"√49 = 7.\n7 · 2 = 14.","topic":"m6"},
{"id":"11-45","q":"3x · 4x ko'paytmani toping.","options":["7x²","12x","12x²","12x³"],"correct":2,"solution":"Koeffitsiyentlar: 3·4 = 12.\nHarflar: x·x = x².\nNatija: 12x².","topic":"m11"},
{"id":"11-43","q":"−2a · 5a ko'paytmani toping.","options":["10a²","−7a²","−10a","−10a²"],"correct":3,"solution":"Koeffitsiyentlar: −2·5 = −10.\na·a = a².\nNatija: −10a².","topic":"m11"},
{"id":"11-17","q":"x² · x³ ni soddalashtiring.","options":["x⁶","x⁵","x","2x⁵"],"correct":1,"solution":"Asoslar bir xil → ko'rsatkichlar qo'shiladi: x^(2+3) = x⁵.","topic":"m11"},
{"id":"11-41","q":"6x⁵ : 2x² ni soddalashtiring.","options":["3x²","4x³","3x³","3x⁷"],"correct":2,"solution":"Koeffitsiyentlar: 6:2 = 3.\nx⁵:x² = x³.\nNatija: 3x³.","topic":"m11"},
{"id":"11-9","q":"(3x²)² ni soddalashtiring.","options":["6x⁴","9x⁴","9x²","3x⁴"],"correct":1,"solution":"(3x²)² = 3²·(x²)² = 9·x⁴ = 9x⁴.","topic":"m11"},
{"id":"11-47","q":"−4ab · 2a ko'paytmani toping.","options":["8a²b","−8a²b","−8ab²","−6a²b"],"correct":1,"solution":"Koeffitsiyentlar: −4·2 = −8.\na·a = a², b qoladi.\nNatija: −8a²b.","topic":"m11"},
{"id":"11-50","q":"7x³y birhadning darajasini toping.","options":["3","4","7","1"],"correct":1,"solution":"Daraja = harflar ko'rsatkichlari yig'indisi.\nx³ → 3, y → 1.\n3 + 1 = 4.","topic":"m11"},
{"id":"11-14","q":"−5x²y³ birhadning koeffitsiyentini toping.","options":["5","−5","2","−2"],"correct":1,"solution":"Koeffitsiyent — birhadning sonli qismi: −5.","topic":"m11"},
{"id":"11-46","q":"2x · 3y · x ni soddalashtiring.","options":["6xy","5x²y","6x²y","6xy²"],"correct":2,"solution":"Koeffitsiyentlar: 2·3 = 6.\nx·x = x², y qoladi.\nNatija: 6x²y.","topic":"m11"},
{"id":"11-39","q":"12a³b² : 4ab ni soddalashtiring.","options":["3ab","4a²b","3a³b²","3a²b"],"correct":3,"solution":"12:4 = 3.\na³:a = a², b²:b = b.\nNatija: 3a²b.","topic":"m11"},
{"id":"11-35","q":"(−2x)³ ni soddalashtiring.","options":["8x³","−6x³","−8x³","−2x³"],"correct":2,"solution":"(−2x)³ = (−2)³·x³ = −8·x³ = −8x³.\nToq daraja → manfiy.","topic":"m11"},
{"id":"11-38","q":"5x² + 3x² o'xshash birhadlarni qo'shing.","options":["8x⁴","15x²","8x²","8x"],"correct":2,"solution":"O'xshash birhadlarda koeffitsiyentlar qo'shiladi, harf qismi o'zgarmaydi.\n(5+3)x² = 8x².","topic":"m11"},
{"id":"11-51","q":"3·x·2·y·x birhadni standart shaklga keltiring.","options":["6xy","6x²y","5xy","6x²y²"],"correct":1,"solution":"Sonlarni ko'paytiramiz: 3·2 = 6.\nHarflarni: x·x·y = x²y.\nNatija: 6x²y.","topic":"m11"},
{"id":"11-27","q":"x³y · xy² ko'paytma birhadning darajasini toping.","options":["6","7","12","5"],"correct":1,"solution":"x³y · xy² = x⁴y³.\nDaraja = 4 + 3 = 7.","topic":"m11"},
{"id":"13-1","q":"Tenglamani yeching: x + 7 = 12","options":["5","19","4","7"],"correct":0,"solution":"x = 12 − 7 = 5.","topic":"m13"},
{"id":"13-2","q":"Tenglamani yeching: 3x = 21","options":["18","24","3","7"],"correct":3,"solution":"x = 21 ÷ 3 = 7.","topic":"m13"},
{"id":"13-18","q":"Tenglamani yeching: 2x − 5 = 11","options":["3","8","6","16"],"correct":1,"solution":"2x = 11 + 5 = 16.\nx = 16 ÷ 2 = 8.","topic":"m13"},
{"id":"13-3","q":"Tenglamani yeching: x : 4 = 6","options":["10","2","24","1,5"],"correct":2,"solution":"x = 6 · 4 = 24.","topic":"m13"},
{"id":"13-40","q":"Tenglamani yeching: 5x + 3 = 2x + 18","options":["7","5","3","6"],"correct":1,"solution":"5x − 2x = 18 − 3.\n3x = 15.\nx = 5.","topic":"m13"},
{"id":"13-28","q":"Tenglamani yeching: 4(x − 2) = 12","options":["4","6","1","5"],"correct":3,"solution":"Ikkala tomonni 4 ga bo'lamiz: x − 2 = 3.\nx = 3 + 2 = 5.","topic":"m13"},
{"id":"13-34","q":"Tenglamani yeching: x + x + 4 = 20","options":["16","12","8","10"],"correct":2,"solution":"2x + 4 = 20.\n2x = 16.\nx = 8.","topic":"m13"},
{"id":"13-35","q":"Bir son 3 marta orttirilib, ustiga 5 qo'shilsa, 26 hosil bo'ladi. Shu sonni toping.","options":["9","6","7","31"],"correct":2,"solution":"3x + 5 = 26.\n3x = 21.\nx = 7.","topic":"m13"},
{"id":"13-25","q":"Tenglamani yeching: 7 − 2x = 1","options":["4","−3","2","3"],"correct":3,"solution":"−2x = 1 − 7 = −6.\nx = (−6) ÷ (−2) = 3.","topic":"m13"},
{"id":"13-24","q":"Tenglamani yeching: (x + 3) : 2 = 5","options":["13","7","10","2"],"correct":1,"solution":"x + 3 = 5 · 2 = 10.\nx = 10 − 3 = 7.","topic":"m13"},
{"id":"14-27","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 7</span><span>x − y = 3</span></span></span>","options":["(5, 2)","(4, 3)","(6, 1)","(2, 5)"],"correct":0,"solution":"Ikki tenglamani qo'shamiz: 2x = 10 → x = 5.\ny = 7 − 5 = 2.\nYechim: (5, 2).","topic":"m14"},
{"id":"14-22","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 10</span><span>x − y = 2</span></span></span>","options":["(5, 5)","(6, 4)","(4, 6)","(7, 3)"],"correct":1,"solution":"Qo'shamiz: 2x = 12 → x = 6.\ny = 10 − 6 = 4.\nYechim: (6, 4).","topic":"m14"},
{"id":"14-40","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 2x</span><span>x + y = 12</span></span></span>","options":["(6, 6)","(3, 9)","(4, 8)","(8, 4)"],"correct":2,"solution":"y = 2x ni ikkinchiga qo'yamiz: x + 2x = 12 → 3x = 12 → x = 4.\ny = 2·4 = 8.\nYechim: (4, 8).","topic":"m14"},
{"id":"14-32","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 8</span><span>y = x + 2</span></span></span>","options":["(3, 5)","(5, 3)","(4, 4)","(2, 6)"],"correct":0,"solution":"y = x+2 ni qo'yamiz: x + (x+2) = 8 → 2x = 6 → x = 3.\ny = 3 + 2 = 5.\nYechim: (3, 5).","topic":"m14"},
{"id":"14-5","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + y = 11</span><span>y = 3</span></span></span>","options":["(3, 3)","(4, 3)","(5, 3)","(4, 4)"],"correct":1,"solution":"y = 3 ni qo'yamiz: 2x + 3 = 11 → 2x = 8 → x = 4.\nYechim: (4, 3).","topic":"m14"},
{"id":"14-19","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x − y = 2</span><span>2x + y = 13</span></span></span>","options":["(5, 3)","(3, 5)","(4, 2)","(6, 4)"],"correct":0,"solution":"Qo'shamiz: 3x = 15 → x = 5.\ny = x − 2 = 3.\nYechim: (5, 3).","topic":"m14"},
{"id":"14-6","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + 2y = 12</span><span>x = 2</span></span></span>","options":["(2, 2)","(2, 4)","(2, 3)","(2, 5)"],"correct":2,"solution":"x = 2 ni qo'yamiz: 6 + 2y = 12 → 2y = 6 → y = 3.\nYechim: (2, 3).","topic":"m14"},
{"id":"14-7","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + 2y = 11</span><span>x = 3</span></span></span>","options":["(3, 3)","(3, 4)","(3, 5)","(3, 2)"],"correct":1,"solution":"x = 3 ni qo'yamiz: 3 + 2y = 11 → 2y = 8 → y = 4.\nYechim: (3, 4).","topic":"m14"},
{"id":"14-20","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 6</span><span>2x − y = 6</span></span></span>","options":["(2, 4)","(3, 3)","(4, 2)","(5, 1)"],"correct":2,"solution":"Qo'shamiz: 3x = 12 → x = 4.\ny = 6 − 4 = 2.\nYechim: (4, 2).","topic":"m14"},
{"id":"14-30","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = x + 1</span><span>x + y = 9</span></span></span>","options":["(5, 4)","(4, 5)","(3, 6)","(6, 3)"],"correct":1,"solution":"y = x+1 ni qo'yamiz: x + (x+1) = 9 → 2x = 8 → x = 4.\ny = 5.\nYechim: (4, 5).","topic":"m14"},
{"id":"14-8","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + 3y = 12</span><span>y = 2</span></span></span>","options":["(2, 2)","(4, 2)","(3, 2)","(5, 2)"],"correct":2,"solution":"y = 2 ni qo'yamiz: 2x + 6 = 12 → 2x = 6 → x = 3.\nYechim: (3, 2).","topic":"m14"},
{"id":"14-17","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 5</span><span>x − y = −3</span></span></span>","options":["(1, 4)","(4, 1)","(2, 3)","(3, 2)"],"correct":0,"solution":"Qo'shamiz: 2x = 2 → x = 1.\ny = 5 − 1 = 4.\nYechim: (1, 4).","topic":"m14"},
{"id":"14-21","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>4x − y = 10</span><span>x + y = 5</span></span></span>","options":["(2, 3)","(3, 2)","(4, 1)","(1, 4)"],"correct":1,"solution":"Qo'shamiz: 5x = 15 → x = 3.\ny = 5 − 3 = 2.\nYechim: (3, 2).","topic":"m14"},
{"id":"14-26","q":"Ikki sonning yig'indisi 15, ayirmasi 3 ga teng. Kattaroq sonni toping.","options":["9","6","12","7,5"],"correct":0,"solution":"x + y = 15, x − y = 3.\nQo'shamiz: 2x = 18 → x = 9 (kattasi).\n(y = 6.)","topic":"m14"},

{"id":"16-53","q":"Jadvaldagi xaridlar uchun jami to'lovni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 326 160' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='8' y='8' width='310' height='144' rx='10' fill='#fff' stroke='#cfdbe5' stroke-width='1.5'/><path d='M 8 44 V 18 Q 8 8 18 8 H 308 Q 318 8 318 18 V 44 Z' fill='#0e7cc4'/><text x='63' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Mahsulot</text><text x='153' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Soni</text><text x='253' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>1 dona (so'm)</text><line x1='9' y1='44' x2='317' y2='44' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='63' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Ruchka</text><text x='153' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>4</text><text x='253' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>2 000</text><rect x='9' y='80' width='308' height='36' fill='#f0f6fb'/><line x1='9' y1='80' x2='317' y2='80' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='63' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Daftar</text><text x='153' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>3</text><text x='253' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>5 000</text><line x1='9' y1='116' x2='317' y2='116' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='63' y='134' text-anc {"id":"1-8","q":"37 × 24 ko'paytmani hisoblang.","options":["748","814","888","962"],"correct":2,"solution":"37 × 24 = 37 × 20 + 37 × 4 = 740 + 148 = 888.","topic":"m1","q_ru":"Вычислите произведение 37 × 24.","options_ru":["748","814","888","962"],"solution_ru":"37 × 24 = 37 × 20 + 37 × 4 = 740 + 148 = 888."},

{"id":"1-1","q":"8² + 6² ifodaning qiymatini hisoblang.","options":["48","84","100","196"],"correct":2,"solution":"8² = 64, 6² = 36. 64 + 36 = 100.","topic":"m1","q_ru":"Вычислите значение выражения 8² + 6².","options_ru":["48","84","100","196"],"solution_ru":"8² = 64, 6² = 36. 64 + 36 = 100."},
{"id":"1-24","q":"4536 sonini eng yaqin mingligacha yaxlitlang.","options":["4000","4500","4600","5000"],"correct":3,"solution":"4536 soni 4000 va 5000 orasida joylashgan. 4536 - 4000 = 536, 5000 - 4536 = 464. 5000 ga yaqinroq, shuning uchun javob 5000.","topic":"m1","q_ru":"Округлите число 4536 до ближайшей тысячи.","options_ru":["4000","4500","4600","5000"],"solution_ru":"Число 4536 расположено между 4000 и 5000. 4536 − 4000 = 536, 5000 − 4536 = 464. Оно ближе к 5000, поэтому ответ 5000."},
{"id":"1-7","q":"215 × 3 - 180 : 4 ifodaning qiymatini toping.","options":["555","600","645","690"],"correct":1,"solution":"215 × 3 = 645. 180 : 4 = 45. 645 - 45 = 600.","topic":"m1","q_ru":"Найдите значение выражения 215 × 3 − 180 : 4.","options_ru":["555","600","645","690"],"solution_ru":"215 × 3 = 645. 180 : 4 = 45. 645 − 45 = 600."},
{"id":"1-10","q":"(96 - 24) : 12 + 5 × 3 ifodaning qiymatini toping.","options":["15","18","21","24"],"correct":2,"solution":"96 - 24 = 72. 72 : 12 = 6. 5 × 3 = 15. 6 + 15 = 21.","topic":"m1","q_ru":"Найдите значение выражения (96 − 24) : 12 + 5 × 3.","options_ru":["15","18","21","24"],"solution_ru":"96 − 24 = 72. 72 : 12 = 6. 5 × 3 = 15. 6 + 15 = 21."},
{"id":"1-2","q":"2 dan 9 gacha bo'lgan barcha natural sonlar yig'indisini toping.","options":["40","42","44","48"],"correct":2,"solution":"2+3+4+5+6+7+8+9 = (2+9)×8:2 = 44.","topic":"m1","q_ru":"Найдите сумму всех натуральных чисел от 2 до 9.","options_ru":["40","42","44","48"],"solution_ru":"2+3+4+5+6+7+8+9 = (2+9)×8:2 = 44."},
{"id":"1-23","q":"7 ta ketma-ket natural sonning yig'indisi 70 ga teng. Eng katta sonni toping.","options":["12","13","14","15"],"correct":1,"solution":"7 ta ketma-ket sonning o'rta hadi yig'indini 7 ga bo'lishdan topiladi: 70:7=10. Sonlar 7,8,9,10,11,12,13 — eng kattasi 13.","topic":"m1","q_ru":"Сумма 7 последовательных натуральных чисел равна 70. Найдите наибольшее число.","options_ru":["12","13","14","15"],"solution_ru":"Средний член 7 последовательных чисел находится делением суммы на 7: 70:7=10. Числа: 7,8,9,10,11,12,13 — наибольшее из них 13."},
{"id":"1-3","q":"356 ni 1000 dan ayirib, hosil bo'lgan ayirmani 4 ga ko'paytiring.","options":["2496","2576","2616","2704"],"correct":1,"solution":"1000 - 356 = 644. 644 × 4 = 2576.","topic":"m1","q_ru":"Вычтите 356 из 1000, полученную разность умножьте на 4.","options_ru":["2496","2576","2616","2704"],"solution_ru":"1000 − 356 = 644. 644 × 4 = 2576."},
{"id":"2-11","q":"84 va 126 sonlarining EKUBini (eng katta umumiy bo'luvchisini) toping.","options":["21","42","63","84"],"correct":1,"solution":"84 = 2²×3×7, 126 = 2×3²×7. Umumiy ko'paytuvchilar: 2×3×7 = 42.","topic":"m2","q_ru":"Найдите НОД (наибольший общий делитель) чисел 84 и 126.","options_ru":["21","42","63","84"],"solution_ru":"84 = 2²×3×7, 126 = 2×3²×7. Общие множители: 2×3×7 = 42."},
{"id":"2-6","q":"18, 24 va 36 sonlarining EKUKini (eng kichik umumiy bo'linuvchisini) toping.","options":["36","48","72","144"],"correct":2,"solution":"18=2×3², 24=2³×3, 36=2²×3². EKUK = 2³×3² = 72.","topic":"m2","q_ru":"Найдите НОК (наименьшее общее кратное) чисел 18, 24 и 36.","options_ru":["36","48","72","144"],"solution_ru":"18=2×3², 24=2³×3, 36=2²×3². НОК = 2³×3² = 72."},
{"id":"2-19","q":"936 sonini 8 ga bo'lgandagi bo'linmani toping.","options":["107","117","127","137"],"correct":1,"solution":"936 : 8 = 117.\nTekshirish: 8 · 117 = 936 ✓","topic":"m2","q_ru":"Найдите частное от деления числа 936 на 8.","options_ru":["107","117","127","137"],"solution_ru":"936 : 8 = 117.\nПроверка: 8 · 117 = 936 ✓"},
{"id":"2-37","q":"Quyidagi sonlardan qaysi biri 9 ga bo'linadi: 2345, 3344, 5104, 6831?","options":["2345","3344","5104","6831"],"correct":3,"solution":"Son 9 ga bo'linishi uchun raqamlari yig'indisi 9 ga bo'linishi kerak. 6+8+3+1=18, 18:9=2 — bo'linadi. Qolganlar: 2345→14, 3344→14, 5104→10 — 9 ga bo'linmaydi.","topic":"m2","q_ru":"Какое из следующих чисел делится на 9: 2345, 3344, 5104, 6831?","options_ru":["2345","3344","5104","6831"],"solution_ru":"Чтобы число делилось на 9, сумма его цифр должна делиться на 9. 6+8+3+1=18, 18:9=2 — делится. Остальные: 2345→14, 3344→14, 5104→10 — на 9 не делятся."},
{"id":"2-12","q":"120 sonining barcha natural bo'luvchilari sonini toping.","options":["12","14","16","18"],"correct":2,"solution":"120 = 2³×3×5. Bo'luvchilar soni = (3+1)(1+1)(1+1) = 4×2×2 = 16.","topic":"m2","q_ru":"Найдите количество всех натуральных делителей числа 120.","options_ru":["12","14","16","18"],"solution_ru":"120 = 2³×3×5. Количество делителей = (3+1)(1+1)(1+1) = 4×2×2 = 16."},
{"id":"2-17","q":"48 va 60 sonlarining EKUBi 12 ga teng. Shu ma'lumotdan foydalanib EKUKini toping (EKUB×EKUK sonlar ko'paytmasiga teng).","options":["180","240","288","360"],"correct":1,"solution":"48 × 60 = 2880. EKUB × EKUK = 2880, EKUB=12 bo'lgani uchun EKUK = 2880 : 12 = 240.","topic":"m2","q_ru":"НОД чисел 48 и 60 равен 12. Используя это, найдите их НОК (НОД×НОК равно произведению чисел).","options_ru":["180","240","288","360"],"solution_ru":"48 × 60 = 2880. НОД × НОК = 2880, так как НОД=12, то НОК = 2880 : 12 = 240."},
{"id":"2-5","q":"45 va 75 sonlarining EKUBini toping va har ikki sonni shu songa bo'lib, hosil bo'lgan sonlarning yig'indisini toping.","options":["6","7","8","9"],"correct":2,"solution":"EKUB(45,75)=15. 45:15=3, 75:15=5. 3+5=8.","topic":"m2","q_ru":"Найдите НОД чисел 45 и 75, затем разделите оба числа на него и найдите сумму полученных чисел.","options_ru":["6","7","8","9"],"solution_ru":"НОД(45,75)=15. 45:15=3, 75:15=5. 3+5=8."},

{"id":"7-31","q":"Bankka 200000 so'm qo'yilgan, yillik foiz stavkasi 8%. 1 yildan keyin hisobdagi summa qancha bo'ladi?","options":["208000 so'm","210000 so'm","216000 so'm","224000 so'm"],"correct":2,"solution":"Foiz: 200000 × 8 : 100 = 16000. Yakuniy summa: 200000 + 16000 = 216000 so'm.","topic":"m7","q_ru":"В банк положено 200000 сум под 8% годовых. Сколько будет на счёте через 1 год?","options_ru":["208000 сум","210000 сум","216000 сум","224000 сум"],"solution_ru":"Проценты: 200000 × 8 : 100 = 16000. Итоговая сумма: 200000 + 16000 = 216000 сум."},
