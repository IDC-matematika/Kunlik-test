{"id":"11-16","q":"5m³n² va -3m³n² birhadlarning yig'indisini toping.","options":["2m³n²","2m⁶n⁴","8m³n²","-2m³n²"],"correct":0,"solution":"O'xshash hadlar: 5m³n² + (-3m³n²) = (5-3)m³n² = 2m³n².","topic":"m11","q_ru":"Найдите сумму одночленов 5m³n² и −3m³n².","options_ru":["2m³n²","2m⁶n⁴","8m³n²","−2m³n²"],"solution_ru":"Подобные члены: 5m³n² + (−3m³n²) = (5−3)m³n² = 2m³n²."},
{"id":"11-5","q":"(3x²)² × x ifodani soddalashtiring.","options":["6x⁵","9x⁴","9x⁵","3x⁵"],"correct":2,"solution":"(3x²)² = 9x⁴. 9x⁴ × x = 9x⁵.","topic":"m11","q_ru":"Упростите выражение (3x²)² × x.","options_ru":["6x⁵","9x⁴","9x⁵","3x⁵"],"solution_ru":"(3x²)² = 9x⁴. 9x⁴ × x = 9x⁵."},
{"id":"11-20","q":"-7a⁴b² birhadning koeffitsiyenti bilan darajasi yig'indisini toping.","options":["-3","-1","1","3"],"correct":1,"solution":"Koeffitsiyent = -7. Daraja = 4+2 = 6. Yig'indi: -7 + 6 = -1.","topic":"m11","q_ru":"Найдите сумму коэффициента и степени одночлена −7a⁴b².","options_ru":["−3","−1","1","3"],"solution_ru":"Коэффициент = −7. Степень = 4+2 = 6. Сумма: −7 + 6 = −1."},
{"id":"11-15","q":"2x³ × 5x⁴ ifodani soddalashtiring.","options":["7x⁷","10x⁷","10x¹²","7x¹²"],"correct":1,"solution":"Koeffitsiyentlar: 2×5=10. x³×x⁴=x⁷. Natija: 10x⁷.","topic":"m11","q_ru":"Упростите выражение 2x³ × 5x⁴.","options_ru":["7x⁷","10x⁷","10x¹²","7x¹²"],"solution_ru":"Коэффициенты: 2×5=10. x³×x⁴=x⁷. Результат: 10x⁷."},
{"id":"11-18","q":"(4a²b³)² : (2ab)² ifodani soddalashtiring.","options":["2a²b⁴","4a²b⁴","4a⁴b⁶","8a²b⁴"],"correct":1,"solution":"(4a²b³)² = 16a⁴b⁶. (2ab)² = 4a²b². 16a⁴b⁶ : 4a²b² = 4a²b⁴.","topic":"m11","q_ru":"Упростите выражение (4a²b³)² : (2ab)².","options_ru":["2a²b⁴","4a²b⁴","4a⁴b⁶","8a²b⁴"],"solution_ru":"(4a²b³)² = 16a⁴b⁶. (2ab)² = 4a²b². 16a⁴b⁶ : 4a²b² = 4a²b⁴."},
{"id":"11-1","q":"6x⁴y⁵ dan 2x⁴y⁵ ni ayiring.","options":["4x⁴y⁵","4x⁸y¹⁰","8x⁴y⁵","3x⁴y⁵"],"correct":0,"solution":"(6-2)x⁴y⁵ = 4x⁴y⁵.","topic":"m11","q_ru":"Из 6x⁴y⁵ вычтите 2x⁴y⁵.","options_ru":["4x⁴y⁵","4x⁸y¹⁰","8x⁴y⁵","3x⁴y⁵"],"solution_ru":"(6−2)x⁴y⁵ = 4x⁴y⁵."},
{"id":"11-13","q":"-3x²y³ birhadni kvadratga ko'taring.","options":["-9x⁴y⁶","9x⁴y⁶","9x²y³","-6x⁴y⁶"],"correct":1,"solution":"(-3x²y³)² = (-3)² × (x²)² × (y³)² = 9x⁴y⁶.","topic":"m11","q_ru":"Возведите одночлен −3x²y³ в квадрат.","options_ru":["−9x⁴y⁶","9x⁴y⁶","9x²y³","−6x⁴y⁶"],"solution_ru":"(−3x²y³)² = (−3)² × (x²)² × (y³)² = 9x⁴y⁶."},
{"id":"12-38","q":"Kvadratning tomoni x sm. Har bir tomoni 3 sm ga uzaytirilsa, kvadratning yuzi qanchaga ortadi?","options":["6x + 9","9","3x + 9","6x"],"correct":0,"solution":"Yangi yuza: (x + 3)² = x² + 6x + 9.\nOrtish: (x² + 6x + 9) − x² = 6x + 9 sm².","topic":"m12","q_ru":"Сторона квадрата x см. Каждую сторону увеличили на 3 см. На сколько увеличилась площадь квадрата?","options_ru":["6x + 9","9","3x + 9","6x"],"solution_ru":"Новая площадь: (x + 3)² = x² + 6x + 9.\nУвеличение: (x² + 6x + 9) − x² = 6x + 9 см²."},
{"id":"12-14","q":"(2x-1)(x+4) ko'paytmani ko'phad ko'rinishida yozing.","options":["2x²+7x-4","2x²-7x-4","2x²+9x-4","2x²+7x+4"],"correct":0,"solution":"(2x-1)(x+4) = 2x² + 8x - x - 4 = 2x² + 7x - 4.","topic":"m12","q_ru":"Запишите произведение (2x−1)(x+4) в виде многочлена.","options_ru":["2x²+7x−4","2x²−7x−4","2x²+9x−4","2x²+7x+4"],"solution_ru":"(2x−1)(x+4) = 2x² + 8x − x − 4 = 2x² + 7x − 4."},
{"id":"12-10","q":"(x+7)² ifodani ochib yozing.","options":["x²+49","x²+14x+49","x²+7x+49","x²+14x+14"],"correct":1,"solution":"(x+7)² = x² + 2×x×7 + 7² = x² + 14x + 49.","topic":"m12","q_ru":"Раскройте выражение (x+7)².","options_ru":["x²+49","x²+14x+49","x²+7x+49","x²+14x+14"],"solution_ru":"(x+7)² = x² + 2×x×7 + 7² = x² + 14x + 49."},
{"id":"12-11","q":"(x-6)² ifodani ochib yozing.","options":["x²-36","x²-12x+36","x²-6x+36","x²+12x+36"],"correct":1,"solution":"(x-6)² = x² - 2×x×6 + 6² = x² - 12x + 36.","topic":"m12","q_ru":"Раскройте выражение (x−6)².","options_ru":["x²−36","x²−12x+36","x²−6x+36","x²+12x+36"],"solution_ru":"(x−6)² = x² − 2×x×6 + 6² = x² − 12x + 36."},
{"id":"12-21","q":"(x-5)(x+5) ifodani ochib yozing.","options":["x²-25","x²+25","x²-10x-25","x²-10x+25"],"correct":0,"solution":"(x-5)(x+5) = x² - 5² = x² - 25 (kvadratlar ayirmasi formulasi).","topic":"m12","q_ru":"Раскройте выражение (x−5)(x+5).","options_ru":["x²−25","x²+25","x²−10x−25","x²−10x+25"],"solution_ru":"(x−5)(x+5) = x² − 5² = x² − 25 (формула разности квадратов)."},
{"id":"12-22","q":"(3x²+2x-1) + (x²-5x+4) yig'indini soddalashtiring.","options":["4x²-3x+3","4x²+3x+3","4x²-3x-3","2x²-3x+3"],"correct":0,"solution":"O'xshash hadlarni qo'shamiz: (3+1)x² + (2-5)x + (-1+4) = 4x² - 3x + 3.","topic":"m12","q_ru":"Упростите сумму (3x²+2x−1) + (x²−5x+4).","options_ru":["4x²−3x+3","4x²+3x+3","4x²−3x−3","2x²−3x+3"],"solution_ru":"Складываем подобные члены: (3+1)x² + (2−5)x + (−1+4) = 4x² − 3x + 3."},
{"id":"12-12","q":"(5x²-3x+2) - (2x²+x-6) ayirmani soddalashtiring.","options":["3x²-4x+8","3x²-2x-4","3x²-4x-4","7x²-2x-4"],"correct":0,"solution":"(5-2)x² + (-3-1)x + (2+6) = 3x² - 4x + 8.","topic":"m12","q_ru":"Упростите разность (5x²−3x+2) − (2x²+x−6).","options_ru":["3x²−4x+8","3x²−2x−4","3x²−4x−4","7x²−2x−4"],"solution_ru":"(5−2)x² + (−3−1)x + (2+6) = 3x² − 4x + 8."},
{"id":"12-7","q":"P(x) = 2x² - 3x + 1 bo'lsa, P(2) ni toping.","options":["1","3","5","7"],"correct":1,"solution":"P(2) = 2×4 - 3×2 + 1 = 8 - 6 + 1 = 3.","topic":"m12","q_ru":"Если P(x) = 2x² − 3x + 1, найдите P(2).","options_ru":["1","3","5","7"],"solution_ru":"P(2) = 2×4 − 3×2 + 1 = 8 − 6 + 1 = 3."},
{"id":"12-18","q":"x² - 9x ko'phadini umumiy ko'paytuvchini chiqarib ko'paytuvchilarga ajratib yozing.","options":["x(x-9)","x(x+9)","x(9-x)","x²(x-9)"],"correct":0,"solution":"Har ikki hadda x umumiy ko'paytuvchi: x² - 9x = x(x-9).","topic":"m12","q_ru":"Разложите многочлен x² − 9x на множители, вынеся общий множитель.","options_ru":["x(x-9)","x(x+9)","x(9-x)","x²(x-9)"],"solution_ru":"В обоих членах общий множитель x: x² − 9x = x(x−9)."},
{"id":"12-29","q":"(x-2)(x²+2x+4) ko'paytmani soddalashtiring.","options":["x³-8","x³+8","x³-2x²-8","x³-6x-8"],"correct":0,"solution":"Bu kublar ayirmasi formulasi: (a-b)(a²+ab+b²)=a³-b³, bunda a=x, b=2. Natija: x³-8.","topic":"m12","q_ru":"Упростите произведение (x−2)(x²+2x+4).","options_ru":["x³−8","x³+8","x³−2x²−8","x³−6x−8"],"solution_ru":"Это формула разности кубов: (a−b)(a²+ab+b²)=a³−b³, где a=x, b=2. Результат: x³−8."},
{"id":"13-9","q":"3(x-2) + 5 = 2x + 7 tenglamani yeching.","options":["6","7","8","9"],"correct":2,"solution":"3x - 6 + 5 = 2x + 7 → 3x - 1 = 2x + 7 → x = 8.","topic":"m13","q_ru":"Решите уравнение 3(x−2) + 5 = 2x + 7.","options_ru":["6","7","8","9"],"solution_ru":"3x − 6 + 5 = 2x + 7 → 3x − 1 = 2x + 7 → x = 8."},
{"id":"13-19","q":"(x+3)/4 = (2x-1)/6 tenglamani yeching.","options":["9","10","11","12"],"correct":2,"solution":"Har ikki tomonni 12 ga ko'paytiramiz: 3(x+3) = 2(2x-1) → 3x+9 = 4x-2 → x = 11.","topic":"m13","q_ru":"Решите уравнение (x+3)/4 = (2x−1)/6.","options_ru":["9","10","11","12"],"solution_ru":"Умножим обе части на 12: 3(x+3) = 2(2x−1) → 3x+9 = 4x−2 → x = 11."},
{"id":"13-6","q":"5x - 3(x-4) = 20 tenglamani yeching.","options":["2","4","6","8"],"correct":1,"solution":"5x - 3x + 12 = 20 → 2x = 8 → x = 4.","topic":"m13","q_ru":"Решите уравнение 5x − 3(x−4) = 20.","options_ru":["2","4","6","8"],"solution_ru":"5x − 3x + 12 = 20 → 2x = 8 → x = 4."},
{"id":"13-12","q":"2(3x+1) - 4(x-2) = 18 tenglamani yeching.","options":["3","4","5","6"],"correct":1,"solution":"6x + 2 - 4x + 8 = 18 → 2x + 10 = 18 → 2x = 8 → x = 4.","topic":"m13","q_ru":"Решите уравнение 2(3x+1) − 4(x−2) = 18.","options_ru":["3","4","5","6"],"solution_ru":"6x + 2 − 4x + 8 = 18 → 2x + 10 = 18 → 2x = 8 → x = 4."},
{"id":"13-4","q":"Bir sonni 3 ga ko'paytirib, natijadan 7 ni ayirsak, 20 hosil bo'ladi. Shu sonni toping.","options":["7","8","9","10"],"correct":2,"solution":"3x - 7 = 20 → 3x = 27 → x = 9.","topic":"m13","q_ru":"Если некоторое число умножить на 3 и из результата вычесть 7, получится 20. Найдите это число.","options_ru":["7","8","9","10"],"solution_ru":"3x − 7 = 20 → 3x = 27 → x = 9."},
{"id":"13-27","q":"Otaning yoshi o'g'lining yoshidan 24 yosh katta. 5 yildan keyin otaning yoshi o'g'lining yoshidan 3 marta katta bo'ladi. O'g'ilning hozirgi yoshini toping.","options":["5","6","7","8"],"correct":2,"solution":"O'g'il x yoshda, ota x+24 yoshda. 5 yildan keyin: x+24+5 = 3(x+5) → x+29 = 3x+15 → 14 = 2x → x = 7.","topic":"m13","q_ru":"Отец старше сына на 24 года. Через 5 лет отец будет старше сына в 3 раза. Найдите текущий возраст сына.","options_ru":["5","6","7","8"],"solution_ru":"Сын — x лет, отец — x+24 лет. Через 5 лет: x+24+5 = 3(x+5) → x+29 = 3x+15 → 14 = 2x → x = 7."},
{"id":"13-14","q":"(2x-5)/3 + 1 = x tenglamani yeching.","options":["-3","-2","-1","2"],"correct":1,"solution":"Har ikki tomonni 3 ga ko'paytiramiz: 2x-5+3=3x → 2x-2=3x → -2=x.","topic":"m13","q_ru":"Решите уравнение (2x−5)/3 + 1 = x.","options_ru":["−3","−2","−1","2"],"solution_ru":"Умножим обе части на 3: 2x−5+3=3x → 2x−2=3x → −2=x."},
{"id":"13-8","q":"0,5x + 1,5 = 0,2x + 6 tenglamani yeching.","options":["10","12","15","18"],"correct":2,"solution":"0,5x - 0,2x = 6 - 1,5 → 0,3x = 4,5 → x = 15.","topic":"m13","q_ru":"Решите уравнение 0,5x + 1,5 = 0,2x + 6.","options_ru":["10","12","15","18"],"solution_ru":"0,5x − 0,2x = 6 − 1,5 → 0,3x = 4,5 → x = 15."},
{"id":"13-13","q":"x/3 + x/4 = 7 tenglamani yeching.","options":["10","12","14","21"],"correct":1,"solution":"Umumiy maxraj 12: 4x/12 + 3x/12 = 7 → 7x/12 = 7 → x = 12.","topic":"m13","q_ru":"Решите уравнение x/3 + x/4 = 7.","options_ru":["10","12","14","21"],"solution_ru":"Общий знаменатель 12: 4x/12 + 3x/12 = 7 → 7x/12 = 7 → x = 12."},
{"id":"13-15","q":"Ikkita sonning yig'indisi 45. Ulardan biri ikkinchisidan 9 ta katta. Kichik sonni toping.","options":["16","17","18","19"],"correct":2,"solution":"Kichik son x, katta son x+9. x + (x+9) = 45 → 2x+9=45 → 2x=36 → x=18.","topic":"m13","q_ru":"Сумма двух чисел равна 45. Одно из них на 9 больше другого. Найдите меньшее число.","options_ru":["16","17","18","19"],"solution_ru":"Меньшее число x, большее x+9. x + (x+9) = 45 → 2x+9=45 → 2x=36 → x=18."},
{"id":"14-36","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + 2y = 11</span><span>x − y = 2</span></span></span>","options":["x=5, y=3","x=3, y=5","x=7, y=2","x=4, y=3,5"],"correct":0,"solution":"Ikkinchi tenglamadan x = y+2. Birinchiga qo'yamiz: (y+2)+2y=11 → 3y+2=11 → 3y=9 → y=3. U holda x=5.\nTekshirish: 5+2×3=11 ✓, 5−3=2 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + 2y = 11</span><span>x − y = 2</span></span></span>","options_ru":["x=5, y=3","x=3, y=5","x=7, y=2","x=4, y=3,5"],"solution_ru":"Из второго уравнения x = y+2. Подставляем в первое: (y+2)+2y=11 → 3y+2=11 → 3y=9 → y=3. Тогда x=5.\nПроверка: 5+2×3=11 ✓, 5−3=2 ✓."},
{"id":"14-45","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x − 2y = 4</span><span>x + y = 8</span></span></span>","options":["x=4, y=4","x=3, y=5","x=5, y=3","x=2, y=6"],"correct":0,"solution":"Ikkinchi tenglamadan x=8−y. Birinchiga qo'yamiz: 3(8−y)−2y=4 → 24−3y−2y=4 → 24−5y=4 → 5y=20 → y=4. U holda x=4.\nTekshirish: 3×4−2×4=4 ✓, 4+4=8 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x − 2y = 4</span><span>x + y = 8</span></span></span>","options_ru":["x=4, y=4","x=3, y=5","x=5, y=3","x=2, y=6"],"solution_ru":"Из второго уравнения x=8−y. Подставляем в первое: 3(8−y)−2y=4 → 24−3y−2y=4 → 24−5y=4 → 5y=20 → y=4. Тогда x=4.\nПроверка: 3×4−2×4=4 ✓, 4+4=8 ✓."},
{"id":"14-47","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + y = 11</span><span>x − 2y = −2</span></span></span>","options":["x=4, y=3","x=3, y=4","x=5, y=1","x=6, y=-1"],"correct":0,"solution":"Birinchi tenglamani 2 ga ko'paytiramiz: 4x+2y=22. Ikkinchi tenglama bilan qo'shamiz: 5x=20 → x=4. U holda y=11−2×4=3.\nTekshirish: 2×4+3=11 ✓, 4−2×3=−2 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + y = 11</span><span>x − 2y = −2</span></span></span>","options_ru":["x=4, y=3","x=3, y=4","x=5, y=1","x=6, y=−1"],"solution_ru":"Умножим первое уравнение на 2: 4x+2y=22. Сложим со вторым уравнением: 5x=20 → x=4. Тогда y=11−2×4=3.\nПроверка: 2×4+3=11 ✓, 4−2×3=−2 ✓."},
{"id":"14-28","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x = 3y</span><span>2x + y = 21</span></span></span>","options":["x=9, y=3","x=6, y=2","x=12, y=4","x=3, y=9"],"correct":0,"solution":"x=3y ni ikkinchi tenglamaga qo'yamiz: 2×3y+y=21 → 7y=21 → y=3. U holda x=3×3=9.\nTekshirish: x=3y → 9=3×3 ✓, 2×9+3=21 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x = 3y</span><span>2x + y = 21</span></span></span>","options_ru":["x=9, y=3","x=6, y=2","x=12, y=4","x=3, y=9"],"solution_ru":"Подставляем x=3y во второе уравнение: 2×3y+y=21 → 7y=21 → y=3. Тогда x=3×3=9.\nПроверка: x=3y → 9=3×3 ✓, 2×9+3=21 ✓."},
{"id":"14-3","q":"Ikkita sonning yig'indisi 50 ga, ayirmasi 12 ga teng. Katta sonni toping.","options":["28","29","31","33"],"correct":2,"solution":"Katta son x, kichik son y bo'lsin. x+y=50 va x−y=12. Tenglamalarni qo'shsak: 2x=62 → x=31.","topic":"m14","q_ru":"Сумма двух чисел равна 50, а разность равна 12. Найдите большее число.","options_ru":["28","29","31","33"],"solution_ru":"Пусть большее число x, меньшее y. x+y=50 и x−y=12. Сложив уравнения: 2x=62 → x=31."},
{"id":"14-38","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + 2y = 19</span><span>x − y = 3</span></span></span>","options":["x=5, y=2","x=4, y=1","x=6, y=3","x=7, y=4"],"correct":0,"solution":"Ikkinchi tenglamadan x=y+3. Birinchiga qo'yamiz: 3(y+3)+2y=19 → 5y+9=19 → 5y=10 → y=2. U holda x=5.\nTekshirish: 3×5+2×2=19 ✓, 5−2=3 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + 2y = 19</span><span>x − y = 3</span></span></span>","options_ru":["x=5, y=2","x=4, y=1","x=6, y=3","x=7, y=4"],"solution_ru":"Из второго уравнения x=y+3. Подставляем в первое: 3(y+3)+2y=19 → 5y+9=19 → 5y=10 → y=2. Тогда x=5.\nПроверка: 3×5+2×2=19 ✓, 5−2=3 ✓."},
{"id":"14-44","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + 5y = 7</span><span>x + 3y = 3</span></span></span>","options":["x=6, y=-1","x=-1, y=6","x=3, y=0","x=8, y=-2"],"correct":0,"solution":"Ikkinchi tenglamadan x=3−3y. Birinchiga qo'yamiz: 2(3−3y)+5y=7 → 6−y=7 → y=−1. U holda x=3−3×(−1)=6.\nTekshirish: 2×6+5×(−1)=7 ✓, 6+3×(−1)=3 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + 5y = 7</span><span>x + 3y = 3</span></span></span>","options_ru":["x=6, y=−1","x=−1, y=6","x=3, y=0","x=8, y=−2"],"solution_ru":"Из второго уравнения x=3−3y. Подставляем в первое: 2(3−3y)+5y=7 → 6−y=7 → y=−1. Тогда x=3−3×(−1)=6.\nПроверка: 2×6+5×(−1)=7 ✓, 6+3×(−1)=3 ✓."},
{"id":"14-23","q":"Bir qalam 1500 so'm, bir daftar 2500 so'm turadi. Ikkisidan jami 10 ta sotib olinib, 19000 so'm to'landi. Nechta daftar sotib olingan?","options":["3","4","5","6"],"correct":1,"solution":"Qalamlar soni p, daftarlar soni d bo'lsin. p+d=10 va 1500p+2500d=19000. p=10−d ni qo'yamiz: 1500(10−d)+2500d=19000 → 15000+1000d=19000 → 1000d=4000 → d=4.","topic":"m14","q_ru":"Один карандаш стоит 1500 сум, одна тетрадь — 2500 сум. Всего купили 10 штук (карандашей и тетрадей) и заплатили 19000 сум. Сколько тетрадей было куплено?","options_ru":["3","4","5","6"],"solution_ru":"Пусть количество карандашей p, тетрадей d. p+d=10 и 1500p+2500d=19000. Подставляем p=10−d: 1500(10−d)+2500d=19000 → 15000+1000d=19000 → 1000d=4000 → d=4."},
{"id":"14-24","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 2x + 1</span><span>3x + y = 11</span></span></span>","options":["x=2, y=5","x=5, y=2","x=3, y=7","x=1, y=3"],"correct":0,"solution":"y=2x+1 ni ikkinchiga qo'yamiz: 3x+2x+1=11 → 5x=10 → x=2. U holda y=2×2+1=5.\nTekshirish: 5=2×2+1 ✓, 3×2+5=11 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 2x + 1</span><span>3x + y = 11</span></span></span>","options_ru":["x=2, y=5","x=5, y=2","x=3, y=7","x=1, y=3"],"solution_ru":"Подставляем y=2x+1 во второе: 3x+2x+1=11 → 5x=10 → x=2. Тогда y=2×2+1=5.\nПроверка: 5=2×2+1 ✓, 3×2+5=11 ✓."},
{"id":"14-41","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x − 2y = −1</span><span>x + y = 11</span></span></span>","options":["x=7, y=4","x=4, y=7","x=9, y=2","x=5, y=6"],"correct":0,"solution":"Ikkinchi tenglamadan x=11−y. Birinchiga qo'yamiz: (11−y)−2y=−1 → 11−3y=−1 → 3y=12 → y=4. U holda x=7.\nTekshirish: 7−2×4=−1 ✓, 7+4=11 ✓.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x − 2y = −1</span><span>x + y = 11</span></span></span>","options_ru":["x=7, y=4","x=4, y=7","x=9, y=2","x=5, y=6"],"solution_ru":"Из второго уравнения x=11−y. Подставляем в первое: (11−y)−2y=−1 → 11−3y=−1 → 3y=12 → y=4. Тогда x=7.\nПроверка: 7−2×4=−1 ✓, 7+4=11 ✓."},
{"id":"15-23","q":"Mashina 3 soatda 240 km yo'l bosdi. Qaytishda u 20 km/soat tezroq yurdi. Qaytish uchun necha soat ketdi?","options":["2 soat","2,2 soat","2,4 soat","2,5 soat"],"correct":2,"solution":"Borishdagi tezlik: 240:3=80 km/soat. Qaytishdagi tezlik: 80+20=100 km/soat. Qaytish vaqti: 240:100=2,4 soat.","topic":"m15","q_ru":"Машина проехала 240 км за 3 часа. На обратном пути она двигалась на 20 км/ч быстрее. Сколько часов заняла обратная дорога?","options_ru":["2 часа","2,2 часа","2,4 часа","2,5 часа"],"solution_ru":"Скорость туда: 240:3=80 км/ч. Скорость обратно: 80+20=100 км/ч. Время обратно: 240:100=2,4 часа."},
{"id":"15-22","q":"Bir ishchi ishni 12 kunda, ikkinchisi 8 kunda bajaradi. Ikkisi birgalikda ishlasa, ish necha kunda bajariladi?","options":["4 kun","4,5 kun","4,8 kun","5 kun"],"correct":2,"solution":"1-ishchining bir kunlik ulushi 1/12, 2-ishchiniki 1/8. Birgalikda: 1/12+1/8=5/24. Vaqt = 24/5 = 4,8 kun.","topic":"m15","q_ru":"Один рабочий выполняет работу за 12 дней, другой — за 8 дней. За сколько дней они выполнят работу вместе?","options_ru":["4 дня","4,5 дня","4,8 дня","5 дней"],"solution_ru":"Доля работы 1-го рабочего за день — 1/12, 2-го — 1/8. Вместе: 1/12+1/8=5/24. Время = 24/5 = 4,8 дня."},
{"id":"15-17","q":"Onaning yoshi qizining yoshidan 28 yosh katta. 4 yildan keyin onaning yoshi qizining yoshidan 3 marta katta bo'ladi. Hozir qizining yoshi nechada?","options":["8","9","10","12"],"correct":2,"solution":"Qiz x yoshda, ona x+28 yoshda. 4 yildan keyin: x+28+4=3(x+4) → x+32=3x+12 → 20=2x → x=10.","topic":"m15","q_ru":"Мать старше дочери на 28 лет. Через 4 года мать будет старше дочери в 3 раза. Сколько лет дочери сейчас?","options_ru":["8","9","10","12"],"solution_ru":"Дочь — x лет, мать — x+28 лет. Через 4 года: x+28+4=3(x+4) → x+32=3x+12 → 20=2x → x=10."},
{"id":"15-8","q":"120 kg aralashmada un va guruchning nisbati 3:5. Aralashmada nechta kg guruch bor?","options":["45 kg","60 kg","72 kg","75 kg"],"correct":3,"solution":"Jami ulush: 3+5=8. Guruch: 120:8×5=75 kg.","topic":"m15","q_ru":"В смеси массой 120 кг отношение муки и риса равно 3:5. Сколько килограммов риса в смеси?","options_ru":["45 кг","60 кг","72 кг","75 кг"],"solution_ru":"Всего частей: 3+5=8. Рис: 120:8×5=75 кг."},
{"id":"15-13","q":"Ikki shahar orasidagi masofa 360 km. Ikki avtomobil bir vaqtda bir-biriga qarab yo'lga chiqdi, tezliklari 70 km/soat va 50 km/soat. Necha soatdan keyin uchrashadilar?","options":["2 soat","2,5 soat","3 soat","3,5 soat"],"correct":2,"solution":"Yaqinlashish tezligi: 70+50=120 km/soat. Vaqt = 360:120 = 3 soat.","topic":"m15","q_ru":"Расстояние между двумя городами 360 км. Два автомобиля одновременно выехали навстречу друг другу со скоростями 70 км/ч и 50 км/ч. Через сколько часов они встретятся?","options_ru":["2 часа","2,5 часа","3 часа","3,5 часа"],"solution_ru":"Скорость сближения: 70+50=120 км/ч. Время = 360:120 = 3 часа."},
{"id":"15-12","q":"Bir ishni 3 ishchi 10 kunda bajaradi. Shu ishni 5 ishchi necha kunda bajaradi (ishchilar bir xil unumdorlikda ishlaydi)?","options":["5 kun","6 kun","7 kun","8 kun"],"correct":1,"solution":"Jami ish hajmi: 3×10=30 ishchi-kun. 5 ishchi uchun: 30:5=6 kun.","topic":"m15","q_ru":"Одну работу 3 рабочих выполняют за 10 дней. За сколько дней эту работу выполнят 5 рабочих (при одинаковой производительности)?","options_ru":["5 дней","6 дней","7 дней","8 дней"],"solution_ru":"Общий объём работы: 3×10=30 человеко-дней. Для 5 рабочих: 30:5=6 дней."},
{"id":"15-21","q":"Hovuzni birinchi quvur 6 soatda, ikkinchi quvur 9 soatda to'ldiradi. Ikki quvur birga ochilsa, hovuz necha soatda to'ladi?","options":["3 soat","3,6 soat","4 soat","4,5 soat"],"correct":1,"solution":"1-quvurning bir soatlik ulushi 1/6, 2-quvurniki 1/9. Birgalikda: 1/6+1/9=5/18. Vaqt = 18/5 = 3,6 soat.","topic":"m15","q_ru":"Первая труба заполняет бассейн за 6 часов, вторая — за 9 часов. За сколько часов бассейн заполнится, если открыть обе трубы вместе?","options_ru":["3 часа","3,6 часа","4 часа","4,5 часа"],"solution_ru":"Доля 1-й трубы за час — 1/6, 2-й — 1/9. Вместе: 1/6+1/9=5/18. Время = 18/5 = 3,6 часа."},
{"id":"15-15","q":"Alisherda Botirdan 2 marta ko'p pul bor. Ikkisida jami 90000 so'm bor. Alisherda qancha pul bor?","options":["30000 so'm","45000 so'm","60000 so'm","70000 so'm"],"correct":2,"solution":"Botirda x, Alisherda 2x. x+2x=90000 → 3x=90000 → x=30000. Alisherda 2×30000=60000 so'm.","topic":"m15","q_ru":"У Алишера денег в 2 раза больше, чем у Ботира. Вместе у них 90000 сум. Сколько денег у Алишера?","options_ru":["30000 сум","45000 сум","60000 сум","70000 сум"],"solution_ru":"У Ботира x, у Алишера 2x. x+2x=90000 → 3x=90000 → x=30000. У Алишера 2×30000=60000 сум."},
{"id":"15-14","q":"Ikkita sonning nisbati 4:7, ayirmasi 27. Katta sonni toping.","options":["49","56","63","70"],"correct":2,"solution":"Ayirma 3 ulushga to'g'ri keladi (7−4=3): 1 ulush = 27:3=9. Katta son = 7×9=63.","topic":"m15","q_ru":"Отношение двух чисел равно 4:7, а их разность равна 27. Найдите большее число.","options_ru":["49","56","63","70"],"solution_ru":"Разность соответствует 3 частям (7−4=3): 1 часть = 27:3=9. Большее число = 7×9=63."},
{"id":"15-11","q":"Piyoda 2 km masofani 24 daqiqada bosib o'tadi. Shu tezlik bilan 5 km masofani necha daqiqada bosib o'tadi?","options":["48 daqiqa","54 daqiqa","60 daqiqa","75 daqiqa"],"correct":2,"solution":"1 km uchun 24:2=12 daqiqa kerak. 5 km uchun: 12×5=60 daqiqa.","topic":"m15","q_ru":"Пешеход проходит 2 км за 24 минуты. За сколько минут он пройдёт 5 км с той же скоростью?","options_ru":["48 минут","54 минуты","60 минут","75 минут"],"solution_ru":"На 1 км требуется 24:2=12 минут. На 5 км: 12×5=60 минут."},

{"id":"16-19","q":"Jadvalda 200 nafar o'quvchining maktabga borish usuli berilgan. Piyoda boruvchilar avtobusda boruvchilardan necha foiz punkt ko'p?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 296 196' width='296' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='8' y='8' width='280' height='180' rx='10' fill='#fff' stroke='#cfdbe5' stroke-width='1.5'/><path d='M 8 44 V 18 Q 8 8 18 8 H 278 Q 288 8 288 18 V 44 Z' fill='#0e7cc4'/><text x='83' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Usul</text><text x='223' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>O'quvchilar</text><line x1='9' y1='44' x2='287' y2='44' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='83' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Piyoda</text><text x='223' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>80</text><rect x='9' y='80' width='278' height='36' fill='#f0f6fb'/><line x1='9' y1='80' x2='287' y2='80' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='83' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Avtobus</text><text x='223' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>60</text><line x1='9' y1='116' x2='287' y2='116' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='83' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Velosiped</text><text x='223' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>40</text><rect x='9' y='152' width='278' height='36' fill='#f0f6fb'/><line x1='9' y1='152' x2='287' y2='152' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='83' y='170' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Mashina</text><text x='223' y='170' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>20</text><line x1='158' y1='8' x2='158' y2='188' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/></svg>","options":["5","8","10","15"],"correct":2,"solution":"Piyoda: 80:200×100%=40%. Avtobus: 60:200×100%=30%. Farq: 40%−30%=10 foiz punkt.","topic":"m16","q_ru":"Способ добирания до школы 200 учеников: пешком — 80, на автобусе — 60, на велосипеде — 40, на машине — 20. На сколько процентных пунктов доля идущих пешком больше доли едущих на автобусе?","options_ru":["5","8","10","15"],"solution_ru":"Пешком: 80:200×100%=40%. Автобус: 60:200×100%=30%. Разница: 40%−30%=10 процентных пунктов."},
{"id":"17-11","q":"Ikkita to'g'ri chiziq kesishganda hosil bo'lgan burchaklardan biri 72°. Shu burchakka qo'shni burchakni toping.","options":["18°","72°","98°","108°"],"correct":3,"solution":"Qo'shni burchaklar yig'indisi 180° ga teng: 180°−72°=108°.","topic":"m17","q_ru":"При пересечении двух прямых один из образовавшихся углов равен 72°. Найдите смежный с ним угол.","options_ru":["18°","72°","98°","108°"],"solution_ru":"Сумма смежных углов равна 180°: 180°−72°=108°."},
{"id":"17-16","q":"Uchburchak ichki burchaklari nisbati 2:3:4 ga teng. Eng katta burchakni toping.","options":["60°","70°","80°","90°"],"correct":2,"solution":"Jami ulush: 2+3+4=9. Bir ulush: 180°:9=20°. Eng katta burchak: 4×20°=80°.","topic":"m17","q_ru":"Отношение внутренних углов треугольника равно 2:3:4. Найдите наибольший угол.","options_ru":["60°","70°","80°","90°"],"solution_ru":"Всего частей: 2+3+4=9. Одна часть: 180°:9=20°. Наибольший угол: 4×20°=80°."},
{"id":"17-14","q":"Parallel chiziqlarni kesib o'tuvchi to'g'ri chiziq hosil qilgan bir tomonlama ichki burchaklardan biri 110°. Ikkinchisini toping.","options":["60°","70°","80°","110°"],"correct":1,"solution":"Bir tomonlama ichki burchaklar yig'indisi 180° ga teng: 180°−110°=70°.","topic":"m17","q_ru":"Прямая, пересекающая параллельные прямые, образует односторонние внутренние углы, один из которых равен 110°. Найдите второй угол.","options_ru":["60°","70°","80°","110°"],"solution_ru":"Сумма односторонних внутренних углов равна 180°: 180°−110°=70°."},
{"id":"17-12","q":"Ikkita burchakning yig'indisi 90° ga teng. Birinchi burchak ikkinchisidan 2 marta katta bo'lsa, kichik burchakni toping.","options":["20°","30°","40°","45°"],"correct":1,"solution":"Kichik burchak x, katta burchak 2x. x+2x=90° → 3x=90° → x=30°.","topic":"m17","q_ru":"Сумма двух углов равна 90°. Если первый угол в 2 раза больше второго, найдите меньший угол.","options_ru":["20°","30°","40°","45°"],"solution_ru":"Меньший угол — x, больший — 2x. x+2x=90° → 3x=90° → x=30°."},
{"id":"17-15","q":"Ikki qo'shni burchaklar yig'indisi 180°. Ulardan biri ikkinchisidan 40° katta. Kichik burchakni toping.","options":["60°","65°","70°","75°"],"correct":2,"solution":"Kichik burchak x, katta burchak x+40°. x+(x+40°)=180° → 2x=140° → x=70°.","topic":"m17","q_ru":"Сумма двух смежных углов равна 180°. Один из них больше другого на 40°. Найдите меньший угол.","options_ru":["60°","65°","70°","75°"],"solution_ru":"Меньший угол — x, больший — x+40°. x+(x+40°)=180° → 2x=140° → x=70°."},
{"id":"17-13","q":"A(2; 3) va B(2; 9) nuqtalar orasidagi masofani toping.","options":["4","6","8","12"],"correct":1,"solution":"Nuqtalarning x-koordinatalari teng bo'lgani uchun masofa = |9−3| = 6.","topic":"m17","q_ru":"Найдите расстояние между точками A(2; 3) и B(2; 9).","options_ru":["4","6","8","12"],"solution_ru":"Так как x-координаты точек равны, расстояние = |9−3| = 6."},
{"id":"5-28","q":"Sonlar o'qida M(−5) va N(7) nuqtalari berilgan. MN masofani toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 92' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='12' y1='52' x2='320' y2='52' stroke='#1f3447' stroke-width='2'/><path d='M 322 52 l -9 -5 v 10 z' fill='#1f3447'/><path d='M 10 52 l 9 -5 v 10 z' fill='#1f3447'/><line x1='24' y1='46' x2='24' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='24' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>−6</text><line x1='44.1' y1='46' x2='44.1' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='44.1' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>−5</text><line x1='64.3' y1='46' x2='64.3' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='64.3' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>−4</text><line x1='84.4' y1='46' x2='84.4' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='84.4' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>−3</text><line x1='104.6' y1='46' x2='104.6' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='104.6' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>−2</text><line x1='124.7' y1='46' x2='124.7' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='124.7' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>−1</text><line x1='144.9' y1='46' x2='144.9' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='144.9' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>0</text><line x1='165' y1='46' x2='165' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='165' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>1</text><line x1='185.1' y1='46' x2='185.1' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='185.1' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>2</text><line x1='205.3' y1='46' x2='205.3' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='205.3' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>3</text><line x1='225.4' y1='46' x2='225.4' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='225.4' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>4</text><line x1='245.6' y1='46' x2='245.6' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='245.6' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>5</text><line x1='265.7' y1='46' x2='265.7' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='265.7' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>6</text><line x1='285.9' y1='46' x2='285.9' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='285.9' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>7</text><line x1='306' y1='46' x2='306' y2='58' stroke='#1f3447' stroke-width='1.6' stroke-linecap='round'/><text x='306' y='72' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>8</text><circle cx='44.1' cy='52' r='6' fill='#d65745' stroke='#fff' stroke-width='1.5'/><text x='44.1' y='33' text-anchor='middle' dominant-baseline='central' font-size='14' font-weight='700' fill='#d65745'>M</text><circle cx='285.9' cy='52' r='6' fill='#0e7cc4' stroke='#fff' stroke-width='1.5'/><text x='285.9' y='33' text-anchor='middle' dominant-baseline='central' font-size='14' font-weight='700' fill='#0e7cc4'>N</text></svg>","options":["2","7","12","35"],"correct":2,"solution":"MN = |7−(−5)| = |12| = 12.","topic":"m5","q_ru":"На числовой прямой даны точки M(−5) и N(7). Найдите расстояние MN.","options_ru":["2","7","12","35"],"solution_ru":"MN = |7−(−5)| = |12| = 12."},
{"id":"17-32","q":"Uchburchakning ikki ichki burchagi 50° va 65°. Uchinchi burchakka qo'shni tashqi burchakni toping.","options":["65°","105°","115°","125°"],"correct":2,"solution":"Uchinchi ichki burchak: 180°−50°−65°=65°. Unga qo'shni tashqi burchak: 180°−65°=115° (tashqi burchak teoremasi bo'yicha 50°+65°=115° ham bo'ladi).","topic":"m17","q_ru":"Два внутренних угла треугольника равны 50° и 65°. Найдите внешний угол, смежный с третьим углом.","options_ru":["65°","105°","115°","125°"],"solution_ru":"Третий внутренний угол: 180°−50°−65°=65°. Смежный с ним внешний угол: 180°−65°=115° (по теореме о внешнем угле также 50°+65°=115°)."},
{"id":"17-8","q":"40° li burchak bissektrisa yordamida ikkiga bo'lindi. Hosil bo'lgan har bir burchakni toping.","options":["10°","15°","20°","25°"],"correct":2,"solution":"Bissektrisa burchakni teng ikkiga bo'ladi: 40°:2=20°.","topic":"m17","q_ru":"Угол величиной 40° разделён биссектрисой на две части. Найдите каждый из получившихся углов.","options_ru":["10°","15°","20°","25°"],"solution_ru":"Биссектриса делит угол на два равных угла: 40°:2=20°."},
{"id":"17-20","q":"Soat 3:00 da soat minut va soat ko'rsatkichlari orasidagi burchakni toping.","options":["60°","75°","90°","120°"],"correct":2,"solution":"Soat 3:00 da minut ko'rsatkichi 12 ga, soat ko'rsatkichi 3 ga to'g'ri keladi. Ular orasidagi burchak 90°.","topic":"m17","q_ru":"Найдите угол между минутной и часовой стрелками часов в 3:00.","options_ru":["60°","75°","90°","120°"],"solution_ru":"В 3:00 минутная стрелка указывает на 12, часовая — на 3. Угол между ними равен 90°."},
{"id":"18-8","q":"6 nafar o'quvchidan birinchi, ikkinchi va uchinchi o'rinlarni necha xil usulda taqsimlash mumkin?","options":["60","90","120","216"],"correct":2,"solution":"O'rinlashtirish: 6×5×4=120.","topic":"m18","q_ru":"Сколькими способами можно распределить первое, второе и третье места среди 6 учеников?","options_ru":["60","90","120","216"],"solution_ru":"Размещения: 6×5×4=120."},
{"id":"18-23","q":"10 nafar o'quvchidan 3 nafarini sayohatga tanlash necha xil usulda mumkin (tartib muhim emas)?","options":["30","60","120","720"],"correct":2,"solution":"Kombinatsiya: C(10,3) = (10×9×8):(1×2×3) = 720:6 = 120.","topic":"m18","q_ru":"Сколькими способами можно выбрать 3 учеников из 10 для поездки (порядок не важен)?","options_ru":["30","60","120","720"],"solution_ru":"Сочетания: C(10,3) = (10×9×8):(1×2×3) = 720:6 = 120."},
{"id":"18-10","q":"Restoranda 4 xil taom va 3 xil ichimlik bor. Bittadan taom va ichimlik tanlansa, nechta xil tanlov hosil bo'ladi?","options":["7","12","16","24"],"correct":1,"solution":"Ko'paytirish qoidasi: 4×3=12.","topic":"m18","q_ru":"В ресторане 4 вида блюд и 3 вида напитков. Сколько различных вариантов выбора получится, если выбрать одно блюдо и один напиток?","options_ru":["7","12","16","24"],"solution_ru":"Правило умножения: 4×3=12."},
{"id":"18-3","q":"5! (5 faktorial) ifodaning qiymatini toping.","options":["20","60","120","720"],"correct":2,"solution":"5! = 5×4×3×2×1 = 120.","topic":"m18","q_ru":"Найдите значение выражения 5! (5 факториал).","options_ru":["20","60","120","720"],"solution_ru":"5! = 5×4×3×2×1 = 120."},
{"id":"18-24","q":"0 dan 9 gacha raqamlardan foydalanib, raqamlar takrorlanishi mumkin bo'lgan holda 3 xonali parol tuzilsa, nechta xil parol hosil bo'ladi?","options":["100","720","900","1000"],"correct":3,"solution":"Har bir xona uchun 10 xil tanlov mavjud: 10×10×10=1000.","topic":"m18","q_ru":"Используя цифры от 0 до 9, сколько различных 3-значных паролей можно составить, если цифры могут повторяться?","options_ru":["100","720","900","1000"],"solution_ru":"Для каждого разряда есть 10 вариантов: 10×10×10=1000."},
{"id":"18-17","q":"8 nafar do'stdan 2 tasini sovg'a olib kelishga tanlash necha xil usulda mumkin?","options":["16","28","56","64"],"correct":1,"solution":"Kombinatsiya: C(8,2) = (8×7):(1×2) = 56:2 = 28.","topic":"m18","q_ru":"Сколькими способами можно выбрать 2 друзей из 8, чтобы они принесли подарок?","options_ru":["16","28","56","64"],"solution_ru":"Сочетания: C(8,2) = (8×7):(1×2) = 56:2 = 28."},
{"id":"18-26","q":"\"OLIM\" so'zidagi 4 ta harfni qayta tartiblab, nechta xil 4 harfli ketma-ketlik hosil qilish mumkin (harflar takrorlanmaydi)?","options":["4","12","16","24"],"correct":3,"solution":"4 ta turli harfning o'rin almashtirishlari soni: 4! = 24.","topic":"m18","q_ru":"Сколько различных последовательностей из 4 букв можно составить, переставляя 4 буквы слова «ОЛИМ» (буквы не повторяются)?","options_ru":["4","12","16","24"],"solution_ru":"Число перестановок 4 различных букв: 4! = 24."},
{"id":"18-18","q":"Mehmondorchilikda 7 kishi bor. Har bir kishi boshqa har bir kishi bilan bir marta qo'l qisishsa, jami nechta qo'l qisish bo'ladi?","options":["14","21","42","49"],"correct":1,"solution":"Kombinatsiya: C(7,2) = (7×6):(1×2) = 42:2 = 21.","topic":"m18","q_ru":"На встрече присутствуют 7 человек. Если каждый человек пожимает руку каждому другому ровно один раз, сколько всего будет рукопожатий?","options_ru":["14","21","42","49"],"solution_ru":"Сочетания: C(7,2) = (7×6):(1×2) = 42:2 = 21."},

{"id":"1-54","q":"Hisoblang: 1 − 2 + 3 − 4 + 5 − 6 + ... + 99 − 100","options":["−50","50","−100","0"],"correct":0,"solution":"Sonlarni juftlab guruhlaymiz: (1−2)+(3−4)+...+(99−100).\nHar bir juftlik = −1.\nJuftliklar soni = 100:2 = 50.\nYig'indi = 50·(−1) = −50.","topic":"m1","q_ru":"Вычислите: 1 − 2 + 3 − 4 + 5 − 6 + ... + 99 − 100","options_ru":["−50","50","−100","0"],"solution_ru":"Сгруппируем числа парами: (1−2)+(3−4)+...+(99−100).\nКаждая пара = −1.\nКоличество пар = 100:2 = 50.\nСумма = 50·(−1) = −50."},

{"id":"1-50","q":"11, 21, 23, 27, 29, 33, 37, 41 sonlaridan nechtasi tub son?","options":["5","4","6","3"],"correct":0,"solution":"Har bir sonni tekshiramiz:\n11 — tub, 21=3·7 — emas, 23 — tub, 27=3³ — emas, 29 — tub, 33=3·11 — emas, 37 — tub, 41 — tub.\nTub sonlar: 11,23,29,37,41 — jami 5 ta.","topic":"m1","q_ru":"Сколько из чисел 11, 21, 23, 27, 29, 33, 37, 41 являются простыми?","options_ru":["5","4","6","3"],"solution_ru":"Проверим каждое число:\n11 — простое, 21=3·7 — нет, 23 — простое, 27=3³ — нет, 29 — простое, 33=3·11 — нет, 37 — простое, 41 — простое.\nПростые числа: 11,23,29,37,41 — всего 5."},
{"id":"1-26","q":"1-mulohaza: '12 soni 3 ga bo'linadi'. 2-mulohaza: '15 soni juft son'. Mulohazalar haqida to'g'ri xulosani toping.","options":["1 — rost, 2 — yolg'on","1 — yolg'on, 2 — rost","Ikkalasi ham rost","Ikkalasi ham yolg'on"],"correct":0,"solution":"1: 12 : 3 = 4, demak 1-mulohaza rost.\n2: 15 — toq son, demak 2-mulohaza yolg'on.","topic":"m1","q_ru":"Утверждение 1: «12 делится на 3». Утверждение 2: «15 — чётное число». Выберите верный вывод.","options_ru":["1 — истинно, 2 — ложно","1 — ложно, 2 — истинно","Оба истинны","Оба ложны"],"solution_ru":"1: 12 : 3 = 4, значит утверждение 1 истинно.\n2: 15 — нечётное, значит утверждение 2 ложно."},
{"id":"1-53","q":"Yig'indisi 60 ga teng bo'lgan 5 ta ketma-ket juft sonning eng kichigini toping.","options":["8","6","10","12"],"correct":0,"solution":"5 ta ketma-ket juft son: x, x+2, x+4, x+6, x+8.\nYig'indi = 5x+20 = 60 → 5x=40 → x=8.\nEng kichigi = 8.\nTekshirish: 8+10+12+14+16=60 ✓","topic":"m1","q_ru":"Найдите наименьшее из 5 последовательных чётных чисел, сумма которых равна 60.","options_ru":["8","6","10","12"],"solution_ru":"5 последовательных чётных чисел: x, x+2, x+4, x+6, x+8.\nСумма = 5x+20 = 60 → 5x=40 → x=8.\nНаименьшее = 8.\nПроверка: 8+10+12+14+16=60 ✓"},

{"id":"1-38","q":"1-mulohaza: '36 sonining barcha natural bo'luvchilari yig'indisi 91 ga teng'. 2-mulohaza: '17 soni juft son'. To'g'ri xulosani toping.","options":["1 — rost, 2 — yolg'on","1 — yolg'on, 2 — rost","Ikkalasi ham rost","Ikkalasi ham yolg'on"],"correct":0,"solution":"36 ning bo'luvchilari: 1, 2, 3, 4, 6, 9, 12, 18, 36. Yig'indisi 91 — 1-mulohaza rost.\n17 — toq son, 2-mulohaza yolg'on.","topic":"m1","q_ru":"Утверждение 1: «Сумма всех натуральных делителей числа 36 равна 91». Утверждение 2: «17 — чётное число». Выберите верный вывод.","options_ru":["1 — истинно, 2 — ложно","1 — ложно, 2 — истинно","Оба истинны","Оба ложны"],"solution_ru":"Делители 36: 1, 2, 3, 4, 6, 9, 12, 18, 36. Их сумма 91 — утверждение 1 истинно.\n17 — нечётное, утверждение 2 ложно."},
{"id":"2-55","q":"213, 514, 6213, 729, 1001 sonlaridan nechtasi 3 ga bo'linadi?","options":["3","2","4","5"],"correct":0,"solution":"Raqamlar yig'indisi 3 ga bo'linsa, son ham 3 ga bo'linadi:\n213→2+1+3=6 ✓\n514→5+1+4=10 ✗\n6213→6+2+1+3=12 ✓\n729→7+2+9=18 ✓\n1001→1+0+0+1=2 ✗\nJami: 3 ta.","topic":"m2","q_ru":"Сколько из чисел 213, 514, 6213, 729, 1001 делятся на 3?","options_ru":["3","2","4","5"],"solution_ru":"Если сумма цифр числа делится на 3, то и само число делится на 3:\n213→2+1+3=6 ✓\n514→5+1+4=10 ✗\n6213→6+2+1+3=12 ✓\n729→7+2+9=18 ✓\n1001→1+0+0+1=2 ✗\nВсего: 3."},
{"id":"2-40","q":"84 sonini tub ko'paytuvchilarga ajratib, har xil tub ko'paytuvchilar yig'indisini toping.","options":["12","14","9","19"],"correct":0,"solution":"84 = 2²·3·7.\nHar xil tub ko'paytuvchilar: 2, 3, 7.\nYig'indi = 2+3+7 = 12.","topic":"m2","q_ru":"Разложите число 84 на простые множители и найдите сумму различных простых множителей.","options_ru":["12","14","9","19"],"solution_ru":"84 = 2²·3·7.\nРазличные простые множители: 2, 3, 7.\nСумма = 2+3+7 = 12."},
{"id":"2-48","q":"EKUK(36,60) va EKUB(36,60) ayirmasini toping.","options":["168","172","160","180"],"correct":0,"solution":"36=2²·3², 60=2²·3·5.\nEKUB = 2²·3 = 12.\nEKUK = 2²·3²·5 = 180.\nAyirma = 180−12 = 168.","topic":"m2","q_ru":"Найдите разность НОК(36,60) и НОД(36,60).","options_ru":["168","172","160","180"],"solution_ru":"36=2²·3², 60=2²·3·5.\nНОД = 2²·3 = 12.\nНОК = 2²·3²·5 = 180.\nРазность = 180−12 = 168."},
{"id":"2-46","q":"Ikki sonning nisbati 2:3, EKUKi 60 ga teng. Kichik sonni toping.","options":["20","24","12","30"],"correct":0,"solution":"Sonlarni 2k va 3k deb olamiz, EKUB(2,3)=1 bo'lgani uchun EKUK(2k,3k)=6k.\n6k=60 → k=10.\nKichik son = 2k = 20.","topic":"m2","q_ru":"Отношение двух чисел равно 2:3, их НОК равен 60. Найдите меньшее число.","options_ru":["20","24","12","30"],"solution_ru":"Обозначим числа как 2k и 3k, так как НОД(2,3)=1, то НОК(2k,3k)=6k.\n6k=60 → k=10.\nМеньшее число = 2k = 20."},

{"id":"2-39","q":"1-mulohaza: 'Har qanday juft sonning kvadrati 4 ga bo'linadi'. 2-mulohaza: '15 soni tub son'. To'g'ri xulosani toping.","options":["1 — rost, 2 — yolg'on","1 — yolg'on, 2 — rost","Ikkalasi ham rost","Ikkalasi ham yolg'on"],"correct":0,"solution":"Juft son 2n ko'rinishida: (2n)² = 4n² — 4 ga bo'linadi. 1-mulohaza rost.\n15 = 3 · 5 — tub emas. 2-mulohaza yolg'on.","topic":"m2","q_ru":"Утверждение 1: «Квадрат любого чётного числа делится на 4». Утверждение 2: «15 — простое число». Выберите верный вывод.","options_ru":["1 — истинно, 2 — ложно","1 — ложно, 2 — истинно","Оба истинны","Оба ложны"],"solution_ru":"Чётное число имеет вид 2n: (2n)² = 4n² — делится на 4. Утверждение 1 истинно.\n15 = 3 · 5 — не простое. Утверждение 2 ложно."},
{"id":"2-42","q":"1 dan 50 gacha nechta son ham 4 ga, ham 6 ga bo'linadi?","options":["4","3","5","6"],"correct":0,"solution":"Ham 4 ga, ham 6 ga bo'linadigan sonlar EKUK(4,6)=12 ga bo'linadi.\n12 ga bo'linadigan sonlar 1-50 orasida: 12,24,36,48 — jami 4 ta.","topic":"m2","q_ru":"Сколько чисел от 1 до 50 делятся и на 4, и на 6?","options_ru":["4","3","5","6"],"solution_ru":"Числа, делящиеся и на 4, и на 6, делятся на НОК(4,6)=12.\nЧисла, делящиеся на 12, от 1 до 50: 12,24,36,48 — всего 4."},

{"id":"3-49","q":"2/5 va 5/8 kasrlaridan qaysi biri katta va ayirmasi nechaga teng?","options":["5/8 katta, ayirma 9/40","2/5 katta, ayirma 9/40","5/8 katta, ayirma 1/3","2/5 katta, ayirma 1/3"],"correct":0,"solution":"Umumiy maxraj 40: 2/5=16/40, 5/8=25/40.\n25/40 > 16/40, demak 5/8 katta.\nAyirma = 25/40 − 16/40 = 9/40.","topic":"m3","q_ru":"Какая из дробей 2/5 и 5/8 больше и чему равна их разность?","options_ru":["5/8 больше, разность 9/40","2/5 больше, разность 9/40","5/8 больше, разность 1/3","2/5 больше, разность 1/3"],"solution_ru":"Общий знаменатель 40: 2/5=16/40, 5/8=25/40.\n25/40 > 16/40, значит 5/8 больше.\nРазность = 25/40 − 16/40 = 9/40."},

{"id":"7-57","q":"640 nafar o'quvchidan 30% i sport to'garagiga, qolganlarining yarmi rasm to'garagiga qatnaydi. Rasm to'garagiga nechta o'quvchi qatnaydi?","options":["224","192","256","320"],"correct":0,"solution":"Sport to'garagi: 640·0,3 = 192.\nQolgan: 640−192 = 448.\nRasm to'garagi: 448:2 = 224.","topic":"m7","q_ru":"Из 640 учеников 30% посещают спортивный кружок, а половина оставшихся — кружок рисования. Сколько учеников посещают кружок рисования?","options_ru":["224","192","256","320"],"solution_ru":"Спортивный кружок: 640·0,3 = 192.\nОсталось: 640−192 = 448.\nКружок рисования: 448:2 = 224."},

{"id":"7-32","q":"2 sonidan necha foiz katta bo'lgan son 2,5 ga teng?","options":["25%","20%","50%","12,5%"],"correct":0,"solution":"Farq = 2,5−2 = 0,5.\n0,5:2 · 100% = 25%.","topic":"m7","q_ru":"На сколько процентов число 2,5 больше числа 2?","options_ru":["25%","20%","50%","12,5%"],"solution_ru":"Разность = 2,5−2 = 0,5.\n0,5:2 · 100% = 25%."},
{"id":"7-60","q":"Bankka 500000 so'm qo'yilgan. Har yili oddiy foiz hisobida 6% qo'shib boriladi. 2 yildan keyin hisobdagi summani toping.","options":["560000","530000","561800","580000"],"correct":0,"solution":"Oddiy foiz: yillik foiz = 500000·0,06 = 30000.\n2 yil uchun: 30000·2 = 60000.\nUmumiy summa = 500000+60000 = 560000.","topic":"m7","q_ru":"В банк положили 500000 сум. Каждый год начисляется 6% по простой процентной ставке. Найдите сумму на счёте через 2 года.","options_ru":["560000","530000","561800","580000"],"solution_ru":"Простой процент: годовой процент = 500000·0,06 = 30000.\nЗа 2 года: 30000·2 = 60000.\nОбщая сумма = 500000+60000 = 560000."},
{"id":"7-54","q":"Bir sonning 3/4 qismi uning 60% idan 18 ga ortiq. Shu sonni toping.","options":["120","100","150","90"],"correct":0,"solution":"3/4 x − 0,6x = 18.\n0,75x − 0,6x = 0,15x = 18.\nx = 18:0,15 = 120.","topic":"m7","q_ru":"3/4 некоторого числа на 18 больше, чем 60% этого числа. Найдите это число.","options_ru":["120","100","150","90"],"solution_ru":"3/4 x − 0,6x = 18.\n0,75x − 0,6x = 0,15x = 18.\nx = 18:0,15 = 120."},
{"id":"7-1","q":"45 ta yong'oqning 9 tasi chirigan ekan. Chirigan yong'oqlar nechi foizni tashkil etadi?","options":["20%","18%","25%","15%"],"correct":0,"solution":"9:45 · 100% = 20%.","topic":"m7","q_ru":"Из 45 орехов 9 оказались гнилыми. Сколько процентов составляют гнилые орехи?","options_ru":["20%","18%","25%","15%"],"solution_ru":"9:45 · 100% = 20%."},
{"id":"8-27","q":"Kvadratning tomoni 2 marta oshirilsa, uning yuzasi necha marta ortadi?","options":["4 marta","2 marta","8 marta","16 marta"],"correct":0,"solution":"Yuza = tomon².\nTomon 2 marta oshsa, yuza 2² = 4 marta ortadi.","topic":"m8","q_ru":"Если сторону квадрата увеличить в 2 раза, во сколько раз увеличится его площадь?","options_ru":["в 4 раза","в 2 раза","в 8 раз","в 16 раз"],"solution_ru":"Площадь = сторона².\nЕсли сторона увеличится в 2 раза, площадь увеличится в 2² = 4 раза."},
{"id":"8-44","q":"To'g'ri to'rtburchakning bir tomoni 3 marta, ikkinchi tomoni 2 marta kamaytirilsa, yuzasi necha marta kamayadi?","options":["6 marta","5 marta","8 marta","3 marta"],"correct":0,"solution":"Yuza = uzunlik · kenglik.\nYangi yuza = (uzunlik:3)·(kenglik:2) = eski yuza : 6.\nDemak 6 marta kamayadi.","topic":"m8","q_ru":"Если одну сторону прямоугольника уменьшить в 3 раза, а другую — в 2 раза, во сколько раз уменьшится его площадь?","options_ru":["в 6 раз","в 5 раз","в 8 раз","в 3 раза"],"solution_ru":"Площадь = длина · ширина.\nНовая площадь = (длина:3)·(ширина:2) = старая площадь : 6.\nЗначит уменьшится в 6 раз."},
{"id":"8-39","q":"To'g'ri to'rtburchakning perimetri 24 sm, tomonlari nisbati 1:2. Yuzasini toping.","options":["32 sm²","24 sm²","48 sm²","16 sm²"],"correct":0,"solution":"Tomonlar a va 2a. Perimetr = 2(a+2a)=6a=24 → a=4.\nTomonlar: 4 sm va 8 sm.\nYuza = 4·8 = 32 sm².","topic":"m8","q_ru":"Периметр прямоугольника равен 24 см, отношение сторон 1:2. Найдите его площадь.","options_ru":["32 см²","24 см²","48 см²","16 см²"],"solution_ru":"Стороны a и 2a. Периметр = 2(a+2a)=6a=24 → a=4.\nСтороны: 4 см и 8 см.\nПлощадь = 4·8 = 32 см²."},
{"id":"8-21","q":"Ikki kvadratning tomonlari nisbati 3:4. Ularning yuzalari nisbatini toping.","options":["9:16","3:4","6:8","9:12"],"correct":0,"solution":"Yuzalar nisbati = tomonlar nisbatining kvadrati = 3²:4² = 9:16.","topic":"m8","q_ru":"Отношение сторон двух квадратов равно 3:4. Найдите отношение их площадей.","options_ru":["9:16","3:4","6:8","9:12"],"solution_ru":"Отношение площадей = квадрат отношения сторон = 3²:4² = 9:16."},
{"id":"8-46","q":"Tomoni 10 sm bo'lgan kvadratdan radiusi 3 sm bo'lgan doira kesib olindi (π≈3,14). Qolgan yuzani taqribiy toping.","options":["71,74 sm²","78,5 sm²","65 sm²","90 sm²"],"correct":0,"solution":"Kvadrat yuzasi = 10² = 100 sm².\nDoira yuzasi = π·r² = 3,14·9 = 28,26 sm².\nQolgan yuza = 100−28,26 = 71,74 sm².","topic":"m8","q_ru":"Из квадрата со стороной 10 см вырезан круг радиусом 3 см (π≈3,14). Найдите приближённо оставшуюся площадь.","options_ru":["71,74 см²","78,5 см²","65 см²","90 см²"],"solution_ru":"Площадь квадрата = 10² = 100 см².\nПлощадь круга = π·r² = 3,14·9 = 28,26 см².\nОставшаяся площадь = 100−28,26 = 71,74 см²."},
{"id":"8-32","q":"To'g'ri burchakli uchburchakning gipotenuzasi 13 sm, bir kateti 5 sm. Yuzasini toping.","options":["30 sm²","60 sm²","32,5 sm²","65 sm²"],"correct":0,"solution":"Ikkinchi katet = √(13²−5²) = √(169−25) = √144 = 12 sm.\nYuza = (5·12):2 = 30 sm².","topic":"m8","q_ru":"Гипотенуза прямоугольного треугольника равна 13 см, один катет — 5 см. Найдите его площадь.","options_ru":["30 см²","60 см²","32,5 см²","65 см²"],"solution_ru":"Второй катет = √(13²−5²) = √(169−25) = √144 = 12 см.\nПлощадь = (5·12):2 = 30 см²."},
{"id":"8-31","q":"Aylananing uzunligi 31,4 sm (π≈3,14). Radiusini toping.","options":["5 sm","10 sm","6,28 sm","3,14 sm"],"correct":0,"solution":"Aylana uzunligi C=2πr.\nr = C:(2π) = 31,4:(2·3,14) = 31,4:6,28 = 5 sm.","topic":"m8","q_ru":"Длина окружности равна 31,4 см (π≈3,14). Найдите её радиус.","options_ru":["5 см","10 см","6,28 см","3,14 см"],"solution_ru":"Длина окружности C=2πr.\nr = C:(2π) = 31,4:(2·3,14) = 31,4:6,28 = 5 см."},
{"id":"8-14","q":"Tomonlari 6 sm va 8 sm bo'lgan to'g'ri to'rtburchakning diagonalini toping.","options":["10 sm","14 sm","12 sm","9 sm"],"correct":0,"solution":"Diagonal = √(6²+8²) = √(36+64) = √100 = 10 sm.","topic":"m8","q_ru":"Найдите диагональ прямоугольника со сторонами 6 см и 8 см.","options_ru":["10 см","14 см","12 см","9 см"],"solution_ru":"Диагональ = √(6²+8²) = √(36+64) = √100 = 10 см."},
{"id":"8-30","q":"Yuzasi 60 sm² va balandligi 12 sm bo'lgan uchburchakning asosini toping.","options":["10 sm","5 sm","12 sm","6 sm"],"correct":0,"solution":"Yuza = (asos·balandlik):2.\n60 = (a·12):2 → a = (60·2):12 = 10 sm.","topic":"m8","q_ru":"Найдите основание треугольника, площадь которого равна 60 см², а высота — 12 см.","options_ru":["10 см","5 см","12 см","6 см"],"solution_ru":"Площадь = (основание·высота):2.\n60 = (a·12):2 → a = (60·2):12 = 10 см."},
{"id":"8-35","q":"Tomoni 5 sm bo'lgan kvadratning perimetri va yuzasi (sonli jihatdan) bir-biridan farqini toping.","options":["5","10","15","0"],"correct":0,"solution":"Perimetr = 4·5=20.\nYuza = 5²=25.\nFarq = 25−20 = 5.","topic":"m8","q_ru":"Найдите разницу между периметром и площадью (численно) квадрата со стороной 5 см.","options_ru":["5","10","15","0"],"solution_ru":"Периметр = 4·5=20.\nПлощадь = 5²=25.\nРазница = 25−20 = 5."},
{"id":"9-36","q":"Kubning qirrasi 3 marta oshirilsa, uning hajmi necha marta ortadi?","options":["27 marta","3 marta","9 marta","6 marta"],"correct":0,"solution":"Hajm = qirra³.\nQirra 3 marta oshsa, hajm 3³=27 marta ortadi.","topic":"m9","q_ru":"Если ребро куба увеличить в 3 раза, во сколько раз увеличится его объём?","options_ru":["в 27 раз","в 3 раза","в 9 раз","в 6 раз"],"solution_ru":"Объём = ребро³.\nЕсли ребро увеличится в 3 раза, объём увеличится в 3³=27 раз."},
{"id":"9-43","q":"Kubning qirrasi 2 marta oshirilsa, uning sirt yuzasi necha marta ortadi?","options":["4 marta","2 marta","8 marta","6 marta"],"correct":0,"solution":"Sirt yuzasi = 6·qirra².\nQirra 2 marta oshsa, sirt yuzasi 2²=4 marta ortadi.","topic":"m9","q_ru":"Если ребро куба увеличить в 2 раза, во сколько раз увеличится его площадь поверхности?","options_ru":["в 4 раза","в 2 раза","в 8 раз","в 6 раз"],"solution_ru":"Площадь поверхности = 6·ребро².\nЕсли ребро увеличится в 2 раза, площадь поверхности увеличится в 2²=4 раза."},
{"id":"9-40","q":"To'g'ri burchakli parallelepipedning barcha o'lchamlari 2 marta kattalashtirilsa, hajmi necha marta ortadi?","options":["8 marta","2 marta","4 marta","6 marta"],"correct":0,"solution":"Hajm = a·b·c.\nHar bir o'lcham 2 marta oshsa, hajm 2³=8 marta ortadi.","topic":"m9","q_ru":"Если все размеры прямоугольного параллелепипеда увеличить в 2 раза, во сколько раз увеличится его объём?","options_ru":["в 8 раз","в 2 раза","в 4 раза","в 6 раз"],"solution_ru":"Объём = a·b·c.\nЕсли каждый размер увеличится в 2 раза, объём увеличится в 2³=8 раз."},
{"id":"9-35","q":"Hajmi 64 sm³ bo'lgan kubning sirt yuzasini toping.","options":["96 sm²","64 sm²","48 sm²","144 sm²"],"correct":0,"solution":"Qirra³=64 → qirra=4 sm.\nSirt yuzasi = 6·4² = 6·16 = 96 sm².","topic":"m9","q_ru":"Найдите площадь поверхности куба, объём которого равен 64 см³.","options_ru":["96 см²","64 см²","48 см²","144 см²"],"solution_ru":"Ребро³=64 → ребро=4 см.\nПлощадь поверхности = 6·4² = 6·16 = 96 см²."},
{"id":"9-38","q":"Sharning radiusi 2 marta kichraytirilsa, uning hajmi necha marta kamayadi?","options":["8 marta","2 marta","4 marta","6 marta"],"correct":0,"solution":"Hajm = (4/3)πr³.\nRadius 2 marta kamaysa, hajm 2³=8 marta kamayadi.","topic":"m9","q_ru":"Если радиус шара уменьшить в 2 раза, во сколько раз уменьшится его объём?","options_ru":["в 8 раз","в 2 раза","в 4 раза","в 6 раз"],"solution_ru":"Объём = (4/3)πr³.\nЕсли радиус уменьшится в 2 раза, объём уменьшится в 2³=8 раз."},
{"id":"9-22","q":"Asos radiusi 5 sm, balandligi 12 sm bo'lgan konusning hajmini toping (V=(1/3)πr²h).","options":["100π sm³","60π sm³","300π sm³","20π sm³"],"correct":0,"solution":"V = (1/3)·π·5²·12 = (1/3)·π·25·12 = (1/3)·300π = 100π sm³.","topic":"m9","q_ru":"Найдите объём конуса с радиусом основания 5 см и высотой 12 см (V=(1/3)πr²h).","options_ru":["100π см³","60π см³","300π см³","20π см³"],"solution_ru":"V = (1/3)·π·5²·12 = (1/3)·π·25·12 = (1/3)·300π = 100π см³."},
{"id":"9-32","q":"Qirrasi 6 sm bo'lgan kub shaklidagi idishga to'la suv quyildi. Idishdagi suv necha litr (1 litr=1000 sm³)?","options":["0,216 l","2,16 l","21,6 l","0,36 l"],"correct":0,"solution":"Kub hajmi = 6³ = 216 sm³.\n216 sm³ = 216:1000 = 0,216 litr.","topic":"m9","q_ru":"В сосуд кубической формы с ребром 6 см налили воду до краёв. Сколько литров воды в сосуде (1 литр=1000 см³)?","options_ru":["0,216 л","2,16 л","21,6 л","0,36 л"],"solution_ru":"Объём куба = 6³ = 216 см³.\n216 см³ = 216:1000 = 0,216 литра."},
{"id":"9-26","q":"Asosi tomoni 4 sm bo'lgan kvadrat, balandligi 9 sm bo'lgan to'g'ri burchakli parallelepipedning hajmini toping.","options":["144 sm³","36 sm³","52 sm³","128 sm³"],"correct":0,"solution":"Asos yuzasi = 4²=16 sm².\nHajm = 16·9 = 144 sm³.","topic":"m9","q_ru":"Найдите объём прямоугольного параллелепипеда, основание которого — квадрат со стороной 4 см, а высота 9 см.","options_ru":["144 см³","36 см³","52 см³","128 см³"],"solution_ru":"Площадь основания = 4²=16 см².\nОбъём = 16·9 = 144 см³."},
{"id":"9-9","q":"Radiusi 4 sm bo'lgan sharning sirt yuzasini toping (S=4πr²).","options":["64π sm²","16π sm²","32π sm²","8π sm²"],"correct":0,"solution":"S = 4·π·4² = 4·π·16 = 64π sm².","topic":"m9","q_ru":"Найдите площадь поверхности шара радиусом 4 см (S=4πr²).","options_ru":["64π см²","16π см²","32π см²","8π см²"],"solution_ru":"S = 4·π·4² = 4·π·16 = 64π см²."},
{"id":"9-46","q":"Asosi sakkizburchak bo'lgan to'g'ri prizmaning uchlari sonini toping.","options":["16","8","24","10"],"correct":0,"solution":"To'g'ri prizmada uchlar soni = 2·asos tomonlari soni.\nAsos 8 burchakli, uchlar = 2·8 = 16.","topic":"m9","q_ru":"Найдите число вершин правильной призмы, основание которой — восьмиугольник.","options_ru":["16","8","24","10"],"solution_ru":"В правильной призме число вершин = 2·число сторон основания.\nОснование 8-угольное, вершины = 2·8 = 16."},
{"id":"10-24","q":"54 m 89 mm ni millimetrlarda ifodalang.","options":["54089 mm","5489 mm","540089 mm","54890 mm"],"correct":0,"solution":"54 m = 54000 mm.\n54000 + 89 = 54089 mm.","topic":"m10","q_ru":"Выразите 54 м 89 мм в миллиметрах.","options_ru":["54089 мм","5489 мм","540089 мм","54890 мм"],"solution_ru":"54 м = 54000 мм.\n54000 + 89 = 54089 мм."},
{"id":"10-47","q":"3,2 t va 3200 kg larni taqqoslang.","options":["3,2 t = 3200 kg","3,2 t > 3200 kg","3,2 t < 3200 kg","taqqoslab bo'lmaydi"],"correct":0,"solution":"1 t = 1000 kg.\n3,2 t = 3,2·1000 = 3200 kg.\nDemak 3,2 t = 3200 kg.","topic":"m10","q_ru":"Сравните 3,2 т и 3200 кг.","options_ru":["3,2 т = 3200 кг","3,2 т > 3200 кг","3,2 т < 3200 кг","сравнить невозможно"],"solution_ru":"1 т = 1000 кг.\n3,2 т = 3,2·1000 = 3200 кг.\nЗначит 3,2 т = 3200 кг."},
{"id":"10-34","q":"0,5 soat va 35 daqiqani taqqoslang.","options":["0,5 soat < 35 daqiqa","0,5 soat > 35 daqiqa","0,5 soat = 35 daqiqa","taqqoslab bo'lmaydi"],"correct":0,"solution":"0,5 soat = 30 daqiqa.\n30 < 35, demak 0,5 soat < 35 daqiqa.","topic":"m10","q_ru":"Сравните 0,5 часа и 35 минут.","options_ru":["0,5 часа < 35 минут","0,5 часа > 35 минут","0,5 часа = 35 минут","сравнить невозможно"],"solution_ru":"0,5 часа = 30 минут.\n30 < 35, значит 0,5 часа < 35 минут."},
{"id":"10-20","q":"2,4 l ni millilitrlarda ifodalang.","options":["2400 ml","240 ml","24000 ml","2,4 ml"],"correct":0,"solution":"1 l = 1000 ml.\n2,4 · 1000 = 2400 ml.","topic":"m10","q_ru":"Выразите 2,4 л в миллилитрах.","options_ru":["2400 мл","240 мл","24000 мл","2,4 мл"],"solution_ru":"1 л = 1000 мл.\n2,4 · 1000 = 2400 мл."},
{"id":"10-25","q":"Bir sutkada nechta daqiqa bor?","options":["1440","1000","1200","2400"],"correct":0,"solution":"1 sutka = 24 soat.\n24 · 60 = 1440 daqiqa.","topic":"m10","q_ru":"Сколько минут в одних сутках?","options_ru":["1440","1000","1200","2400"],"solution_ru":"1 сутки = 24 часа.\n24 · 60 = 1440 минут."},
{"id":"10-49","q":"4 km 50 m va 4050 m larni taqqoslang.","options":["4 km 50 m = 4050 m","4 km 50 m > 4050 m","4 km 50 m < 4050 m","taqqoslab bo'lmaydi"],"correct":0,"solution":"4 km = 4000 m.\n4 km 50 m = 4000+50 = 4050 m.\nDemak 4 km 50 m = 4050 m.","topic":"m10","q_ru":"Сравните 4 км 50 м и 4050 м.","options_ru":["4 км 50 м = 4050 м","4 км 50 м > 4050 м","4 км 50 м < 4050 м","сравнить невозможно"],"solution_ru":"4 км = 4000 м.\n4 км 50 м = 4000+50 = 4050 м.\nЗначит 4 км 50 м = 4050 м."},
{"id":"10-33","q":"0,003 t ni grammlarda ifodalang.","options":["3000 g","300 g","30000 g","3 g"],"correct":0,"solution":"0,003 t = 0,003·1000 kg = 3 kg.\n3 kg = 3·1000 = 3000 g.","topic":"m10","q_ru":"Выразите 0,003 т в граммах.","options_ru":["3000 г","300 г","30000 г","3 г"],"solution_ru":"0,003 т = 0,003·1000 кг = 3 кг.\n3 кг = 3·1000 = 3000 г."},
{"id":"10-51","q":"Mashina 1,5 soatda 90 km yursa, 20 daqiqada necha km yo'l bosadi?","options":["20 km","18 km","25 km","30 km"],"correct":0,"solution":"Tezlik = 90:1,5 = 60 km/soat.\n20 daqiqa = 1/3 soat.\nYo'l = 60·(1/3) = 20 km.","topic":"m10","q_ru":"Если автомобиль за 1,5 часа проезжает 90 км, сколько км он проедет за 20 минут?","options_ru":["20 км","18 км","25 км","30 км"],"solution_ru":"Скорость = 90:1,5 = 60 км/ч.\n20 минут = 1/3 часа.\nПуть = 60·(1/3) = 20 км."},
{"id":"10-46","q":"2 m² 35 sm² ni kvadrat santimetrlarda ifodalang.","options":["20035 sm²","2035 sm²","200035 sm²","20350 sm²"],"correct":0,"solution":"1 m² = 10000 sm².\n2 m² = 20000 sm².\n20000 + 35 = 20035 sm².","topic":"m10","q_ru":"Выразите 2 м² 35 см² в квадратных сантиметрах.","options_ru":["20035 см²","2035 см²","200035 см²","20350 см²"],"solution_ru":"1 м² = 10000 см².\n2 м² = 20000 см².\n20000 + 35 = 20035 см²."},
{"id":"10-30","q":"0,75 t va 750 kg larni taqqoslang.","options":["0,75 t = 750 kg","0,75 t > 750 kg","0,75 t < 750 kg","taqqoslab bo'lmaydi"],"correct":0,"solution":"0,75 t = 0,75·1000 = 750 kg.\nDemak 0,75 t = 750 kg.","topic":"m10","q_ru":"Сравните 0,75 т и 750 кг.","options_ru":["0,75 т = 750 кг","0,75 т > 750 кг","0,75 т < 750 кг","сравнить невозможно"],"solution_ru":"0,75 т = 0,75·1000 = 750 кг.\nЗначит 0,75 т = 750 кг."},
{"id":"11-28","q":"(2x³y)² · 3xy ifodani soddalashtiring.","options":["12x⁷y³","6x⁷y³","12x⁶y³","4x⁷y³"],"correct":0,"solution":"(2x³y)² = 4x⁶y².\n4x⁶y² · 3xy = 12x⁷y³.","topic":"m11","q_ru":"Упростите выражение (2x³y)² · 3xy.","options_ru":["12x⁷y³","6x⁷y³","12x⁶y³","4x⁷y³"],"solution_ru":"(2x³y)² = 4x⁶y².\n4x⁶y² · 3xy = 12x⁷y³."},
{"id":"11-44","q":"15a⁵b⁴ : (3a²b) ifodani soddalashtiring.","options":["5a³b³","5a³b⁴","45a³b³","5a⁷b⁵"],"correct":0,"solution":"Koeffitsiyentlar: 15:3=5.\na⁵:a²=a³, b⁴:b=b³.\nNatija: 5a³b³.","topic":"m11","q_ru":"Упростите выражение 15a⁵b⁴ : (3a²b).","options_ru":["5a³b³","5a³b⁴","45a³b³","5a⁷b⁵"],"solution_ru":"Коэффициенты: 15:3=5.\na⁵:a²=a³, b⁴:b=b³.\nРезультат: 5a³b³."},
{"id":"11-29","q":"(−x²y)³ · (−2xy²) ifodani soddalashtiring.","options":["2x⁷y⁵","−2x⁷y⁵","2x⁵y⁵","−2x⁶y⁵"],"correct":0,"solution":"(−x²y)³ = −x⁶y³.\n(−x⁶y³)·(−2xy²) = 2x⁷y⁵.","topic":"m11","q_ru":"Упростите выражение (−x²y)³ · (−2xy²).","options_ru":["2x⁷y⁵","−2x⁷y⁵","2x⁵y⁵","−2x⁶y⁵"],"solution_ru":"(−x²y)³ = −x⁶y³.\n(−x⁶y³)·(−2xy²) = 2x⁷y⁵."},
{"id":"11-10","q":"4m²n³ birhadini kvadratga ko'tarib soddalashtiring.","options":["16m⁴n⁶","16m²n³","8m⁴n⁶","4m⁴n⁶"],"correct":0,"solution":"(4m²n³)² = 4²·(m²)²·(n³)² = 16m⁴n⁶.","topic":"m11","q_ru":"Возведите одночлен 4m²n³ в квадрат и упростите.","options_ru":["16m⁴n⁶","16m²n³","8m⁴n⁶","4m⁴n⁶"],"solution_ru":"(4m²n³)² = 4²·(m²)²·(n³)² = 16m⁴n⁶."},
{"id":"11-30","q":"8x⁶y⁴ : 2x²y² ifodani soddalashtirib, x=1, y=1 dagi qiymatini toping.","options":["4","8","2","16"],"correct":0,"solution":"8x⁶y⁴:2x²y² = 4x⁴y².\nx=1,y=1 da: 4·1·1=4.","topic":"m11","q_ru":"Упростите выражение 8x⁶y⁴ : 2x²y² и найдите его значение при x=1, y=1.","options_ru":["4","8","2","16"],"solution_ru":"8x⁶y⁴:2x²y² = 4x⁴y².\nПри x=1,y=1: 4·1·1=4."},
{"id":"11-48","q":"3a²b · (−4ab³) · (−a) ifodani soddalashtiring.","options":["12a⁴b⁴","−12a⁴b⁴","12a³b⁴","12a⁴b³"],"correct":0,"solution":"Koeffitsiyentlar: 3·(−4)·(−1)=12.\na²·a·a=a⁴, b·b³=b⁴.\nNatija: 12a⁴b⁴.","topic":"m11","q_ru":"Упростите выражение 3a²b · (−4ab³) · (−a).","options_ru":["12a⁴b⁴","−12a⁴b⁴","12a³b⁴","12a⁴b³"],"solution_ru":"Коэффициенты: 3·(−4)·(−1)=12.\na²·a·a=a⁴, b·b³=b⁴.\nРезультат: 12a⁴b⁴."},
{"id":"11-23","q":"(2x²)³ : (4x³) ifodani soddalashtiring.","options":["2x³","4x³","2x⁹","8x³"],"correct":0,"solution":"(2x²)³ = 8x⁶.\n8x⁶ : 4x³ = 2x³.","topic":"m11","q_ru":"Упростите выражение (2x²)³ : (4x³).","options_ru":["2x³","4x³","2x⁹","8x³"],"solution_ru":"(2x²)³ = 8x⁶.\n8x⁶ : 4x³ = 2x³."},
