<title>Majburiy Matematika — Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
:root{--teal1:#22d3ee;--teal2:#06b6d4;--ink:#1b1633;--ink2:#6a6688;--blue:#a855f7;--blue2:#8b3ff0;--green:#10c98a;--green-bg:#e2fbf2;--red:#fb5b78;--red-bg:#ffecf0;--amber:#fbbf24;--ice:#22d3ee;--paper:#fff;--paper2:#f4f2fb;--line:#ece8f7;--ring:rgba(168,85,247,.26);}
body.dark{--ink:#ece9f8;--ink2:#a7a2c8;--green-bg:#0f3b2e;--red-bg:#3d1626;--paper:#241f3a;--paper2:#1c1830;--line:#39314f;--ring:rgba(168,85,247,.4);}
body.dark{background:radial-gradient(720px 520px at 4% -8%,rgba(124,58,237,.38),transparent 60%),radial-gradient(840px 620px at 104% -2%,rgba(6,182,212,.24),transparent 58%),radial-gradient(780px 800px at 92% 114%,rgba(217,70,239,.3),transparent 60%),linear-gradient(150deg,#120d22 0%,#191230 50%,#221537 100%);background-attachment:fixed;}
body.dark .card{border-color:rgba(255,255,255,.08);box-shadow:0 30px 60px -34px rgba(0,0,0,.7),0 4px 14px -8px rgba(0,0,0,.5)}
body.dark .qcard{background:var(--paper);border-color:rgba(255,255,255,.08);box-shadow:0 32px 60px -32px rgba(0,0,0,.7)}
body.dark .hero{background:linear-gradient(150deg,#2c2446 0%,#221b38 100%);border-color:rgba(255,255,255,.08)}
body.dark .input:focus{background:var(--paper2)}
body.dark .input::placeholder{color:#7a7398}
body.dark .tcard{background:linear-gradient(135deg,var(--paper),var(--tcg,var(--paper)))}
body.dark .tcard.on{background:linear-gradient(135deg,var(--paper),var(--tcg))}
body.dark .mistcard{background:linear-gradient(135deg,#322746,var(--paper));border-color:#4a3a2a}
body.dark .banksec-h{background:var(--paper2)}
body.dark .banksec-h:hover{background:#2a2442}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
 background:
  radial-gradient(720px 520px at 4% -8%, rgba(216,180,254,.55), transparent 60%),
  radial-gradient(840px 620px at 104% -2%, rgba(34,211,238,.6), transparent 58%),
  radial-gradient(780px 800px at 92% 114%, rgba(251,113,182,.6), transparent 60%),
  radial-gradient(700px 640px at 8% 120%, rgba(96,165,250,.5), transparent 60%),
  linear-gradient(150deg,#6d28d9 0%,#9333ea 36%,#c026d3 70%,#e0218a 100%);
 background-attachment:fixed;}
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;
 background:radial-gradient(closest-side, rgba(232,200,255,.4), transparent 70%);
 filter:blur(24px);animation:floaty 18s ease-in-out infinite;}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.32;
 background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:26px 26px;}
.disp{font-family:'Montserrat',system-ui,sans-serif;letter-spacing:-.02em;}
.wrap{max-width:680px;margin:0 auto;padding:18px 18px 72px;position:relative;z-index:1;}
.fbg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.fbg span{position:absolute;color:rgba(255,255,255,.06);font-weight:800;font-family:'Montserrat',sans-serif;white-space:nowrap;}
.fade{animation:fade .5s cubic-bezier(.2,.9,.3,1) both;}
@keyframes fade{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--ring)}50%{box-shadow:0 0 0 6px var(--ring)}}
@keyframes dotin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes conf{to{transform:translateY(450px) rotate(720deg);opacity:0}}
@keyframes floaty{0%,100%{transform:translate(-4%,-3%)}50%{transform:translate(5%,5%)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes startglow{0%,100%{box-shadow:0 16px 36px -14px rgba(217,70,239,.85),0 0 0 0 rgba(217,70,239,.0)}50%{box-shadow:0 22px 50px -12px rgba(217,70,239,1),0 0 34px 7px rgba(217,70,239,.6)}}
@keyframes startsheen{0%{left:-60%}60%,100%{left:140%}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.h{color:#fff;font-weight:800;}
.kicker{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);padding:8px 14px;border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px -10px rgba(168,85,247,.6);}
.date{display:inline-flex;align-items:center;gap:8px;color:rgba(255,255,255,.82);font-size:14px;font-weight:500;margin-top:14px;}
.card{background:var(--paper);border:1px solid rgba(255,255,255,.5);border-radius:26px;box-shadow:0 30px 60px -34px rgba(80,20,140,.85),0 4px 14px -8px rgba(40,10,70,.4);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:inherit;font-weight:800;font-size:16px;border:none;cursor:pointer;border-radius:16px;padding:16px 22px;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .2s;}
.btn:active{transform:translateY(1px) scale(.985);}
.btn-primary{background:linear-gradient(120deg,#a78bfa 0%,#8b5cf6 40%,#d946ef 100%);color:#fff;box-shadow:0 18px 40px -12px rgba(217,70,239,.85),inset 0 1px 0 rgba(255,255,255,.4);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 26px 50px -12px rgba(217,70,239,1),inset 0 1px 0 rgba(255,255,255,.4);filter:saturate(1.12) brightness(1.04);}
.btn-primary:disabled{background:#d7d2e8;color:#fff;box-shadow:none;cursor:not-allowed;transform:none;}
.btn-green{background:linear-gradient(120deg,#34e3b0 0%,#10c98a 100%);color:#063b2c;box-shadow:0 18px 36px -14px rgba(16,201,138,.85),inset 0 1px 0 rgba(255,255,255,.45);}
.btn-green:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 24px 46px -14px rgba(16,201,138,.95);}
.btn-green:disabled{background:#d7d2e8;color:#fff;box-shadow:none;cursor:not-allowed;transform:none;}
.btn-ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 8px 18px -12px rgba(40,10,70,.5);}
.btn-ghost:hover{border-color:#dcd5f0;background:var(--paper2);transform:translateY(-1px);}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:17px;padding:15px 16px;font-family:inherit;font-size:16.5px;color:var(--ink);cursor:pointer;transition:transform .14s,border-color .16s,background .16s,box-shadow .2s;}
.opt:hover{border-color:#d6c6f7;background:var(--paper2);transform:translateY(-1px);box-shadow:0 12px 24px -16px rgba(168,85,247,.55);}
.opt:active{transform:translateY(0) scale(.995);}
.opt.sel{border-color:var(--blue);background:rgba(168,85,247,.08);animation:glow 1.7s ease infinite;}
.opt.sel .badge{background:var(--blue);color:#fff;border-color:var(--blue);}
.opt.correct{border-color:var(--green);background:var(--green-bg);}
.opt.correct .badge{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{border-color:var(--red);background:var(--red-bg);}
.opt.wrong .badge{background:var(--red);color:#fff;border-color:var(--red);}
.opt.dis{cursor:default;}.opt.dis:hover{background:var(--paper);transform:none;box-shadow:none;}
.badge{flex:0 0 auto;width:34px;height:34px;border-radius:12px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink2);transition:.16s;}
.seg{display:flex;gap:5px;}
.seg i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.22);transition:.35s;}
.seg i.on{background:linear-gradient(90deg,#a855f7,#22d3ee);box-shadow:0 0 12px rgba(168,85,247,.7);}
.rule{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.rule:last-child{border-bottom:none;}
.ic{flex:0 0 auto;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(168,85,247,.12);color:var(--blue);}
.dot{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);}
.dot.ok{background:var(--green);border-color:var(--green);box-shadow:0 4px 12px -4px rgba(16,201,138,.8);}
.dot.bad{background:var(--red);border-color:var(--red);box-shadow:0 4px 12px -4px rgba(251,91,120,.8);}
.sol{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:12px;display:flex;gap:11px;align-items:flex-start;}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--line);background:#fff;color:#4a4368;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.tchip:hover{border-color:var(--blue);color:var(--blue)}
.tchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 13px;color:var(--ink);box-shadow:0 8px 18px -12px rgba(40,10,70,.5);}

{"id":"18-58","q":"1 dan 30 gacha bo'lgan natural sonlar ketma-ket bitta son sifatida yozildi: 123456...2930. Hosil bo'lgan son necha xonali?","options":["51 xonali","52 xonali","59 xonali","60 xonali"],"correct":0,"solution":"1 dan 9 gacha: 9 ta birxonali son → 9×1 = 9 ta raqam.\n10 dan 30 gacha: 21 ta ikki xonali son → 21×2 = 42 ta raqam.\nJami raqamlar: 9 + 42 = 51 ta.\nDemak hosil bo'lgan son 51 xonali.\nTekshirish: 1,2,...,9 → 9 raqam; 10,11,...,30 → 21 son × 2 = 42 raqam. 9+42=51 ✓","topic":"m18"},
{"id":"2-54","q":"72 va 120 sonlarining EKUB va EKUK lari necha? EKUB · EKUK = ?","options":["8 · 360 = 2880","24 · 360 = 8640","12 · 120 = 1440","6 · 720 = 4320"],"correct":1,"solution":"72 = 2³·3², 120 = 2³·3·5.\nEKUB = 2³·3 = 24.\nEKUK = 2³·3²·5 = 360.\nTekshirish: 24·360 = 8640 = 72·120 ✓\nQoida: EKUB(a,b)·EKUK(a,b) = a·b.","topic":"m2"},
{"id":"3-52","q":"2¾ + 1⅙ − ⅔ ni hisoblang.","options":["3¼","3½","3⅝","2¾"],"correct":0,"solution":"2¾ = 11/4, 1⅙ = 7/6, ⅔ = 2/3.\nUmumiy maxraj: EKUK(4,6,3) = 12.\n11/4 = 33/12; 7/6 = 14/12; 2/3 = 8/12.\n33/12 + 14/12 − 8/12 = 39/12 = 13/4 = 3¼.","topic":"m3"},
{"id":"4-54","q":"0,1(6) kasrini oddiy kasr ko'rinishida yozing.","options":["1/6","1/5","16/99","16/90"],"correct":0,"solution":"Aralash davriy kasr: vergulgacha 1 ta raqam (1), davrda 1 ta raqam (6).\nFormula: surat = 16−1 = 15, maxraj = 90.\n0,1(6) = 15/90 = 1/6.\nTekshirish: 1÷6 = 0,16666... = 0,1(6) ✓","topic":"m4"},
{"id":"17-48","q":"A(−4) va B(6) nuqtalar orasidagi masofa va AB kesmasining o'rtasi qaysi nuqtada?","options":["Masofa=10, O'rta=(1)","Masofa=10, O'rta=(−1)","Masofa=2, O'rta=(1)","Masofa=10, O'rta=(2)"],"correct":0,"solution":"Masofa = 6−(−4) = 6+4 = 10 birlik.\nO'rta = (a+b)/2 = (−4+6)/2 = 2/2 = 1.\nDemak O'rta nuqta koordinatasi = 1.\nTekshirish: A(−4) dan 1 gacha = 5, B(6) dan 1 gacha = 5 ✓","topic":"m17"},
{"id":"6-54","q":"(2³·4²)/(2⁵) ni soddalashtiring.","options":["4","8","16","2"],"correct":0,"solution":"4² = (2²)² = 2⁴.\nHisoblash: 2³·2⁴ / 2⁵ = 2^(3+4) / 2⁵ = 2⁷ / 2⁵ = 2^(7−5) = 2² = 4.\nDaraja xossalari: aᵐ·aⁿ = aᵐ⁺ⁿ va aᵐ:aⁿ = aᵐ⁻ⁿ.","topic":"m6"},
{"id":"7-64","q":"Mahsulot 18 000 so'mdan sotildi va tadbirkor 20% foyda ko'rdi. Mahsulotning tan narxi qancha?","options":["14 400 so'm","15 000 so'm","22 000 so'm","16 000 so'm"],"correct":1,"solution":"Tan narxi = x deb olsak.\nSotish narxi = x·(1 + 20/100) = 1,2x = 18 000.\nx = 18 000 / 1,2 = 15 000 so'm.\nTekshirish: 15 000·1,2 = 18 000 ✓","topic":"m7"},
{"id":"8-55","q":"To'g'ri burchakli uchburchakning katetlari 6 sm va 8 sm. Gipotenuza va perimetr qancha?","options":["c=10 sm, P=24 sm","c=10 sm, P=26 sm","c=12 sm, P=26 sm","c=10 sm, P=22 sm"],"correct":0,"solution":"Pifagor: c = √(6²+8²) = √(36+64) = √100 = 10 sm.\nPerimetr: P = 6 + 8 + 10 = 24 sm.\nBu mashhur 6−8−10 uchburchagi (3−4−5 ning ikki baravari).\nYuzi: S = (6·8)/2 = 24 sm².","topic":"m8"},
{"id":"9-55","q":"5-burchakli piramidaning uchlari, qirralari va yoqlari sonini toping.","options":["6 uch, 10 qirra, 6 yoq","5 uch, 10 qirra, 6 yoq","6 uch, 8 qirra, 5 yoq","6 uch, 10 qirra, 7 yoq"],"correct":0,"solution":"n-burchakli piramida formulalari:\nUchlar = n+1 = 5+1 = 6 ta.\nQirralar = 2n = 2·5 = 10 ta.\nYoqlar = n+1 = 5+1 = 6 ta.\nXuddi shunday: Uchburchakli (n=3): 4 uch, 6 qirra, 4 yoq.","topic":"m9"},
{"id":"10-56","q":"3 m³ 500 dm³ = ? litr","options":["3050","3500","35 000","305 000"],"correct":1,"solution":"1 m³ = 1000 dm³ = 1000 litr.\n3 m³ = 3000 dm³ = 3000 litr.\n3 m³ 500 dm³ = 3000 + 500 = 3500 dm³ = 3500 litr.\nEslatma: 1 dm³ = 1 litr.","topic":"m10"},
{"id":"11-53","q":"(−3a²b)³ ni standart shaklga keltiring.","options":["−27a⁶b³","27a⁶b³","−9a⁶b³","−27a⁵b³"],"correct":0,"solution":"Qoida: (ab)ⁿ = aⁿ·bⁿ va (aᵐ)ⁿ = aᵐ·ⁿ.\n(−3a²b)³ = (−3)³·(a²)³·b³.\n(−3)³ = −27.\n(a²)³ = a^(2·3) = a⁶.\nNatija: −27a⁶b³.","topic":"m11"},
{"id":"12-55","q":"(x + 5)(x − 3) ni ko'paytirib, soddalashtiring.","options":["x²+2x−15","x²−2x−15","x²+2x+15","x²−8x−15"],"correct":0,"solution":"(x+5)(x−3) = x·x + x·(−3) + 5·x + 5·(−3)\n= x² − 3x + 5x − 15\n= x² + 2x − 15.\nQoida: (x+a)(x+b) = x² + (a+b)x + a·b.\nBu yerda a=5, b=−3: 5+(−3)=2, 5·(−3)=−15. ✓","topic":"m12"},
{"id":"13-57","q":"(2x+1)/3 − (x−1)/2 = 2 tenglamani yeching.","options":["x=5","x=7","x=9","x=3"],"correct":1,"solution":"EKUK(3,2)=6. Har tomonni 6 ga ko'paytiramiz:\n2(2x+1) − 3(x−1) = 12.\n4x+2 − 3x+3 = 12.\nx + 5 = 12.\nx = 7.\nTekshirish: (15/3) − (6/2) = 5−3=2 ✓","topic":"m13"},
{"id":"14-54","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + 2y = 16</span><span>x − y = 2</span></span></span>","options":["(4, 2)","(2, 4)","(3, 1)","(6, −1)"],"correct":0,"solution":"Ikkinchi tenglamadan: x = y+2.\nBirinchiga qo'yamiz: 3(y+2)+2y=16.\n3y+6+2y=16. 5y=10. y=2.\nx = 2+2 = 4.\nYechim: (4, 2).\nTekshirish: 3·4+2·2=16 ✓; 4−2=2 ✓","topic":"m14"},
{"id":"10-54","q":"Velosipedchi 4 soatda 96 km yo'l bosdi. Orqaga qaytishda u 4 km/soat sekinroq ketdi. Qaytish uchun necha soat ketdi?","options":["4,5 soat","5 soat","4,8 soat","6 soat"],"correct":2,"solution":"Borish tezligi: v₁ = 96/4 = 24 km/soat.\nQaytish tezligi: v₂ = 24 − 4 = 20 km/soat.\nQaytish vaqti: t = 96/20 = 4,8 soat.","topic":"m10"},
{"id":"16-50","q":"Jadvalda sinf o'quvchilarining matematikadan olgan baholari berilgan. O'rtacha bahoni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 286 196' width='286' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='8' y='8' width='270' height='180' rx='10' fill='#fff' stroke='#cfdbe5' stroke-width='1.5'/><path d='M 8 44 V 18 Q 8 8 18 8 H 268 Q 278 8 278 18 V 44 Z' fill='#0e7cc4'/><text x='58' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Baho</text><text x='193' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>O'quvchilar soni</text><line x1='9' y1='44' x2='277' y2='44' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>5</text><text x='193' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8 ta</text><rect x='9' y='80' width='268' height='36' fill='#f0f6fb'/><line x1='9' y1='80' x2='277' y2='80' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>4</text><text x='193' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>12 ta</text><line x1='9' y1='116' x2='277' y2='116' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>3</text><text x='193' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>6 ta</text><rect x='9' y='152' width='268' height='36' fill='#f0f6fb'/><line x1='9' y1='152' x2='277' y2='152' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='170' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>2</text><text x='193' y='170' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>4 ta</text><line x1='108' y1='8' x2='108' y2='188' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/></svg>","options":["3,8","4","3,6","3,5"],"correct":0,"solution":"Jami o'quvchi: 8 + 12 + 6 + 4 = 30 ta.\nJami ball: 5·8 + 4·12 + 3·6 + 2·4 = 40 + 48 + 18 + 8 = 114.\nO'rtacha = 114 : 30 = 3,8.","topic":"m16"},
{"id":"17-52","q":"Ikkita to'g'ri chiziq kesishib, bir juft vertikal burchakdan biri 65° ga teng. Qolgan uchta burchakni toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 200' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='40' y1='100' x2='290' y2='100' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><line x1='126.1' y1='183.4' x2='203.9' y2='16.6' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><path d='M 189 100 A 24 24 0 0 0 175.1 78.2' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='196.2' y='80.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>65°</text><path d='M 172.6 83.7 A 18 18 0 0 0 147 100' fill='none' stroke='#8aa0b0' stroke-width='2.2'/><text x='148.3' y='73.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#8aa0b0'>?</text><path d='M 141 100 A 24 24 0 0 0 154.9 121.8' fill='none' stroke='#8aa0b0' stroke-width='2.2'/><text x='133.8' y='119.9' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#8aa0b0'>?</text><path d='M 157.4 116.3 A 18 18 0 0 0 183 100' fill='none' stroke='#8aa0b0' stroke-width='2.2'/><text x='181.7' y='126.1' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#8aa0b0'>?</text><circle cx='165' cy='100' r='3.5' fill='#1f3447'/></svg>","options":["65°, 115°, 115°","65°, 125°, 125°","55°, 115°, 55°","65°, 65°, 115°"],"correct":0,"solution":"Vertikal burchaklar teng: qarama-qarshi burchak ham 65°.\nQo'shni burchaklar: 180°−65°=115°.\nIkkala qo'shni ham 115°.\nDemak 4 ta burchak: 65°, 115°, 65°, 115°.\nQolgan uchta: 65°, 115°, 115°.","topic":"m17"},
{"id":"18-57","q":"8 ta nomzoddan prezident, vitse-prezident va kotibni necha xil usulda tanlash mumkin? (tartib muhim)","options":["56","336","512","24"],"correct":1,"solution":"Bu joylashma (permutatsiya): P(8,3) = 8·7·6 = 336.\nPrezident uchun 8 tanlov.\nVitse-prezident uchun 7 tanlov (biri ketdi).\nKotib uchun 6 tanlov.\n8·7·6 = 336 usul.","topic":"m18"},
{"id":"17-49","q":"Uchburchakning ichki burchaklari nisbati 1:2:3. Ularning o'lchami qancha?","options":["30°, 60°, 90°","40°, 80°, 60°","45°, 90°, 45°","20°, 40°, 120°"],"correct":0,"solution":"Yig'indi = 180°. Nisbat 1:2:3, ya'ni 6 teng qism.\nHar bir qism = 180°/6 = 30°.\nBurchaklar: 1·30°=30°, 2·30°=60°, 3·30°=90°.\nBu to'g'ri burchakli uchburchak (eng kattasi 90°).","topic":"m17"},
{"id":"8-41","q":"Kvadratning perimetri 36 sm. Uning yuzasini toping.","options":["81 sm²","72 sm²","64 sm²","49 sm²"],"correct":0,"solution":"Perimetr = 4a = 36 → a = 9 sm.\nYuza = a² = 9² = 81 sm².\nEslatma: kvadratda barcha tomonlar teng.","topic":"m8"},
{"id":"2-50","q":"EKUB(36; 48) va EKUK(36; 48) ni toping.","options":["EKUB=12, EKUK=144","EKUB=6, EKUK=288","EKUB=12, EKUK=72","EKUB=4, EKUK=432"],"correct":0,"solution":"36 = 2²·3², 48 = 2⁴·3.\nEKUB = 2²·3 = 12.\nEKUK = 2⁴·3² = 144.\nTekshirish: 12·144 = 1728 = 36·48 ✓","topic":"m2"},
{"id":"14-53","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 3x − 1</span><span>y = x + 5</span></span></span>","options":["(3, 8)","(2, 7)","(3, 7)","(4, 9)"],"correct":0,"solution":"Tenglashtirish usuli: 3x−1 = x+5.\n2x = 6, x = 3.\ny = 3·3−1 = 8.\nYechim: (3, 8).\nTekshirish: y=3+5=8 ✓; y=9−1=8 ✓","topic":"m14"},
{"id":"15-52","q":"Otaning yoshi 40, o'g'lining yoshi 10. Necha yildan keyin ota yoshining o'g'li yoshiga nisbati 2:1 bo'ladi?","options":["10 yildan keyin","15 yildan keyin","20 yildan keyin","5 yildan keyin"],"correct":2,"solution":"n yildan keyin: (40+n)/(10+n) = 2/1.\n40+n = 2(10+n) = 20+2n.\n40−20 = 2n−n. n = 20 yil.\nTekshirish: 60/30 = 2 ✓","topic":"m15"},
{"id":"12-47","q":"5a²b − 3ab² + 2a²b ifodani soddalashtiring. a=2, b=1 da son qiymatini toping.","options":["14","16","22","18"],"correct":2,"solution":"5a²b + 2a²b − 3ab² = 7a²b − 3ab².\na=2, b=1 da: 7·(2²)·1 − 3·2·(1²) = 7·4 − 6 = 28 − 6 = 22.\nJavob: 22.","topic":"m12"},
{"id":"9-53","q":"Kub qirrasini 3 marta oshirsak, sirtining yuzi necha marta oshadi?","options":["3 marta","6 marta","9 marta","27 marta"],"correct":2,"solution":"Qoida: o'lchamlar k marta oshsa, yuza k² marta oshadi.\nQirra 3 marta oshsa (a → 3a):\nYangi sirt = 6·(3a)² = 6·9a² = 54a².\nOshish: 54a² / 6a² = 9 marta.","topic":"m9"},
{"id":"18-52","q":"7 ta har xil rangli shar qatorga terilishi mumkin bo'lgan usullar soni?","options":["49","720","5040","2520"],"correct":2,"solution":"Bu n ta turli elementni tartibga qo'yish: P₇ = 7! = 7·6·5·4·3·2·1 = 5040.\n7! = 5040.\n6! = 720 (6 ta uchun), 7! = 7·720 = 5040.","topic":"m18"},
{"id":"8-43","q":"Radiusi 7 sm bo'lgan doiraning yuzi va aylana uzunligini π orqali ifodalang.","options":["S = 49π sm², C = 14π sm","S = 14π sm², C = 49π sm","S = 49π sm², C = 7π sm","S = 21π sm², C = 14π sm"],"correct":0,"solution":"S = πr² = π · 7² = 49π sm².\nC = 2πr = 2π · 7 = 14π sm.\n(π ≈ 3,14 desak: S ≈ 153,86 sm², C ≈ 43,96 sm.)","topic":"m8"},
{"id":"15-33","q":"Bir sinfda 36 o'quvchi bor. Ulardan 20 tasi futbol, 18 tasi basketbol, 8 tasi ikkalasini ham o'ynaydi. Birontasini ham o'ynamaydigan o'quvchilar soni?","options":["4 ta","6 ta","8 ta","10 ta"],"correct":1,"solution":"To'plamlar nazariyasi: |F∪B| = |F|+|B|−|F∩B| = 20+18−8 = 30.\nHech birini o'ynamaydiganlar: 36−30 = 6 ta.","topic":"m15"},
{"id":"11-52","q":"Birhad −4x³y²z ning koeffitsiyenti va darajasi qancha?","options":["koeff: −4, daraja: 6","koeff: −4, daraja: 5","koeff: 4, daraja: 6","koeff: −4, daraja: 7"],"correct":0,"solution":"−4x³y²z standart shaklida:\nKoeffitsiyent = −4 (sonli qism).\nDaraja = darajalar yig'indisi = 3+2+1 = 6.\nEslatma: z = z¹, ya'ni 1 daraja.","topic":"m11"},
{"id":"9-47","q":"Parallelepipedning o'lchamlari 4 sm, 5 sm, 6 sm. To'la sirt yuzi va hajmi qancha?","options":["S=148 sm², V=120 sm³","S=120 sm², V=148 sm³","S=148 sm², V=100 sm³","S=108 sm², V=120 sm³"],"correct":0,"solution":"To'la sirt yuzi: S = 2(ab+bc+ac) = 2(4·5+5·6+4·6) = 2(20+30+24) = 2·74 = 148 sm².\nHajm: V = 4·5·6 = 120 sm³.","topic":"m9"},
{"id":"7-65","q":"Sovg'ani o'rash uchun tasma 7:9 nisbatda ikki bo'lakka bo'lindi. Katta bo'lakning uzunligi 144 sm bo'lsa, tasmaning dastlabki uzunligini toping.","options":["256 sm","112 sm","284 sm","258 sm"],"correct":0,"solution":"Nisbat 7:9, katta bo'lak = 9 qism = 144 sm.\n1 qism = 144/9 = 16 sm.\nKichik bo'lak = 7×16 = 112 sm.\nJami uzunlik = 112 + 144 = 256 sm.\nYoki: jami = 144×(7+9)/9 = 144×16/9 = 256 sm.","topic":"m7"},
{"id":"8-58","q":"Chizmada ABCD to'g'ri to'rtburchakning yuzi 18 sm², BC tomoni 6 sm. DCEF kvadratning perimetrini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 150' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='30,118 30,40 186,40 186,118' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><polygon points='186,118 186,40 264,40 264,118' fill='#e5f6ee' stroke='#1f9d63' stroke-width='2.5' stroke-linejoin='round'/><text x='108' y='79' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1170c4'>S = 18 sm²</text><text x='108' y='27' text-anchor='middle' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1f3447'>BC = 6 sm</text><text x='225' y='79' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>P = ?</text><text x='20' y='126' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='20' y='32' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='186' y='28' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><text x='186' y='131' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text><text x='274' y='32' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>E</text><text x='274' y='126' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>F</text></svg>","options":["16 sm","12 sm","8 sm","10 sm"],"correct":1,"solution":"ABCD yuzasi = AB×BC = AB×6 = 18 → AB = 3 sm.\nDC = AB = 3 sm (to'g'ri to'rtburchakda qarama-qarshi tomonlar teng).\nDCEF kvadratning tomoni = DC = 3 sm.\nPerimetr = 4×3 = 12 sm.","topic":"m8"},
{"id":"15-42","q":"Qutida umumiy og'irligi 6 kg bo'lgan bir xil kitoblar bor. Har bir kitob 400 g bo'lsa, qutida nechta kitob bor?","options":["5 ta","10 ta","12 ta","15 ta"],"correct":3,"solution":"6 kg = 6000 g.\nKitoblar soni = 6000 / 400 = 15 ta.\nTekshirish: 15 × 400 = 6000 g = 6 kg ✓","topic":"m15"},
{"id":"9-44","q":"To'g'ri burchakli parallelepipedning o'lchamlari: 6 sm, 5 sm, 5 sm. Hajmini (sm³) toping.","options":["150 sm³","25 sm³","30 sm³","120 sm³"],"correct":0,"solution":"Hajm = uzunlik × kenglik × balandlik = 6 × 5 × 5 = 150 sm³.\nFormula: V = a × b × c.","topic":"m9"},
{"id":"18-51","q":"2, 3 va 5 raqamlaridan foydalanib (takrorlanmasdan) nechta turli uch xonali son tuzish mumkin?","options":["6 ta","4 ta","3 ta","5 ta"],"correct":0,"solution":"Raqamlar: {2, 3, 5} — 3 ta turli raqam.\nUch xonali son (takrorlanmasdan): 3! = 6 ta.\nRo'yxat: 235, 253, 325, 352, 523, 532.","topic":"m18"},
{"id":"7-61","q":"Asilbek kitobning 33 betini o'qidi va u butun kitobning 6% ini tashkil qilsa, kitob necha betlik?","options":["198 bet","330 bet","550 bet","500 bet"],"correct":2,"solution":"33 bet = 6% bo'lsa, 1% = 33/6 = 5,5 bet.\nJami = 100% = 5,5 × 100 = 550 bet.\nYoki: x × 0,06 = 33 → x = 33/0,06 = 550 bet.","topic":"m7"},
{"id":"12-54","q":"a=3,25 va b=1,25 bo'lsa, a²−b² ifodaning qiymatini toping.","options":["10","9","8","7"],"correct":1,"solution":"a²−b² = (a−b)(a+b).\na−b = 3,25 − 1,25 = 2.\na+b = 3,25 + 1,25 = 4,5.\nNatija = 2 × 4,5 = 9.\nTekshirish: (3,25)² − (1,25)² = 10,5625 − 1,5625 = 9 ✓","topic":"m12"},
{"id":"6-42","q":"Hisoblang: (√49 + √81) / √16","options":["16","8","1","4"],"correct":3,"solution":"√49 = 7, √81 = 9, √16 = 4.\n(7 + 9) / 4 = 16 / 4 = 4.","topic":"m6"},
{"id":"12-49","q":"Ifodani soddalashtiring: −(a−b) + 6 − (b−a+3)","options":["2a","2b","3","2a−2b"],"correct":2,"solution":"−(a−b) + 6 − (b−a+3)\n= −a+b + 6 − b+a−3\n= (−a+a) + (b−b) + (6−3)\n= 0 + 0 + 3 = 3.","topic":"m12"},
{"id":"3-51","q":"4,4 − 1,4 − (1⅔ + 3⅓) ifodaning qiymatini toping.","options":["−2","−1","1","0"],"correct":0,"solution":"1⅔ + 3⅓ = (5/3) + (10/3) = 15/3 = 5.\n4,4 − 1,4 = 3.\n3 − 5 = −2.\nJavob: −2.","topic":"m3"},
{"id":"5-38","q":"Hisoblang: |−6| + |−7| − |−12| · |−1|","options":["−1","1","0","−2"],"correct":1,"solution":"|−6|=6, |−7|=7, |−12|=12, |−1|=1.\n6 + 7 − 12×1 = 13 − 12 = 1.","topic":"m5"},
{"id":"15-31","q":"7 ta ot 5 kunda 60 kg yemish yesa, 15 ta ot 14 kunda qancha yemish yeydi?","options":["300 kg","350 kg","360 kg","180 kg"],"correct":2,"solution":"1 ot 1 kunda: 60/(7×5) = 60/35 = 12/7 kg.\n15 ta ot 14 kunda: 15 × 14 × 12/7 = 15 × 24 = 360 kg.","topic":"m15"},
{"id":"17-42","q":"Chizmada to'g'ri chiziqdagi nuqtada uchta burchak 3x°, 2x° va x° hosil bo'lgan. x ning qiymatini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='20' y1='150' x2='300' y2='150' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><line x1='160' y1='150' x2='263.9' y2='90' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><line x1='160' y1='150' x2='160' y2='35' stroke='#1170c4' stroke-width='2.5' stroke-linecap='round'/><path d='M 194 150 A 34 34 0 0 0 189.4 133' fill='none' stroke='#7c4dcc' stroke-width='2.2'/><text x='211.4' y='136.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#7c4dcc'>x°</text><path d='M 182.5 137 A 26 26 0 0 0 160 124' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='179.5' y='116.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>2x°</text><path d='M 160 124 A 26 26 0 0 0 134 150' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='132.4' y='122.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>3x°</text><circle cx='160' cy='150' r='3.5' fill='#1f3447'/></svg>","options":["40°","45°","60°","30°"],"correct":3,"solution":"To'g'ri chiziqda joylashgan burchaklar yig'indisi 180°.\n3x + 2x + x = 6x = 180°.\nx = 30°.","topic":"m17"},
{"id":"12-40","q":"Ko'paytuvchilarga ajrating: 51b + 57a","options":["3(17a+19b)","3(19a+17b)","17(3a+2b)","19(3a+2b)"],"correct":1,"solution":"51b + 57a = 3(17b + 19a) = 3(19a + 17b).\nTekshirish: 3×19a=57a ✓; 3×17b=51b ✓.","topic":"m12"},
{"id":"16-54","q":"Jadvalga ko'ra umumiy xarid narxini (so'm) toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 326 160' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='8' y='8' width='310' height='144' rx='10' fill='#fff' stroke='#cfdbe5' stroke-width='1.5'/><path d='M 8 44 V 18 Q 8 8 18 8 H 308 Q 318 8 318 18 V 44 Z' fill='#0e7cc4'/><text x='58' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Mahsulot</text><text x='173' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Narx (so'm/kg)</text><text x='278' y='26' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Miqdor</text><line x1='9' y1='44' x2='317' y2='44' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Olma</text><text x='173' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>5 000</text><text x='278' y='62' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>5 kg</text><rect x='9' y='80' width='308' height='36' fill='#f0f6fb'/><line x1='9' y1='80' x2='317' y2='80' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Nok</text><text x='173' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>7 000</text><text x='278' y='98' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>6 kg</text><line x1='9' y1='116' x2='317' y2='116' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Apelsin</text><text x='173' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>13 000</text><text x='278' y='134' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>9 kg</text><line x1='108' y1='8' x2='108' y2='152' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><line x1='238' y1='8' x2='238' y2='152' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/></svg>","options":["180 000","185 000","184 000","174 000"],"correct":2,"solution":"Olma: 5000 × 5 = 25 000 so'm.\nNok: 7000 × 6 = 42 000 so'm.\nApelsin: 13000 × 9 = 117 000 so'm.\nJami: 25 000 + 42 000 + 117 000 = 184 000 so'm.","topic":"m16"},
{"id":"10-36","q":"Avtomobil 42 minutda 7 km yo'l yursa, uning tezligini (km/soat) aniqlang.","options":["10","12","6","60"],"correct":0,"solution":"42 minut = 42/60 = 0,7 soat.\nTezlik = 7 / 0,7 = 10 km/soat.","topic":"m10"},
{"id":"15-50","q":"Zafarda 25 000 so'm, Azizada 13 000 so'm bor. Zafar qanchasini Azizaga bersa, pullari teng bo'ladi?","options":["5000","6000","7000","8000"],"correct":1,"solution":"Jami pul = 25000+13000 = 38000.\nHar biri = 38000/2 = 19000 so'm.\nZafar berishi kerak = 25000−19000 = 6000 so'm.","topic":"m15"},
{"id":"18-48","q":"10 so'mlik va 20 so'mlik pullar yordamida 100 so'm hosil qilishning necha xil usuli bor?","options":["5","6","10","8"],"correct":1,"solution":"10×a + 20×b = 100. a=10−2b.\nb=0: a=10; b=1: a=8; b=2: a=6; b=3: a=4; b=4: a=2; b=5: a=0.\nJami 6 ta usul.","topic":"m18"},
{"id":"13-52","q":"Tenglamani yeching: 2(2x−3) + 3 = 3x","options":["1","2","3","4"],"correct":2,"solution":"4x−6+3 = 3x.\n4x−3 = 3x.\nx = 3.\nTekshirish: 2(6−3)+3 = 6+3=9=3×3 ✓","topic":"m13"},
{"id":"7-39","q":"Mato 2:3 kabi nisbatda bo'lingan bo'lsa, kichik mato butun matoning necha foizini tashkil etadi?","options":["40%","60%","50%","20%"],"correct":0,"solution":"Jami qismlar = 2+3 = 5.\nKichik mato = 2/5 qism = 2/5 × 100% = 40%.","topic":"m7"},
{"id":"12-23","q":"Ifodani soddalashtiring: 3a − 6a³ : 3a²","options":["a","−3a","2a","−2a"],"correct":0,"solution":"6a³ : 3a² = 2a.\n3a − 2a = a.","topic":"m12"},
{"id":"9-34","q":"Kubning to'la sirti 24 sm² ga teng bo'lsa, uning asosi yuzini toping (sm²).","options":["2","9","4","8"],"correct":2,"solution":"To'la sirt = 6a² = 24 → a² = 4.\nAsosning yuzi = a² = 4 sm².","topic":"m9"},
{"id":"7-49","q":"50 sonining 50% ini 2 ga ko'paytiring.","options":["10","50","25","100"],"correct":1,"solution":"50 ning 50% = 50 × 0,5 = 25.\n25 × 2 = 50.\nJavob: 50.","topic":"m7"},
{"id":"18-50","q":"0, 1, 2, 3 raqamlaridan foydalanib (takrorlanmasdan) eng katta to'rt xonali va eng kichik to'rt xonali sonlar tuzildi. Ularning musbat ayirmasini toping.","options":["2187","1998","1971","2007"],"correct":0,"solution":"Eng katta to'rt xonali: 3210.\nEng kichik to'rt xonali (0 boshda bo'lmaydi): 1023.\nAyirma: 3210 − 1023 = 2187.","topic":"m18"},
{"id":"8-57","q":"Chizmada ABCD kvadratning yuzi 9 sm², ABEF to'g'ri to'rtburchakning perimetri 16 sm. CDFE to'g'ri to'rtburchakning yuzini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 260 185' width='260' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='40,132 40,30 210,30 210,132' fill='#fff' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><polygon points='142,132 142,30 210,30 210,132' fill='#e5f6ee' stroke='#1f9d63' stroke-width='2.5' stroke-linejoin='round'/><polygon points='40,132 40,30 142,30 142,132' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><text x='91' y='81' text-anchor='middle' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1170c4'>S = 9 sm²</text><text x='176' y='81' text-anchor='middle' dominant-baseline='central' font-size='18' font-weight='700' fill='#1f9d63'>?</text><text x='125' y='162' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f3447'>ABEF perimetri = 16 sm</text><text x='30' y='140' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='30' y='22' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='142' y='18' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><text x='142' y='145' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text><text x='220' y='22' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>E</text><text x='220' y='140' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>F</text></svg>","options":["4 sm²","6 sm²","2 sm²","8 sm²"],"correct":1,"solution":"ABCD kvadrat: a² = 9 → AB = BC = 3 sm.\nABEF perimetri: 2(AB + BE) = 16 → 3 + BE = 8 → BE = 5 sm.\nCE = BE − BC = 5 − 3 = 2 sm.\nS(CDFE) = CD · CE = 3 · 2 = 6 sm².","topic":"m8"},
{"id":"18-19","q":"Sabina 8 ta mavzuga tayyorlanishi kerak. Ulardan bittasini eng ko'pi bilan necha xil usulda tanlaydi?","options":["2","4","1","8"],"correct":3,"solution":"8 ta mavzudan 1 tasini tanlash = C(8,1) = 8 xil usul.","topic":"m18"},
{"id":"7-33","q":"Qaysi sonning 8% i 24 ga teng bo'ladi?","options":["30","3","300","192"],"correct":2,"solution":"x × 8/100 = 24.\nx = 24 × 100/8 = 2400/8 = 300.","topic":"m7"},
{"id":"18-54","q":"2, 3, 4, 5 raqamlaridan foydalanib jami nechta ikki xonali son tuzish mumkin? (takrorlanishi mumkin)","options":["12","8","20","16"],"correct":3,"solution":"4 ta raqam bor (2,3,4,5). Har biri takrorlanishi mumkin.\nIkki xonali son: 4×4 = 16 ta.\n(O'nlar xonasi uchun 4 tanlov, birlar xonasi uchun 4 tanlov.)","topic":"m18"},
{"id":"10-45","q":"Mashina 60 km/soat, velosipedchi 20 km/soat tezlikda bir joydan qarama-qarshi tomonlarga harakatlandi. Necha soatdan keyin ular orasidagi masofa 240 km bo'ladi?","options":["6","4","10","3"],"correct":3,"solution":"Qarama-qarshi tomonlarga harakatda uzoqlashish tezligi: 60 + 20 = 80 km/soat.\nt = 240 : 80 = 3 soat.","topic":"m10"},
{"id":"13-49","q":"Tenglamani yeching: −17 + (−28) + 2x = −41","options":["2","4","0","1"],"correct":0,"solution":"−17−28+2x = −41.\n−45+2x = −41.\n2x = 4.\nx = 2.","topic":"m13"},
{"id":"7-18","q":"Metall qotishmasi massasining 3/5 qismini mis tashkil qiladi. 60 kg li metal qotishmaning necha kilogrammini mis tashkil qiladi?","options":["36","24","18","12"],"correct":0,"solution":"Mis = 60 × 3/5 = 60 × 0,6 = 36 kg.","topic":"m7"},
{"id":"12-53","q":"Soddalashtiring: −3 − (−2 + a − b) − (b − a) − 1","options":["0","−1","−2","2"],"correct":2,"solution":"−3 − (−2 + a − b) − (b − a) − 1\n= −3 + 2 − a + b − b + a − 1\n= (−3 + 2 − 1) + (−a + a) + (b − b)\n= −2 + 0 + 0 = −2.","topic":"m12"},
{"id":"8-40","q":"Uchburchakning perimetri 27 sm, tomonlari 6, 12 va (2x+1). x ni toping.","options":["1","2","3","4"],"correct":3,"solution":"6 + 12 + (2x+1) = 27.\n19 + 2x = 27.\n2x = 8.\nx = 4.","topic":"m8"},
{"id":"12-42","q":"a=5, b=15 bo'lsa, (2a²−b/3)·2 ifodaning qiymatini toping.","options":["80","45","40","90"],"correct":3,"solution":"2a² = 2×25 = 50.\nb/3 = 15/3 = 5.\n(50−5)×2 = 45×2 = 90.","topic":"m12"},
{"id":"5-25","q":"Hisoblang: (−2)+(−2)+(−2)+...+(−2) (10 ta) + 22","options":["2","−20","−2","0"],"correct":0,"solution":"10 ta (−2) = −20.\n−20 + 22 = 2.","topic":"m5"},
{"id":"18-41","q":"1, 2, 3, 5 sonlaridan foydalanib nechta takrorlanmaydigan 2 xonali son tuzish mumkin?","options":["16","12","6","8"],"correct":1,"solution":"4 ta raqam (1,2,3,5), takrorlanmasdan 2 xonali:\nO'nlar uchun 4 tanlov, birlar uchun 3 tanlov = 4×3 = 12 ta.","topic":"m18"},
{"id":"9-3","q":"Bo'yi 8m, eni 0,5m, balandligi 2m bo'lgan devorning hajmini toping (m³).","options":["16","8","4","12"],"correct":1,"solution":"V = 8 × 0,5 × 2 = 8 m³.","topic":"m9"},
{"id":"8-45","q":"To'g'ri to'rtburchakning tomonlari 12 sm va 3 sm. Unga tengdosh kvadratning perimetrini toping.","options":["36 sm","12 sm","6 sm","24 sm"],"correct":3,"solution":"To'g'ri to'rtburchak yuzi = 12×3 = 36 sm².\nTengdosh kvadrat: a² = 36 → a = 6 sm.\nPerimetr = 4×6 = 24 sm.","topic":"m8"},
{"id":"1-56","q":"To'g'ri tasdiqni toping: 1) eng kichik natural son 0; 2) eng kichik butun son 0; 3) eng kichik tub son 1; 4) har qanday natural sonning nolinchi darajasi 1 ga teng","options":["1 va 2","faqat 4","1 va 4","2 va 4"],"correct":1,"solution":"1) Yolg'on — eng kichik natural son 1.\n2) Yolg'on — eng kichik butun son mavjud emas (cheksiz kichik).\n3) Yolg'on — eng kichik tub son 2.\n4) To'g'ri — har qanday a≠0 uchun a⁰=1.\nFaqat 4-tasdiq to'g'ri.","topic":"m1"},
{"id":"7-45","q":"400 soni 30% ga oshirildi. Hosil bo'lgan sonning 30% ini toping.","options":["520","150","156","400"],"correct":2,"solution":"400 ning 30% = 120. Yangi son = 400+120 = 520.\n520 ning 30% = 520×0,3 = 156.","topic":"m7"},
{"id":"2-27","q":"Nechta ikki xonali natural son 10 ga qoldiqsiz bo'linadi?","options":["9","10","8","11"],"correct":0,"solution":"10 ga bo'linadigan ikki xonali sonlar: 10, 20, 30, 40, 50, 60, 70, 80, 90.\nJami: 9 ta.","topic":"m2"},
{"id":"5-55","q":"Hisoblang: 1:3·4 − 1:3","options":["1/12","1","3/4","4/3"],"correct":1,"solution":"Amallar tartibi chapdan o'ngga (bo'lish va ko'paytirish teng darajada):\n1:3·4 = (1/3)·4 = 4/3.\nKeyin: 4/3 − 1:3 = 4/3 − 1/3 = 3/3 = 1.","topic":"m5"},
{"id":"8-26","q":"To'g'ri burchakli uchburchakning yuzi 30 sm², bir kateti 5 sm. Ikkinchi katetini toping.","options":["6 sm","15 sm","10 sm","12 sm"],"correct":3,"solution":"S = (a×b)/2 = 30 → a×b = 60.\na = 5 → b = 60/5 = 12 sm.","topic":"m8"},
{"id":"10-32","q":"18 sotix necha m² ga teng?","options":["1800 m²","18 m²","180 m²","0,18 m²"],"correct":0,"solution":"1 sotix = 1 ar = 100 m².\n18 sotix = 18×100 = 1800 m².","topic":"m10"},
{"id":"2-36","q":"Sarvinozning qadami 45 sm, singlisi Feruzanikining 30 sm. Qanday eng qisqa masofada qadam izlari ustma-ust tushadi? (sm)","options":["180 sm","100 sm","15 sm","90 sm"],"correct":3,"solution":"EKUK(45, 30) = ?\n45 = 3²×5, 30 = 2×3×5.\nEKUK = 2×3²×5 = 90 sm.","topic":"m2"},
{"id":"18-22","q":"4 xil sabzavotdan 2 tadan olib necha xil salat tayyorlash mumkin?","options":["4","8","6","12"],"correct":2,"solution":"Kombinatsiya: C(4,2) = 4!/(2!×2!) = (4×3)/(2×1) = 6 ta.","topic":"m18"},
{"id":"7-35","q":"Sinfda 40 nafar o'quvchi bor. Ularning 55% i o'g'il bolalar bo'lsa, qiz bolalar sonini toping.","options":["14","12","18","22"],"correct":2,"solution":"O'g'illar = 40×55/100 = 22 ta.\nQizlar = 40−22 = 18 ta.","topic":"m7"},
{"id":"2-29","q":"5 dan 32 gacha bo'lgan sonlar orasida nechta 3 ga karrali son bor?","options":["9 ta","10 ta","8 ta","11 ta"],"correct":0,"solution":"6, 9, 12, 15, 18, 21, 24, 27, 30 — jami 9 ta.\n(5 dan katta, 32 dan kichik, 3 ga karrali.)","topic":"m2"},
{"id":"2-41","q":"17 ga bo'linadigan ikki xonali sonlar nechta?","options":["4","5","6","7"],"correct":1,"solution":"17, 34, 51, 68, 85 — ikki xonali va 17 ga bo'linadigan: 5 ta.\n(17×1=17, ×2=34, ×3=51, ×4=68, ×5=85, ×6=102 — 3 xonali.)","topic":"m2"},
{"id":"5-21","q":"−7 dan 9 gacha nechta butun son bor?","options":["16 ta","14 ta","15 ta","17 ta"],"correct":3,"solution":"−7, −6, ..., 0, ..., 9: soni = 9−(−7)+1 = 9+7+1 = 17 ta.","topic":"m5"},
{"id":"7-56","q":"Ra'no kitobining 60% iga kitob sotib olganidan so'ng, 12 000 so'm puli qoldi. Ra'noda dastlab qancha pul bo'lgan?","options":["30 000","3 000","35 000","72 000"],"correct":0,"solution":"Sarfladi: 60%. Qoldi: 40% = 12 000 so'm.\n1% = 300 so'm.\nJami = 100% = 30 000 so'm.","topic":"m7"},
{"id":"9-29","q":"Kubning hajmi 27 m³ ga teng bo'lsa, uning to'la sirti yuzini toping (m²).","options":["3 m²","12 m²","18 m²","54 m²"],"correct":3,"solution":"V = a³ = 27 → a = 3 m.\nTo'la sirt = 6a² = 6×9 = 54 m².","topic":"m9"},
{"id":"5-47","q":"Hisoblang: (−5)·(−3) + (−2)·4","options":["7","−7","−22","22"],"correct":0,"solution":"(−5)×(−3) = 15.\n(−2)×4 = −8.\n15 + (−8) = 7.","topic":"m5"},
{"id":"8-20","q":"Uchburchakning balandligi 12 sm, asosi 10 sm. Yuzini toping (sm²).","options":["120 sm²","60 sm²","180 sm²","30 sm²"],"correct":1,"solution":"S = (asos × balandlik) / 2 = (10 × 12) / 2 = 60 sm².","topic":"m8"},
{"id":"14-25","q":"Tenglamalar sistemasidan x·y ning qiymatini toping:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x = y − 1</span><span>x + 2y = 2</span></span></span>","options":["1","2","0","4"],"correct":2,"solution":"x=y−1 ni ikkinchiga: (y−1)+2y=2 → 3y=3 → y=1.\nx=1−1=0.\nx·y = 0×1 = 0.","topic":"m14"},
{"id":"15-43","q":"Ota 24 yoshdaligida o'g'il farzandli bo'ldi. Hozir ota o'g'ildan 3 marta katta bo'lsa, o'g'lining yoshini toping.","options":["10","5","6","12"],"correct":3,"solution":"O'g'il yoshi = x, ota yoshi = 3x.\nOta − o'g'il = 24 (doim).\n3x − x = 24 → 2x = 24 → x = 12.","topic":"m15"},
{"id":"9-45","q":"Qirrasi 20 sm bo'lgan kub shaklidagi tort 8 ta teng kubchaga kesildi. Bitta kubchaning hajmini toping.","options":["1000 sm³","2500 sm³","800 sm³","125 sm³"],"correct":0,"solution":"Tort hajmi: 20³ = 8000 sm³.\n8000 : 8 = 1000 sm³ (har bir kubchaning qirrasi 10 sm).","topic":"m9"},
{"id":"7-24","q":"Aziz kitobning 36 betini o'qidi. Shunda u kitobning 18% ini tashkil qilsa, kitob necha betlik?","options":["20","200","400","100"],"correct":1,"solution":"x × 18/100 = 36 → x = 36×100/18 = 200 bet.","topic":"m7"},
{"id":"9-30","q":"3 m² yuzani bo'yash uchun 1 litr rang ketadi. Qirrasi 1 m bo'lgan kubning sirtini bo'yash uchun necha litr rang kerak?","options":["3 litr","1 litr","2 litr","6 litr"],"correct":2,"solution":"Kub to'la sirti = 6a² = 6×1 = 6 m².\nRang: 6/3 = 2 litr.","topic":"m9"},
{"id":"13-42","q":"Tenglamani yeching: 2(2x−3) + 4 = 3(x+1)","options":["−5","5","6","1"],"correct":1,"solution":"4x−6+4 = 3x+3.\n4x−2 = 3x+3.\nx = 5.","topic":"m13"},
{"id":"18-44","q":"Sardor uydan maktabga 4 xil yo'l bilan borishi mumkin. Borgan yo'l bilan qaytmaslik sharti bilan necha xil usulda borib qaytishi mumkin?","options":["12","16","7","8"],"correct":0,"solution":"Borish: 4 ta usul.\nQaytish: 3 ta usul (borgan yo'ldan boshqasi).\nJami: 4×3 = 12 usul.","topic":"m18"},
{"id":"8-37","q":"To'g'ri to'rtburchakning perimetri 36 sm, eni 6 sm. Yuzini toping (sm²).","options":["12 sm²","72 sm²","24 sm²","36 sm²"],"correct":1,"solution":"P = 2(a+b) = 36 → a+b = 18.\nb = 6 → a = 12 sm.\nYuza = 12×6 = 72 sm².","topic":"m8"},
{"id":"7-40","q":"Arqon 2:3 nisbatdagi bo'laklarga ajratildi. Katta bo'lakning uzunligi 9 m bo'lsa, arqonning uzunligini toping.","options":["6 m","3 m","12 m","15 m"],"correct":3,"solution":"Nisbat 2:3. Katta = 3 qism = 9 m → 1 qism = 3 m.\nJami = (2+3)×3 = 15 m.","topic":"m7"},
{"id":"7-59","q":"Do'konda shim va ko'ylak uchun mos ravishda 40% va 50% chegirma berilmoqda. Shimning narxi 250 000 so'm, ko'ylakniki 120 000 so'm. Chegirmadan so'ng jami to'lov?","options":["160 000","210 000","240 000","192 000"],"correct":1,"solution":"Shim: 250 000×0,6 = 150 000 so'm.\nKo'ylak: 120 000×0,5 = 60 000 so'm.\nJami: 150 000+60 000 = 210 000 so'm.","topic":"m7"},
{"id":"18-25","q":"Savatda 4 ta olma va 3 ta nok bor. Savatdan 1 ta mevani necha xil usulda olish mumkin?","options":["12","7","1","24"],"correct":1,"solution":"Jami mevalar = 4+3 = 7 ta. 1 tasini tanlash = 7 xil usul.","topic":"m18"},
{"id":"13-51","q":"Tenglamani yeching: (3x+2)/(2x−1) = 2","options":["−4","1","−2","4"],"correct":3,"solution":"3x+2 = 2(2x−1) = 4x−2.\n3x+2 = 4x−2.\n2+2 = 4x−3x.\nx = 4.","topic":"m13"},
{"id":"10-15","q":"12 metrlik arqon teng 15 ta bo'lakka bo'lindi. Har bir bo'lak necha sm?","options":["8 sm","80 sm","120 sm","100 sm"],"correct":1,"solution":"12 m = 1200 sm.\n1200 / 15 = 80 sm.","topic":"m10"},
{"id":"7-51","q":"Proporsiyaning noma'lum hadini toping: 1:5 = 20:x","options":["8","4","12","100"],"correct":3,"solution":"1/5 = 20/x.\nx = 20×5 = 100.\nYoki: 1·x = 5·20 → x = 100.","topic":"m7"},
{"id":"9-54","q":"Quyidagi jismlardan qaysi birining yoqlari soni eng ko'p?","options":["uchburchakli prizma","beshburchakli prizma","to'rtburchakli piramida","kub"],"correct":1,"solution":"Uchburchakli prizma: n+2=5 yoq.\nBeshburchakli prizma: n+2=7 yoq.\nTo'rtburchakli piramida: n+1=5 yoq.\nKub: 6 yoq.\nEng ko'p: beshburchakli prizma — 7 yoq.","topic":"m9"},
{"id":"2-18","q":"EKUB(48; 120) = ?","options":["16","24","12","8"],"correct":1,"solution":"48 = 2⁴×3, 120 = 2³×3×5.\nEKUB = 2³×3 = 24.","topic":"m2"},
{"id":"12-1","q":"Soddalashtiring: 4(x+1) + 2(2−x)","options":["2x","8","2x−8","2x+8"],"correct":3,"solution":"4x+4+4−2x = 2x+8.","topic":"m12"},
{"id":"3-33","q":"Hisoblang: 2 1/15 + 1⅔","options":["3 3/18","3 7/15","11/15","3 11/15"],"correct":3,"solution":"2 1/15 = 31/15. 1⅔ = 5/3 = 25/15.\n31/15 + 25/15 = 56/15 = 3 11/15.","topic":"m3"},
{"id":"18-49","q":"0,1,2,4 raqamlaridan takrorlanmaydigan eng katta va eng kichik to'rt xonali sonlar tuzildi. Ayirmasini toping.","options":["3186","3177","3168","3087"],"correct":0,"solution":"Eng katta: 4210 (katta raqamlar avval).\nEng kichik (0 boshda bo'lmasin): 1024.\nAyirma: 4210 − 1024 = 3186.","topic":"m18"},
{"id":"12-43","q":"8 + b + a − (a + 4 − b) ifodani soddalashtiring.","options":["4 + 2b","4 − 2b","12 + 2b","2b"],"correct":0,"solution":"8 + b + a − a − 4 + b\n= (8−4) + (b+b) + (a−a)\n= 4 + 2b.","topic":"m12"},
{"id":"13-50","q":"7/(x+1) + 2 = 6/(x+1) + 3 tenglamasini yeching.","options":["x = 0","x = −2","x = 1","x = −1"],"correct":0,"solution":"7/(x+1) − 6/(x+1) = 3 − 2.\n1/(x+1) = 1 → x+1 = 1 → x = 0.\nTekshirish: 7/1+2 = 6/1+3 → 9=9 ✓","topic":"m13"},
{"id":"5-44","q":"5 + (−3) − (−2)⁴ ni hisoblang.","options":["−14","18","−18","14"],"correct":0,"solution":"(−2)⁴ = +16 (juft ko'rsatkich → musbat).\n5 + (−3) − 16 = 5 − 3 − 16 = −14.","topic":"m5"},
{"id":"9-25","q":"Kubning qirrasi 2 ga teng bo'lsa, uning hajmini toping.","options":["4","6","8","12"],"correct":2,"solution":"V = a³ = 2³ = 8.\nKub hajmi = qirra³.","topic":"m9"},
{"id":"9-41","q":"Kubning qirrasi 2 ga teng bo'lsa, to'la sirt yuzini toping.","options":["8","16","24","12"],"correct":2,"solution":"To'la sirt = 6a² = 6 × 4 = 24.\n6 ta teng yog'i bor, har biri = a² = 4.","topic":"m9"},
{"id":"9-42","q":"Kubning qirrasi 2 ga teng bo'lsa, yon sirt yuzini toping.","options":["8","16","4","12"],"correct":1,"solution":"Yon sirt = 4a² = 4 × 4 = 16.\n4 ta yon yog'i (asos va qopqoq kiritilmaydi).","topic":"m9"},
{"id":"10-50","q":"Bekzodning uyidan maktabgacha 2,5 km. Masofaning yarmini bosib o'tgandan keyin manzilgacha necha metr qolgan?","options":["1250 m","750 m","2500 m","500 m"],"correct":0,"solution":"2,5 km = 2500 m.\nYarmi = 1250 m bosib o'tdi.\nQoldi = 2500 − 1250 = 1250 m.","topic":"m10"},
{"id":"8-52","q":"Kvadratning yuzi 16 sm². Tomoni shu kvadrat tomoniga teng bo'lgan muntazam oltiburchakning perimetrini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 310 165' width='310' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='34,46 100,46 100,112 34,112' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><text x='67' y='132' text-anchor='middle' dominant-baseline='central' font-size='11.5' font-weight='700' fill='#46637a'>S = 16 sm²</text><polygon points='222,14 164.8,47 164.8,113 222,146 279.2,113 279.2,47' fill='#e5f6ee' stroke='#1f9d63' stroke-width='2.5' stroke-linejoin='round'/><text x='222' y='80' text-anchor='middle' dominant-baseline='central' font-size='14' font-weight='700' fill='#1f9d63'>P = ?</text><line x1='190.4' y1='25.3' x2='196.4' y2='35.7' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='158.8' y1='80' x2='170.8' y2='80' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='190.4' y1='134.7' x2='196.4' y2='124.3' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='253.6' y1='134.7' x2='247.6' y2='124.3' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='285.2' y1='80' x2='273.2' y2='80' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='253.6' y1='25.3' x2='247.6' y2='35.7' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='67' y1='52' x2='67' y2='40' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='94' y1='79' x2='106' y2='79' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='67' y1='106' x2='67' y2='118' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='40' y1='79' x2='28' y2='79' stroke='#d65745' stroke-width='2' stroke-linecap='round'/></svg>","options":["16 sm","20 sm","24 sm","12 sm"],"correct":2,"solution":"Kvadrat yuzi: a² = 16 → a = 4 sm.\nOltiburchak tomoni = kvadrat tomoni = 4 sm.\nMuntazam oltiburchak 6 ta teng tomonli: P = 6 × 4 = 24 sm.","topic":"m8"},
{"id":"17-41","q":"Teng yonli uchburchakning uchidagi burchagi 58° bo'lsa, asosidagi bitta burchagini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='68,174 232,174 150,26' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='114.2' y1='102.9' x2='103.7' y2='97.1' stroke='#1f9d63' stroke-width='2' stroke-linecap='round'/><line x1='196.3' y1='97.1' x2='185.8' y2='102.9' stroke='#1f9d63' stroke-width='2' stroke-linecap='round'/><path d='M 137.4 48.7 A 26 26 0 0 0 162.6 48.7' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='150' y='65' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>58°</text><path d='M 92 174 A 24 24 0 0 0 79.6 153' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='99.8' y='155.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>?</text></svg>","options":["58°","61°","122°","29°"],"correct":1,"solution":"Teng yonli uchburchakda ikkita asos burchagi teng.\n58° + 2α = 180°.\n2α = 122° → α = 61°.","topic":"m17"},
{"id":"18-55","q":"0, 2, 4 raqamlaridan foydalanib (raqamlar takrorlanmasin) nechta turli uch xonali son tuzish mumkin?","options":["4 ta","6 ta","8 ta","3 ta"],"correct":0,"solution":"0 boshda bo'lmasin (takrorlanmasdan):\nYuzlar xonasi 2 yoki 4 (2 tanlov), qolgan ikki raqam 2! = 2 xil joylashadi.\n2 × 2 = 4 ta. (204, 240, 402, 420)","topic":"m18"},
{"id":"10-43","q":"1 m³ hajmli idishni necha litr suv bilan to'ldirish mumkin?","options":["100 litr","10 litr","1000 litr","10 000 litr"],"correct":2,"solution":"1 m = 10 dm → 1 m³ = 10³ dm³ = 1000 dm³.\n1 dm³ = 1 litr → 1 m³ = 1000 litr.","topic":"m10"},
{"id":"7-43","q":"600 ning 45% ini hisoblang.","options":["250","270","280","300"],"correct":1,"solution":"600 × 45/100 = 600 × 0,45 = 270.\nYoki: 600×40%=240; 600×5%=30. Jami: 270.","topic":"m7"},
{"id":"15-6","q":"Qutiga 185 dona olma solingandan so'ng jami 400 ta bo'ldi. Dastlab qutida nechta olma bo'lgan?","options":["585 ta","225 ta","215 ta","185 ta"],"correct":2,"solution":"x + 185 = 400 → x = 400 − 185 = 215 ta.","topic":"m15"},
{"id":"12-50","q":"a=4,25 va b=2,25 bo'lsa, a²−b² ning qiymatini hisoblang.","options":["9","12","13","6,5"],"correct":2,"solution":"a²−b² = (a−b)(a+b).\na−b = 4,25−2,25 = 2.\na+b = 4,25+2,25 = 6,5.\nNatija = 2 × 6,5 = 13.","topic":"m12"},
{"id":"7-21","q":"Usta bugun 9 ta detal yasadi. Bu uning odatdagi kunlik ishining 12,5% iga teng. Usta odatda kuniga nechta detal yasaydi?","options":["72 ta","108 ta","90 ta","36 ta"],"correct":0,"solution":"x · 12,5% = 9 → x = 9 : 0,125 = 72 ta.","topic":"m7"},
{"id":"9-16","q":"Parallelepiped asosining yuzi 32 sm², balandligi 8 sm. Hajmini toping.","options":["256 sm³","40 sm³","128 sm³","64 sm³"],"correct":0,"solution":"V = S_asos × h = 32 × 8 = 256 sm³.","topic":"m9"},
{"id":"9-12","q":"Parallelepipedning hajmi 60 sm³, asosining yuzi 12 sm². Balandligini toping.","options":["5 sm","6 sm","4 sm","8 sm"],"correct":0,"solution":"h = V / S_asos = 60 / 12 = 5 sm.","topic":"m9"},
{"id":"8-56","q":"Muntazam uchburchakning perimetri 12 sm, to'g'ri to'rtburchakning yuzi 24 sm². Ular umumiy tomonga ega (chizmada to'q sariq rangda). To'g'ri to'rtburchakning perimetrini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 165' width='300' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='186,30 276.1,82 186,134' fill='#e5f6ee' stroke='#1f9d63' stroke-width='2.5' stroke-linejoin='round'/><polygon points='30,30 186,30 186,134 30,134' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='186' y1='30' x2='186' y2='134' stroke='#f08a24' stroke-width='3' stroke-linecap='round'/><text x='108' y='73' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1170c4'>S = 24 sm²</text><text x='108' y='93' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1170c4'>P = ?</text><text x='223.4' y='82' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='700' fill='#1f9d63'>P=12</text><line x1='228' y1='61.2' x2='234' y2='50.8' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='228' y1='102.8' x2='234' y2='113.2' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><line x1='192' y1='82' x2='180' y2='82' stroke='#d65745' stroke-width='2' stroke-linecap='round'/><polyline points='30,123 41,123 41,134' fill='none' stroke='#8aa0b0' stroke-width='1.6'/><polyline points='175,134 175,123 186,123' fill='none' stroke='#8aa0b0' stroke-width='1.6'/></svg>","options":["20 sm","24 sm","22 sm","18 sm"],"correct":0,"solution":"Muntazam uchburchak tomoni = 12/3 = 4 sm.\nBu to'g'ri to'rtburchakning bir tomoni = 4 sm.\n4 × b = 24 → b = 6 sm.\nPerimetr = 2(4+6) = 20 sm.","topic":"m8"},
{"id":"17-46","q":"Teng yonli uchburchakda uchidagi burchak 58°. Chizmadagi tashqi x° burchagini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><polygon points='49.8,170 205,170 127.4,30' fill='#e4f0fb' stroke='#1170c4' stroke-width='2.5' stroke-linejoin='round'/><line x1='205' y1='170' x2='270.2' y2='170' stroke='#1f3447' stroke-width='2' stroke-linecap='round'/><line x1='93.9' y1='102.9' x2='83.4' y2='97.1' stroke='#1f9d63' stroke-width='2' stroke-linecap='round'/><line x1='171.5' y1='97.1' x2='161' y2='102.9' stroke='#1f9d63' stroke-width='2' stroke-linecap='round'/><path d='M 115.8 51 A 24 24 0 0 0 139 51' fill='none' stroke='#d65745' stroke-width='2.2'/><text x='127.4' y='67' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#d65745'>58°</text><path d='M 194.3 150.8 A 22 22 0 0 1 227 170' fill='none' stroke='#1f9d63' stroke-width='2.2'/><text x='222.8' y='139.8' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f9d63'>x</text><text x='37.8' y='177.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><text x='218.7' y='178.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><text x='127.4' y='16' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><text x='270.2' y='184' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text></svg>","options":["61°","119°","122°","90°"],"correct":1,"solution":"Asos burchagi: (180°−58°)/2 = 122°/2 = 61°.\nTashqi burchak = 180° − 61° = 119°.\n(Tashqi burchak = qo'shni ichki burchakni to'ldiradi.)","topic":"m17"},
{"id":"10-42","q":"Toshbaqa 1 minutda 2 metr yo'l bosadi. 150 metrni necha soatda bosib o'tadi?","options":["1 soat","1,25 soat","1,5 soat","2 soat"],"correct":1,"solution":"150 metr uchun vaqt: 150 ÷ 2 = 75 minut.\n75 minut = 75/60 = 1,25 soat.","topic":"m10"},
{"id":"10-1","q":"Shilliqqurt 1 minutda 0,5 metr masofani bosib o'tsa, 20 metrni qancha vaqtda bosib o'tadi? (minut)","options":["30","40","20","10"],"correct":1,"solution":"20 ÷ 0,5 = 40 minut.","topic":"m10"},
{"id":"7-53","q":"a sonining 36% i, 108 ning 24% iga teng. a sonini toping.","options":["36","108","72","54"],"correct":2,"solution":"a × 0,36 = 108 × 0,24.\na × 0,36 = 25,92.\na = 25,92 / 0,36 = 72.","topic":"m7"},
{"id":"2-28","q":"Nechta ikki xonali son 50 ning bo'luvchisi bo'ladi?","options":["2","3","4","5"],"correct":1,"solution":"50 ning bo'luvchilari: 1, 2, 5, 10, 25, 50.\nIkki xonali bo'luvchilar: 10, 25, 50 — 3 ta.","topic":"m2"},
{"id":"18-36","q":"Gul do'konida qizil atirguldan 3 xil guldasta va oq atirguldan 2 xil guldasta yasalgan. Bu guldastalardan 1 tasini olishning nechta usuli bor?","options":["4","5","9","12"],"correct":1,"solution":"Yig'indi qoidasi: 3 + 2 = 5 xil usul.\n(1 ta guldasta tanlanadi — qizil yoki oq.)","topic":"m18"},
{"id":"18-35","q":"Gul do'konida qizil atirguldan 4 xil va oq atirguldan 2 xil guldasta yasalgan. Har xil rangdan 1 tadan, jami 2 ta guldasta olishning nechta usuli bor?","options":["8","60","6","12"],"correct":0,"solution":"Ko'paytirish qoidasi: 4 × 2 = 8 xil usul.\n(Qizil va oq guldasta birga olinadi.)","topic":"m18"},
{"id":"15-5","q":"Nigina opa murabbo uchun har 1 kg qulupnayga 1,25 kg shakar soladi. 9 kg qulupnay uchun necha kg shakar kerak?","options":["11,25 kg","10,25 kg","7,2 kg","12,5 kg"],"correct":0,"solution":"9 · 1,25 = 11,25 kg shakar.","topic":"m15"},
{"id":"7-58","q":"2 ta sonning yig'indisi 220. Ularning nisbati 10:1 bo'lsa, shu sonlarning musbat ayirmasini toping.","options":["160","170","180","190"],"correct":2,"solution":"Qismlar: 10+1 = 11. 1 qism = 220/11 = 20.\nSonlar: 200 va 20.\nAyirma: 200 − 20 = 180.","topic":"m7"},
{"id":"1-52","q":"a, b natural sonlar uchun a + b/2 = 100 tenglik o'rinli bo'lsa, a + b ning eng katta qiymatini toping.","options":["200","250","300","199"],"correct":3,"solution":"a + b/2 = 100 → 2a + b = 200.\na+b ni maksimal qilish uchun b katta, a kichik bo'lsin.\na=1 → b=198. a+b = 199.\nEng katta qiymat: 199.","topic":"m1"},
{"id":"15-56","q":"Aka ukasidan 10 yosh katta va yoshlari nisbati 3:1. Necha yildan so'ng yoshlari nisbati 2:1 bo'ladi?","options":["4","5","10","8"],"correct":1,"solution":"Hozir: uka = x, aka = 3x. Aka−uka = 2x = 10 → x=5.\nUka=5, aka=15.\nn yildan keyin: (15+n)/(5+n) = 2/1.\n15+n = 10+2n → n = 5 yil.","topic":"m15"},
{"id":"7-41","q":"Mahsulot narxi 55000 so'm edi. 44000 so'mga tushirilsa, necha foiz chegirma bo'lgan?","options":["11%","20%","25%","40%"],"correct":1,"solution":"Chegirma = 55000 − 44000 = 11000 so'm.\nFoiz = 11000/55000 × 100% = 20%.","topic":"m7"},
{"id":"12-48","q":"Ko'paytuvchilarga ajrating: 6ab²c − 18abc","options":["6ab(c−3)","6abc(b−2)","6abc(b−3)","abc(b−18)"],"correct":2,"solution":"Umumiy ko'paytuvchi: 6abc.\n6ab²c − 18abc = 6abc(b − 3).\nTekshirish: 6abc·b = 6ab²c ✓; 6abc·3 = 18abc ✓","topic":"m12"},
{"id":"18-14","q":"Sport zalda 8 ta O'zbekistonlik, 10 ta Qozog'istonlik sportchi bor. 1 ta o'zbek va 1 ta qozoq sportchini necha xil usulda tanlash mumkin?","options":["40","80","36","72"],"correct":1,"solution":"Ko'paytirish qoidasi: 8 × 10 = 80 xil usul.","topic":"m18"},
{"id":"12-13","q":"Soddalashtiring: (2a²−6a³)·2a","options":["4a³−12a⁴","4a²+12a⁴","4a⁴−12a³","12a⁴−4a³"],"correct":0,"solution":"(2a²−6a³)·2a = 2a²·2a − 6a³·2a = 4a³ − 12a⁴.","topic":"m12"},
{"id":"12-6","q":"Soddalashtiring: (2a²+6a):2a","options":["a+2","3−a","a+3","a+4"],"correct":2,"solution":"(2a²+6a):2a = 2a²/2a + 6a/2a = a + 3.","topic":"m12"},
{"id":"6-46","q":"3 − √7 soniga qarama-qarshi sonni toping.","options":["−√7+3","−3+√7","7−√3","−7+√3"],"correct":1,"solution":"Qarama-qarshi son: −(3−√7) = −3+√7.\nTekshirish: (3−√7) + (−3+√7) = 0 ✓","topic":"m6"},
{"id":"13-33","q":"2(x−3)+7 = 2x tenglamani yeching.","options":["2","yechimi yo'q (∅)","4","5"],"correct":1,"solution":"2x−6+7 = 2x → 2x+1 = 2x → 1 = 0.\nBu yolg'on tenglik. Yechim yo'q (∅).","topic":"m13"},
{"id":"9-48","q":"Hajmi 8 m³ ga teng kubning sirtini bo'yash uchun 1 m² ga 250 ml bo'yoq ketadi. Kubning to'la sirtini bo'yash uchun necha litr kerak?","options":["6000","600","60","6"],"correct":3,"solution":"V = a³ = 8 → a = 2 m.\nTo'la sirt = 6a² = 6×4 = 24 m².\nBo'yoq: 24 × 250 ml = 6000 ml = 6 litr.","topic":"m9"},
{"id":"15-39","q":"Agar a+b=320 va a/b=39 bo'lsa, a−b ning qiymatini toping.","options":["299","302","304","307"],"correct":2,"solution":"a/b = 39 → a = 39b.\n39b + b = 320 → 40b = 320 → b = 8.\na = 312. a−b = 312 − 8 = 304.","topic":"m15"},
{"id":"12-44","q":"Soddalashtiring: (x+2)·(x²−2x+4) − 4","options":["x³+4","x³−4","x³+8","x³−8"],"correct":0,"solution":"(x+2)(x²−2x+4) = x³ + 8 (kublar yig'indisi formulasi: (a+b)(a²−ab+b²) = a³+b³).\nx³ + 8 − 4 = x³ + 4.","topic":"m12"},
{"id":"12-51","q":"Soddalashtiring: a(b−c) − b(c−a) − c(a−b)","options":["2ab+2ac","2b−2ac","4ab−2ac","2ab−2ac"],"correct":3,"solution":"a(b−c) = ab−ac.\n−b(c−a) = −bc+ab.\n−c(a−b) = −ac+bc.\nYig'indi: ab−ac−bc+ab−ac+bc = 2ab−2ac.","topic":"m12"},
{"id":"2-25","q":"25 gacha bo'lgan tub sonlar yig'indisini toping.","options":["114","100","144","99"],"correct":1,"solution":"Tub sonlar: 2,3,5,7,11,13,17,19,23.\nYig'indi: 2+3+5+7+11+13+17+19+23 = 100.","topic":"m2"},
{"id":"18-45","q":"Aylanada A, B, C, D nuqtalar bor. Bu nuqtalardan foydalanib nechta vatar o'tkazish mumkin?","options":["7 ta","4 ta","6 ta","12 ta"],"correct":2,"solution":"Vatar = 2 nuqtani birlashtirish.\nC(4,2) = 4!/(2!·2!) = 6 ta vatar.\n(AB, AC, AD, BC, BD, CD)","topic":"m18"},
{"id":"12-52","q":"Agar x=8,25 va y=−2,25 bo'lsa, x²−y² ning qiymatini hisoblang.","options":["64","63","60","54"],"correct":1,"solution":"x²−y² = (x−y)(x+y).\nx−y = 8,25−(−2,25) = 10,5.\nx+y = 8,25+(−2,25) = 6.\nNatija = 10,5 × 6 = 63.","topic":"m12"},
{"id":"12-5","q":"Agar xy=2 va x+y=3 bo'lsa, x²y + y²x ning qiymatini hisoblang.","options":["1","2","4","6"],"correct":3,"solution":"x²y + y²x = xy(x+y) = 2 × 3 = 6.","topic":"m12"},
{"id":"17-7","q":"Koordinatasi A(−5; 0) va B(5; 0) bo'lgan nuqtalar orasidagi masofani toping.","options":["11","9","12","10"],"correct":3,"solution":"Masofa = |5 − (−5)| = |10| = 10 birlik.","topic":"m17"},
{"id":"7-26","q":"Fabrikadagi jami matoning 12% i ko'ylak tikishga ishlatildi va bu 300 metrni tashkil etdi. Fabrikada jami qancha mato bo'lgan?","options":["2500 m","1600 m","2000 m","1800 m"],"correct":0,"solution":"x × 12/100 = 300 → x = 300 × 100/12 = 2500 metr.","topic":"m7"},
{"id":"4-44","q":"Hisoblang: 6,42 + 9/8 − 1,045","options":["6,4","6,5","6","1,25"],"correct":1,"solution":"9/8 = 1,125.\n6,42 + 1,125 − 1,045 = 7,545 − 1,045 = 6,5.","topic":"m4"},
{"id":"4-32","q":"Hisoblang: (−2,4):(−0,8) + 7","options":["10","40","4","16"],"correct":0,"solution":"(−2,4)/(−0,8) = 3.\n3 + 7 = 10.","topic":"m4"},
{"id":"13-16","q":"Tenglamani yeching: 2019 − 2x = 2021","options":["1","4","11","−1"],"correct":3,"solution":"−2x = 2021 − 2019 = 2.\nx = −1.","topic":"m13"},
{"id":"17-51","q":"A, B, C, D nuqtalar bir to'g'ri chiziqda. AC=25 sm, BD=27 sm, AD=45 sm. BC kesma uzunligini toping.<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 135' width='320' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='18' y1='70' x2='312' y2='70' stroke='#1f3447' stroke-width='2' stroke-linecap='round'/><circle cx='30' cy='70' r='5' fill='#0e7cc4'/><text x='30' y='87' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>A</text><circle cx='138' cy='70' r='5' fill='#0e7cc4'/><text x='138' y='87' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>B</text><circle cx='180' cy='70' r='5' fill='#0e7cc4'/><text x='180' y='87' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>C</text><circle cx='300' cy='70' r='5' fill='#0e7cc4'/><text x='300' y='87' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#46637a'>D</text><line x1='30' y1='24' x2='300' y2='24' stroke='#1f9d63' stroke-width='1.8' stroke-linecap='round'/><line x1='30' y1='19' x2='30' y2='29' stroke='#1f9d63' stroke-width='1.8' stroke-linecap='round'/><line x1='300' y1='19' x2='300' y2='29' stroke='#1f9d63' stroke-width='1.8' stroke-linecap='round'/><rect x='131' y='14' width='68' height='20' rx='4' fill='#fbfdff'/><text x='165' y='24' text-anchor='middle' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#1f9d63'>AD = 45</text><line x1='30' y1='46' x2='180' y2='46' stroke='#0e7cc4' stroke-width='1.8' stroke-linecap='round'/><line x1='30' y1='41' x2='30' y2='51' stroke='#0e7cc4' stroke-width='1.8' stroke-linecap='round'/><line x1='180' y1='41' x2='180' y2='51' stroke='#0e7cc4' stroke-width='1.8' stroke-linecap='round'/><rect x='71' y='36' width='68' height='20' rx='4' fill='#fbfdff'/><text x='105' y='46' text-anchor='middle' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#0e7cc4'>AC = 25</text><line x1='138' y1='112' x2='300' y2='112' stroke='#d65745' stroke-width='1.8' stroke-linecap='round'/><line x1='138' y1='107' x2='138' y2='117' stroke='#d65745' stroke-width='1.8' stroke-linecap='round'/><line x1='300' y1='107' x2='300' y2='117' stroke='#d65745' stroke-width='1.8' stroke-linecap='round'/><rect x='185' y='102' width='68' height='20' rx='4' fill='#fbfdff'/><text x='219' y='112' text-anchor='middle' dominant-baseline='central' font-size='12.5' font-weight='700' fill='#d65745'>BD = 27</text></svg>","options":["11","8","10","7"],"correct":3,"solution":"AC + BD = (AB+BC) + (BC+CD) = AB + 2·BC + CD.\nAD = AB+BC+CD = 45.\nAC+BD = 25+27 = 52 = AD + BC.\n52 = 45 + BC → BC = 7 sm.","topic":"m17"},
{"id":"9-37","q":"Kubning to'la sirti 468 m² ga teng. Kubning bitta yog'i yuzini toping.","options":["72 m²","74 m²","76 m²","78 m²"],"correct":3,"solution":"To'la sirt = 6a² = 468 → a² = 78.\nBitta yoq yuzi = a² = 78 m².","topic":"m9"},
{"id":"8-53","q":"Uchburchakning bitta tomoni 20, qolgan ikki tomoni 8:7 nisbatda. Perimetri 50 bo'lsa, kichik tomonini toping.","options":["14","15","16","17"],"correct":0,"solution":"Qolgan ikki tomon yig'indisi: 50 − 20 = 30.\n8 + 7 = 15 qism → 1 qism = 2.\nTomonlar 16 va 14 (uchburchak tengsizligi bajariladi: 16 + 14 > 20).\nKichik tomon: 14.","topic":"m8"},
{"id":"15-2","q":"Agar a=5, b=3 bo'lsa, (a+b)/(a−b) ning qiymatini toping.","options":["2","4","6","8"],"correct":1,"solution":"(5+3)/(5−3) = 8/2 = 4.","topic":"m15"},
{"id":"8-6","q":"Doira radiusi 6 ga teng. Doiraning yuzini toping.","options":["18π","36π","72π","12π"],"correct":1,"solution":"S = πr² = π × 6² = 36π.","topic":"m8"},
{"id":"3-48","q":"Hisoblang: (5/6):(15/24) + (1/2):(1/4)","options":["8/3","10/3","7/2","11/3"],"correct":1,"solution":"(5/6):(15/24) = (5/6)×(24/15) = 120/90 = 4/3.\n(1/2):(1/4) = (1/2)×4 = 2.\n4/3 + 2 = 4/3 + 6/3 = 10/3.","topic":"m3"},
{"id":"9-27","q":"Kubning asosining yuzi 64 ga teng. Kubning to'la sirti yuzini toping.","options":["100","400","384","272"],"correct":2,"solution":"Asos yuzi = a² = 64.\nTo'la sirt = 6a² = 6×64 = 384.","topic":"m9"},
{"id":"10-37","q":"72 km/soat tezlik necha m/s ga teng?","options":["20 m/s","72 m/s","7,2 m/s","200 m/s"],"correct":0,"solution":"1 km/soat = 1000 m : 3600 s = 1/3,6 m/s.\n72 : 3,6 = 20 m/s.","topic":"m10"},
{"id":"15-16","q":"Poyezdga 18 kishi chiqdi, so'ng 6 kishi tushib qoldi va so'ng poyezdda 31 ta odam qoldi. Dastlab poyezdda nechta odam bo'lgan?","options":["38","19","17","15"],"correct":1,"solution":"x + 18 − 6 = 31.\nx + 12 = 31 → x = 19 kishi.","topic":"m15"},
{"id":"13-48","q":"Tenglama nechta ildizga ega? 10 − 2x = 2(4−x) + 2","options":["yechimga ega emas","cheksiz ko'p","1 ta","2 ta"],"correct":1,"solution":"10 − 2x = 8 − 2x + 2 = 10 − 2x.\n10−2x = 10−2x — har doim to'g'ri.\nCheksiz ko'p yechim.","topic":"m13"},
{"id":"15-18","q":"Agar ikki sonning yig'indisi 600, biri ikkinchisidan 2 marta katta bo'lsa, kattasini toping.","options":["200","300","400","450"],"correct":2,"solution":"x + 2x = 600 → 3x = 600 → x = 200.\nKattasi: 2x = 400.","topic":"m15"},
{"id":"18-56","q":"Raqamlari ko'paytmasi 12 ga teng bo'lgan nechta ikki xonali son bor?","options":["3 ta","4 ta","5 ta","6 ta"],"correct":1,"solution":"Raqamlar ko'paytmasi 12 bo'lgan juftliklar: 2×6 va 3×4.\nIkki xonali sonlar: 26, 62, 34, 43.\nJami: 4 ta.\n(1×12 bo'lmaydi — 12 bir xonali emas.)","topic":"m18"},
{"id":"1-46","q":"1 dan 97 gacha bo'lgan natural sonlar ichida 6 raqami necha marta ishtirok etadi?","options":["20","19","18","17"],"correct":0,"solution":"Birlar xonasida 6: 6,16,26,36,46,56,66,76,86,96 → 10 ta.\nO'nlar xonasida 6: 60,61,...,69 → 10 ta.\nJami: 10 + 10 = 20 marta.","topic":"m1"},
{"id":"8-3","q":"Aylana radiusi 3 sm bo'lsa, uning uzunligini (sm) toping.","options":["9π","5π","6π","3π"],"correct":2,"solution":"C = 2πr = 2π×3 = 6π.","topic":"m8"},
{"id":"15-41","q":"Fermada 250 kg meva bor. Birinchi do'konga ikkinchisiga qaraganda 4 marta ko'p yuborildi. Birinchi do'konga qancha meva yuborilgan?","options":["50","150","200","240"],"correct":2,"solution":"Ikkinchi = x, birinchi = 4x.\nx + 4x = 250 → 5x = 250 → x = 50.\nBirinchi = 4×50 = 200 kg.","topic":"m15"},
{"id":"1-42","q":"225 dan qanday eng katta natural sonni ayirsak 144 dan katta bo'ladi?","options":["80","81","79","78"],"correct":0,"solution":"225 − x > 144 → x < 81.\nEng katta natural son: x = 80.\nTekshirish: 225 − 80 = 145 > 144 ✓","topic":"m1"},
{"id":"18-15","q":"10 nafar do'st o'zaro qo'l berib ko'rishishdi. Qo'l berishlar soni nechta?","options":["20","90","45","100"],"correct":2,"solution":"Har juft 1 marta: C(10,2) = (10×9)/2 = 45 ta.","topic":"m18"},
{"id":"7-23","q":"Firma ishlab chiqargan 1200 dona mahsulotning 92% i a'lo navli. A'lo navli mahsulotlar sonini toping.","options":["1114","1104","1000","1004"],"correct":1,"solution":"1200 × 92/100 = 1200 × 0,92 = 1104 dona.","topic":"m7"},
{"id":"18-9","q":"3 ta turli xatni 3 ta turli konvertga necha xil usulda joylash mumkin?","options":["5 xil","1 xil","9 xil","6 xil"],"correct":3,"solution":"P₃ = 3! = 3×2×1 = 6 xil usul.","topic":"m18"},
{"id":"13-21","q":"Tenglamani yeching: 10·(x−10) = 6x","options":["20","15","35","25"],"correct":3,"solution":"10x − 100 = 6x.\n4x = 100 → x = 25.","topic":"m13"},
{"id":"2-38","q":"18 ning butun bo'luvchilari soni nechta?","options":["6 ta","9 ta","12 ta","24 ta"],"correct":2,"solution":"Musbat bo'luvchilar: 1,2,3,6,9,18 — 6 ta.\nBUTUN bo'luvchilar manfiylarni ham qo'shadi: ±1,±2,±3,±6,±9,±18 — 12 ta.","topic":"m2"},
{"id":"7-42","q":"Bug'doy tegirmonda yanchilganda un va kepak ajraladi. 19% kepak chiqsa, 24,3 t un olish uchun necha tonna bug'doy kerak?","options":["32","30","45","25"],"correct":1,"solution":"Un ulushi: 100% − 19% = 81%.\nx × 0,81 = 24,3 → x = 24,3/0,81 = 30 tonna.","topic":"m7"},
{"id":"12-45","q":"Agar a=8,5 va b=2,5 bo'lsa, a³−b³−3ab(a−b) ning qiymatini toping.","options":["125","343","216","100"],"correct":2,"solution":"a³ − b³ − 3ab(a − b) = a³ − 3a²b + 3ab² − b³ = (a − b)³ (ayirma kubi formulasi).\n(8,5 − 2,5)³ = 6³ = 216.","topic":"m12"},
{"id":"15-19","q":"4 soatning 1/5 qismiga mos keluvchi javobni toping.","options":["80 minut","40 minut","0,8 soat","0,4 soat"],"correct":2,"solution":"4 soatning 1/5 = 4/5 = 0,8 soat.\n(0,8 soat = 48 minut.)","topic":"m15"},
{"id":"10-28","q":"2,4 soatning 1/6 qismi necha daqiqa bo'ladi?","options":["240","12","24","25"],"correct":2,"solution":"2,4 soat = 144 minut.\n144 × 1/6 = 24 daqiqa.","topic":"m10"},
{"id":"10-52","q":"7,2 tonna yukning nimchorak (chorakning yarmi, ya'ni 1/8) qismi sifatsiz deb topildi. Qancha yuk sifatsiz?","options":["9 tonna","0,9 kg","90 kg","900 kg"],"correct":3,"solution":"7,2 tonna = 7200 kg.\nNimchorak = chorakning yarmi = 1/8.\n7200 × 1/8 = 900 kg.","topic":"m10"},
{"id":"18-32","q":"3 ta to'g'ri chiziq ko'pi bilan nechta nuqtada kesishadi?","options":["1 ta","2 ta","3 ta","4 ta"],"correct":2,"solution":"Har juft chiziq 1 nuqtada kesishadi.\nC(3,2) = 3 ta kesishish nuqtasi.","topic":"m18"},
{"id":"10-29","q":"3200 kg ni tonnada ifodalang.","options":["3,3 t","3,5 t","3,6 t","3,2 t"],"correct":3,"solution":"1 tonna = 1000 kg.\n3200 kg = 3200/1000 = 3,2 tonna.","topic":"m10"},
{"id":"18-46","q":"Barcha raqamlari juft bo'lgan ikki xonali sonlar nechta?","options":["20","25","30","28"],"correct":0,"solution":"O'nlar (juft, 0 emas): 2,4,6,8 — 4 ta.\nBirlar (juft): 0,2,4,6,8 — 5 ta.\nJami: 4 × 5 = 20 ta.","topic":"m18"},
{"id":"7-22","q":"Xaritaning masshtabi 1:2000. Xaritada ikki nuqta orasidagi masofa 3 sm bo'lsa, haqiqiy masofa qancha?","options":["80 metr","30 metr","60 metr","62 metr"],"correct":2,"solution":"Haqiqiy = 3 × 2000 = 6000 sm = 60 metr.","topic":"m7"},
{"id":"15-38","q":"Sanjar bilan otasining yoshlari yig'indisi 45. Sanjar bilan onasining yig'indisi 44. Ota va onasining yig'indisi 67 bo'lsa, Sanjarning yoshi nechada?","options":["12","11","13","14"],"correct":1,"solution":"S+O=45, S+M=44, O+M=67.\n(S+O)+(S+M) = 2S+O+M = 89.\n2S + 67 = 89 → 2S = 22 → S = 11.","topic":"m15"},
{"id":"5-37","q":"Hisoblang: |−10| + |−20| − |−10|·3","options":["0","60","30","45"],"correct":0,"solution":"|−10|=10, |−20|=20, |−10|=10.\n10 + 20 − 10×3 = 30 − 30 = 0.","topic":"m5"},
{"id":"10-13","q":"Soat 7:45 bo'lgan vaqtdan necha daqiqa o'tgach soat 9:15 bo'ladi?","options":["80","89","90","85"],"correct":2,"solution":"7:45 dan 9:15 gacha: 1 soat 30 daqiqa = 90 daqiqa.","topic":"m10"},
{"id":"15-44","q":"O'rdak g'ozdan 3 kg yengil, tovuqdan esa 1 kg og'ir. G'oz tovuqdan qanchaga og'ir?","options":["2","3","4","5"],"correct":2,"solution":"O'rdak = tovuq + 1.\nG'oz = o'rdak + 3 = tovuq + 1 + 3 = tovuq + 4.\nG'oz tovuqdan 4 kg og'ir.","topic":"m15"},
{"id":"8-23","q":"Rombning tomoni 8 ga teng. Rombning perimetrini toping.","options":["24","32","36","40"],"correct":1,"solution":"Romb 4 ta teng tomonli.\nPerimetr = 4 × 8 = 32.","topic":"m8"},
{"id":"7-16","q":"Sutdan 12% qaymoq olinadi. 15 kg sutdan qancha qaymoq olinadi?","options":["1,8 kg","1,8 g","18 kg","180 kg"],"correct":0,"solution":"15 × 12/100 = 15 × 0,12 = 1,8 kg.","topic":"m7"},
{"id":"8-34","q":"Tomonlari 7, 8 va 9 ga teng bo'lgan uchburchak yuzini toping.","options":["24√5","12√5","6√5","48√5"],"correct":1,"solution":"Geron formulasi: p = (7+8+9)/2 = 12.\nS = √(p(p−a)(p−b)(p−c)) = √(12·5·4·3) = √720 = 12√5.","topic":"m8"},
{"id":"5-53","q":"Hisoblang: −((−120−80) − (120+(−20)))","options":["500","300","250","−300"],"correct":1,"solution":"(−120−80) = −200.\n(120+(−20)) = 100.\n−200 − 100 = −300.\n−(−300) = 300.","topic":"m5"},
{"id":"2-20","q":"48 sonining natural bo'luvchilari nechta?","options":["10","8","12","16"],"correct":0,"solution":"48 = 2⁴×3.\nBo'luvchilar soni = (4+1)(1+1) = 5×2 = 10 ta.","topic":"m2"},
