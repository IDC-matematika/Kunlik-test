{"id":"13-54","q":"(2x−1)/5 = (x+2)/3 tenglamani yeching.","options":["13","11","15","9"],"correct":0,"solution":"Ayqashlab ko'paytiramiz: 3(2x−1) = 5(x+2).\n6x−3 = 5x+10.\n6x−5x = 10+3.\nx = 13.","topic":"m13","q_ru":"Решите уравнение (2x−1)/5 = (x+2)/3.","options_ru":["13","11","15","9"],"solution_ru":"Перемножим крест-накрест: 3(2x−1) = 5(x+2).\n6x−3 = 5x+10.\n6x−5x = 10+3.\nx = 13."},
{"id":"14-48","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 20</span><span>2x − y = 10</span></span></span>","options":["x=10, y=10","x=8, y=12","x=12, y=8","x=15, y=5"],"correct":0,"solution":"Ikkinchi tenglamadan: 2x−y=10 → y=2x−10.\nBirinchi tenglamaga qo'yamiz: x+(2x−10)=20 → 3x=30 → x=10.\ny=2·10−10=10.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 20</span><span>2x − y = 10</span></span></span>","options_ru":["x=10, y=10","x=8, y=12","x=12, y=8","x=15, y=5"],"solution_ru":"Из второго уравнения: 2x−y=10 → y=2x−10.\nПодставим в первое: x+(2x−10)=20 → 3x=30 → x=10.\ny=2·10−10=10."},
{"id":"14-46","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x − 3y = 1</span><span>2x + y = 9</span></span></span>","options":["x=4, y=1","x=1, y=4","x=5, y=1","x=4, y=2"],"correct":0,"solution":"Ikkinchi tenglamadan: y=9−2x.\nBirinchiga qo'yamiz: x−3(9−2x)=1 → x−27+6x=1 → 7x=28 → x=4.\ny=9−2·4=1.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x − 3y = 1</span><span>2x + y = 9</span></span></span>","options_ru":["x=4, y=1","x=1, y=4","x=5, y=1","x=4, y=2"],"solution_ru":"Из второго уравнения: y=9−2x.\nПодставим в первое: x−3(9−2x)=1 → x−27+6x=1 → 7x=28 → x=4.\ny=9−2·4=1."},
{"id":"14-10","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>4x + y = 18</span><span>x + y = 6</span></span></span>","options":["x=4, y=2","x=2, y=4","x=3, y=3","x=5, y=1"],"correct":0,"solution":"Birinchidan ikkinchini ayiramiz: (4x+y)−(x+y)=18−6 → 3x=12 → x=4.\ny=6−4=2.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>4x + y = 18</span><span>x + y = 6</span></span></span>","options_ru":["x=4, y=2","x=2, y=4","x=3, y=3","x=5, y=1"],"solution_ru":"Вычтем из первого второе: (4x+y)−(x+y)=18−6 → 3x=12 → x=4.\ny=6−4=2."},
{"id":"14-11","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x − 3y = 12</span><span>x + 3y = 15</span></span></span>","options":["x=9, y=2","x=6, y=3","x=9, y=3","x=12, y=1"],"correct":0,"solution":"Tenglamalarni qo'shamiz: (2x−3y)+(x+3y)=12+15 → 3x=27 → x=9.\ny=(15−9):3=2.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x − 3y = 12</span><span>x + 3y = 15</span></span></span>","options_ru":["x=9, y=2","x=6, y=3","x=9, y=3","x=12, y=1"],"solution_ru":"Сложим уравнения: (2x−3y)+(x+3y)=12+15 → 3x=27 → x=9.\ny=(15−9):3=2."},
{"id":"14-49","q":"Ikkita sonning yig'indisi 38. Ulardan birining ikkilanganidan 1 kam soni ikkinchi songa teng. Kichik sonni toping.","options":["13","25","19","12"],"correct":0,"solution":"x+y=38, 2x−1=y.\nx+(2x−1)=38 → 3x=39 → x=13.\ny=2·13−1=25.\nKichik son = 13.","topic":"m14","q_ru":"Сумма двух чисел равна 38. Число, на 1 меньшее удвоенного первого, равно второму. Найдите меньшее число.","options_ru":["13","25","19","12"],"solution_ru":"x+y=38, 2x−1=y.\nx+(2x−1)=38 → 3x=39 → x=13.\ny=2·13−1=25.\nМеньшее число = 13."},
{"id":"14-13","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>5x − 2y = 12</span><span>3x + 2y = 20</span></span></span>","options":["x=4, y=4","x=2, y=7","x=4, y=2","x=6, y=1"],"correct":0,"solution":"Tenglamalarni qo'shamiz: (5x−2y)+(3x+2y)=12+20 → 8x=32 → x=4.\ny=(20−3·4):2=4.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>5x − 2y = 12</span><span>3x + 2y = 20</span></span></span>","options_ru":["x=4, y=4","x=2, y=7","x=4, y=2","x=6, y=1"],"solution_ru":"Сложим уравнения: (5x−2y)+(3x+2y)=12+20 → 8x=32 → x=4.\ny=(20−3·4):2=4."},
{"id":"14-1","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 3x − 2</span><span>x + y = 10</span></span></span>","options":["x=3, y=7","x=4, y=6","x=2, y=8","x=3, y=4"],"correct":0,"solution":"x+(3x−2)=10 → 4x=12 → x=3.\ny=3·3−2=7.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>y = 3x − 2</span><span>x + y = 10</span></span></span>","options_ru":["x=3, y=7","x=4, y=6","x=2, y=8","x=3, y=4"],"solution_ru":"x+(3x−2)=10 → 4x=12 → x=3.\ny=3·3−2=7."},
{"id":"14-33","q":"Bir to'garakka kattalar uchun 30000 so'm, bolalar uchun 15000 so'm narxda jami 8 ta bilet sotilib, 195000 so'm tushgan. Nechta kattalar bileti sotilgan?","options":["5","4","6","3"],"correct":0,"solution":"a+b=8, 30000a+15000b=195000.\nb=8−a ni ikkinchiga qo'yamiz: 30000a+15000(8−a)=195000 → 15000a+120000=195000 → 15000a=75000 → a=5.","topic":"m14","q_ru":"В кружок продано 8 билетов на сумму 195000 сум: взрослые по 30000 сум, детские по 15000 сум. Сколько взрослых билетов продано?","options_ru":["5","4","6","3"],"solution_ru":"a+b=8, 30000a+15000b=195000.\nПодставим b=8−a во второе: 30000a+15000(8−a)=195000 → 15000a+120000=195000 → 15000a=75000 → a=5."},
{"id":"14-34","q":"Kassada 5 000 va 10 000 so'mlik kupyuralar bor: jami 12 ta, umumiy summa 85 000 so'm. 10 000 so'mlik kupyuralar nechta?","options":["5","7","6","4"],"correct":0,"solution":"x — 5 000 lik, y — 10 000 lik: x + y = 12, 5x + 10y = 85 (ming so'mda).\nBirinchisini 5 ga ko'paytirib ayiramiz: 5y = 25 → y = 5.","topic":"m14","q_ru":"В кассе купюры по 5 000 и 10 000 сумов: всего 12 штук на сумму 85 000 сумов. Сколько купюр по 10 000 сумов?","options_ru":["5","7","6","4"],"solution_ru":"x — по 5 000, y — по 10 000: x + y = 12, 5x + 10y = 85 (в тысячах).\nУмножим первое на 5 и вычтем: 5y = 25 → y = 5."},
{"id":"14-43","q":"Tenglamalar sistemasini yeching:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + y = 10</span><span>x − 2y = −13</span></span></span>","options":["x=1, y=7","x=3, y=1","x=−1, y=13","x=2, y=4"],"correct":0,"solution":"Birinchidan y=10−3x.\nIkkinchiga qo'yamiz: x−2(10−3x)=−13 → x−20+6x=−13 → 7x=7 → x=1.\ny=10−3·1=7.","topic":"m14","q_ru":"Решите систему уравнений:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + y = 10</span><span>x − 2y = −13</span></span></span>","options_ru":["x=1, y=7","x=3, y=1","x=−1, y=13","x=2, y=4"],"solution_ru":"Из первого: y=10−3x.\nПодставим во второе: x−2(10−3x)=−13 → x−20+6x=−13 → 7x=7 → x=1.\ny=10−3·1=7."},
{"id":"15-51","q":"Bitta baqlajon va ikkita pomidorning narxi jamisi 18000 so'm, ikkita baqlajon va bitta pomidorning narxi jamisi 21000 so'm. Bitta pomidorning narxini toping.","options":["5000 so'm","6000 so'm","4000 so'm","7000 so'm"],"correct":0,"solution":"b+2p=18000, 2b+p=21000.\nBirinchidan b=18000−2p.\nIkkinchiga qo'yamiz: 2(18000−2p)+p=21000 → 36000−4p+p=21000 → −3p=−15000 → p=5000.","topic":"m15","q_ru":"Цена одного баклажана и двух помидоров вместе равна 18000 сум, а двух баклажанов и одного помидора — 21000 сум. Найдите цену одного помидора.","options_ru":["5000 сум","6000 сум","4000 сум","7000 сум"],"solution_ru":"b+2p=18000, 2b+p=21000.\nИз первого: b=18000−2p.\nПодставим во второе: 2(18000−2p)+p=21000 → 36000−4p+p=21000 → −3p=−15000 → p=5000."},
{"id":"15-37","q":"Avtobus 2,5 soat davomida 80 km/soat tezlikda, so'ng 1,5 soat davomida 60 km/soat tezlikda yurdi. Avtobus jami necha km yo'l bosib o'tdi?","options":["290 km","280 km","300 km","270 km"],"correct":0,"solution":"Birinchi qism: 80·2,5=200 km.\nIkkinchi qism: 60·1,5=90 km.\nJami: 200+90=290 km.","topic":"m15","q_ru":"Автобус ехал 2,5 часа со скоростью 80 км/ч, затем 1,5 часа со скоростью 60 км/ч. Сколько всего км проехал автобус?","options_ru":["290 км","280 км","300 км","270 км"],"solution_ru":"Первая часть: 80·2,5=200 км.\nВторая часть: 60·1,5=90 км.\nВсего: 200+90=290 км."},
{"id":"15-3","q":"Qaymoqning 20% i sariyog'ga aylanadi. 15 kg qaymoqdan necha kg sariyog' olinadi?","options":["3 kg","2 kg","4 kg","3,5 kg"],"correct":0,"solution":"15 · 0,2 = 3 kg sariyog'.","topic":"m15","q_ru":"20% сливок превращается в сливочное масло. Сколько килограммов масла получится из 15 кг сливок?","options_ru":["3 кг","2 кг","4 кг","3,5 кг"],"solution_ru":"15 · 0,2 = 3 кг масла."},
{"id":"15-1","q":"Ikki ishchi birgalikda 1 kunda 24 dona mahsulot tayyorlaydi. Birinchisi yolg'iz 1 kunda 14 dona tayyorlaydi. Ikkinchisi yolg'iz 1 kunda nechta tayyorlaydi?","options":["10","12","8","16"],"correct":0,"solution":"24−14=10 dona.","topic":"m15","q_ru":"Два рабочих вместе изготавливают 24 детали в день. Первый один изготавливает 14 деталей в день. Сколько деталей в день изготавливает второй один?","options_ru":["10","12","8","16"],"solution_ru":"24−14=10 деталей."},
{"id":"15-49","q":"Poyezd 540 km masofani 6 soatda bosib o'tdi. Agar tezligini 10 km/soatga oshirsa, shu masofani necha soatda bosib o'tadi?","options":["5,4 soat","5 soat","6,5 soat","4,5 soat"],"correct":0,"solution":"Boshlang'ich tezlik = 540:6 = 90 km/soat.\nYangi tezlik = 90+10 = 100 km/soat.\nYangi vaqt = 540:100 = 5,4 soat.","topic":"m15","q_ru":"Поезд преодолел расстояние 540 км за 6 часов. За сколько часов он преодолеет это же расстояние, если увеличит скорость на 10 км/ч?","options_ru":["5,4 часа","5 часов","6,5 часа","4,5 часа"],"solution_ru":"Начальная скорость = 540:6 = 90 км/ч.\nНовая скорость = 90+10 = 100 км/ч.\nНовое время = 540:100 = 5,4 часа."},
{"id":"15-4","q":"16 nafar xodimning oylik ish haqi yig'indisi 9 600 000 so'm. O'rtacha ish haqini toping.","options":["600000 so'm","580000 so'm","620000 so'm","550000 so'm"],"correct":0,"solution":"9600000:16 = 600000 so'm.","topic":"m15","q_ru":"Сумма месячных зарплат 16 сотрудников равна 9 600 000 сум. Найдите среднюю зарплату.","options_ru":["600000 сум","580000 сум","620000 сум","550000 сум"],"solution_ru":"9600000:16 = 600000 сум."},
{"id":"15-46","q":"Bir sondan uning 1/4 qismini ayirib, qolganini 2 ga ko'paytirsak, 90 hosil bo'ladi. Shu sonni toping.","options":["60","80","45","75"],"correct":0,"solution":"(x − x/4)·2 = 90.\n(3x/4)·2 = 90.\n(3x/2) = 90.\nx = 60.","topic":"m15","q_ru":"Если от некоторого числа вычесть его 1/4 часть и результат умножить на 2, получится 90. Найдите это число.","options_ru":["60","80","45","75"],"solution_ru":"(x − x/4)·2 = 90.\n(3x/4)·2 = 90.\n(3x/2) = 90.\nx = 60."},
{"id":"15-53","q":"Onaning yoshi bolasining yoshidan 3 marta katta. 6 yil oldin onaning yoshi bolasining yoshidan 5 marta katta edi. Bolaning hozirgi yoshini toping.","options":["12","10","15","9"],"correct":0,"solution":"Ona=3x, bola=x.\n6 yil oldin: 3x−6=5(x−6).\n3x−6=5x−30.\n24=2x.\nx=12.","topic":"m15","q_ru":"Мать старше ребёнка в 3 раза. 6 лет назад мать была старше ребёнка в 5 раз. Найдите текущий возраст ребёнка.","options_ru":["12","10","15","9"],"solution_ru":"Мать=3x, ребёнок=x.\n6 лет назад: 3x−6=5(x−6).\n3x−6=5x−30.\n24=2x.\nx=12."},
{"id":"15-35","q":"Ikki sonning nisbati 5:3, yig'indisi 96. Ularning ayirmasini toping.","options":["24","30","18","36"],"correct":0,"solution":"5+3=8 ulush. 1 ulush=96:8=12.\nSonlar: 60 va 36.\nAyirma=60−36=24.","topic":"m15","q_ru":"Отношение двух чисел равно 5:3, их сумма равна 96. Найдите их разность.","options_ru":["24","30","18","36"],"solution_ru":"5+3=8 частей. 1 часть=96:8=12.\nЧисла: 60 и 36.\nРазность=60−36=24."},
{"id":"15-20","q":"Sayyohlar guruhi 3 ta avtobusga teng bo'lib o'tirsa, har birida 42 kishi bo'ladi. Agar ular 6 ta avtobusga teng bo'lib o'tirsa, har birida nechta kishi bo'ladi?","options":["21","24","20","18"],"correct":0,"solution":"Jami sayyohlar: 3 · 42 = 126 kishi.\n126 : 6 = 21 kishi.","topic":"m15","q_ru":"Группа туристов, разместившись поровну в 3 автобусах, занимает по 42 человека в каждом. Если они разместятся поровну в 6 автобусах, сколько человек будет в каждом?","options_ru":["21","24","20","18"],"solution_ru":"Всего туристов: 3 · 42 = 126 человек.\n126 : 6 = 21 человек."},

linecap='round'/><text x='83' y='170' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Payshanba</text><text x='218' y='170' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>19°</text><line x1='9' y1='188' x2='277' y2='188' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='83' y='206' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Juma</text><text x='218' y='206' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>21°</text><line x1='158' y1='8' x2='158' y2='224' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/></svg>","options":["19°","18°","20°","18,5°"],"correct":0,"solution":"Yig'indi: 18+20+17+19+21=95.\nO'rtacha: 95:5=19°.","topic":"m16","q_ru":"В таблице указаны температуры за 5 дней: Пн=18°, Вт=20°, Ср=17°, Чт=19°, Пт=21°. Найдите среднюю температуру за эти 5 дней недели.","options_ru":["19°","18°","20°","18,5°"],"solution_ru":"Сумма: 18+20+17+19+21=95.\nСреднее: 95:5=19°."},

{"id":"16-30","q":"Diagrammada 4 xil mahsulotning sotuv soni berilgan. Jami sotuv qancha va A turi jamining necha foizini tashkil qiladi?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 306 205' width='306' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><line x1='34' y1='171' x2='294' y2='171' stroke='#9cb2c0' stroke-width='1.4' stroke-linecap='round'/><text x='26' y='171' text-anchor='end' dominant-baseline='central' font-size='11' font-weight='600' fill='#9cb2c0'>0</text><rect x='46.4' y='58.2' width='40.3' height='112.8' rx='4' fill='#0e7cc4'/><text x='66.5' y='48.2' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>120</text><text x='66.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>A</text><rect x='111.4' y='86.4' width='40.3' height='84.6' rx='4' fill='#2aaec8'/><text x='131.5' y='76.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>90</text><text x='131.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>B</text><rect x='176.4' y='30' width='40.3' height='141' rx='4' fill='#22a06b'/><text x='196.5' y='20' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>150</text><text x='196.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>V</text><rect x='241.4' y='39.4' width='40.3' height='131.6' rx='4' fill='#f4a23a'/><text x='261.5' y='29.4' text-anchor='middle' dominant-baseline='central' font-size='13' font-weight='700' fill='#1f3447'>140</text><text x='261.5' y='186' text-anchor='middle' dominant-baseline='central' font-size='12' font-weight='600' fill='#46637a'>G</text></svg>","options":["500 ta, 24%","500 ta, 20%","500 ta, 30%","510 ta, 24%"],"correct":0,"solution":"Jami: 120+90+150+140=500.\nA ulushi: 120:500·100%=24%.","topic":"m16","q_ru":"На столбчатой диаграмме показано количество продаж 4 видов продукции: A-120, B-90, V-150, G-140. Найдите общее количество продаж и долю вида A в процентах от общего.","options_ru":["500 шт., 24%","500 шт., 20%","500 шт., 30%","510 шт., 24%"],"solution_ru":"Всего: 120+90+150+140=500.\nДоля A: 120:500·100%=24%."},
{"id":"16-49","q":"Jadvalda 5 ta o'quvchining matematika va fizika baholari berilgan. Fizikadan o'rtacha baho matematikadan o'rtacha bahodan qanchaga farq qiladi?<br><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 316 208' width='316' style='display:block;max-width:100%;margin:10px auto 2px;background:#fbfdff;border-radius:10px;border:1px solid #e3ebf2'><rect x='8' y='8' width='300' height='192' rx='10' fill='#fff' stroke='#cfdbe5' stroke-width='1.5'/><path d='M 8 40 V 18 Q 8 8 18 8 H 298 Q 308 8 308 18 V 40 Z' fill='#0e7cc4'/><text x='58' y='24' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>O'quvchi</text><text x='163' y='24' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Matematika</text><text x='263' y='24' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#fff'>Fizika</text><line x1='9' y1='40' x2='307' y2='40' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='56' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Ali</text><text x='163' y='56' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>9</text><text x='263' y='56' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8</text><rect x='9' y='72' width='298' height='32' fill='#f0f6fb'/><line x1='9' y1='72' x2='307' y2='72' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='88' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Vali</text><text x='163' y='88' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8</text><text x='263' y='88' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>9</text><line x1='9' y1='104' x2='307' y2='104' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='120' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Guli</text><text x='163' y='120' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>9</text><text x='263' y='120' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>7</text><rect x='9' y='136' width='298' height='32' fill='#f0f6fb'/><line x1='9' y1='136' x2='307' y2='136' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='152' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Soli</text><text x='163' y='152' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8</text><text x='263' y='152' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>9</text><line x1='9' y1='168' x2='307' y2='168' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><text x='58' y='184' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='700' fill='#1f3447'>Nodir</text><text x='163' y='184' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8</text><text x='263' y='184' text-anchor='middle' dominant-baseline='central' font-size='13.5' font-weight='500' fill='#1f3447'>8</text><line x1='108' y1='8' x2='108' y2='200' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/><line x1='218' y1='8' x2='218' y2='200' stroke='#e1e9f0' stroke-width='1' stroke-linecap='round'/></svg>","options":["0,2","1","0,4","0"],"correct":0,"solution":"Matematika: 9 + 8 + 9 + 8 + 8 = 42 → 42 : 5 = 8,4.\nFizika: 8 + 9 + 7 + 9 + 8 = 41 → 41 : 5 = 8,2.\nFarq: 8,4 − 8,2 = 0,2.","topic":"m16","q_ru":"В таблице оценки 5 учеников по математике и физике. На сколько средняя оценка по физике отличается от средней по математике?","options_ru":["0,2","1","0,4","0"],"solution_ru":"Математика: 9 + 8 + 9 + 8 + 8 = 42 → 42 : 5 = 8,4.\nФизика: 8 + 9 + 7 + 9 + 8 = 41 → 41 : 5 = 8,2.\nРазница: 8,4 − 8,2 = 0,2."},
{"id":"17-18","q":"Ikki to'g'ri chiziq kesishganda hosil bo'lgan to'rtta burchakdan uchtasining yig'indisi 250°. To'rtinchi burchakni toping.","options":["110°","70°","250°","55°"],"correct":0,"solution":"To'rtta burchak yig'indisi 360°.\n360° − 250° = 110°.","topic":"m17","q_ru":"При пересечении двух прямых образовалось четыре угла; сумма трёх из них равна 250°. Найдите четвёртый угол.","options_ru":["110°","70°","250°","55°"],"solution_ru":"Сумма четырёх углов 360°.\n360° − 250° = 110°."},
{"id":"17-19","q":"Burchaklari 40° va 65° bo'lgan uchburchakning uchinchi burchagini toping.","options":["75°","70°","80°","65°"],"correct":0,"solution":"Uchburchak burchaklari yig'indisi 180°.\n180°−40°−65°=75°.","topic":"m17","q_ru":"Два угла треугольника равны 40° и 65°. Найдите третий угол.","options_ru":["75°","70°","80°","65°"],"solution_ru":"Сумма углов треугольника равна 180°.\n180°−40°−65°=75°."},
{"id":"17-3","q":"To'g'ri chiziqda yotgan ikki burchakdan biri ikkinchisidan 3 marta katta. Kichik burchakni toping.","options":["45°","50°","30°","60°"],"correct":0,"solution":"x+3x=180° → 4x=180° → x=45°.","topic":"m17","q_ru":"Из двух углов, лежащих на прямой, один в 3 раза больше другого. Найдите меньший угол.","options_ru":["45°","50°","30°","60°"],"solution_ru":"x+3x=180° → 4x=180° → x=45°."},
{"id":"17-17","q":"Ikki parallel yo'l orasidagi masofa 800 m. Bu masofani 1:20000 masshtabdagi xaritada necha sm bilan ifodalanadi?","options":["4 sm","8 sm","2 sm","5 sm"],"correct":0,"solution":"800 m=80000 sm.\n80000:20000=4 sm.","topic":"m17","q_ru":"Расстояние между двумя параллельными дорогами равно 800 м. Каким будет это расстояние на карте масштаба 1:20000 (в см)?","options_ru":["4 см","8 см","2 см","5 см"],"solution_ru":"800 м=80000 см.\n80000:20000=4 см."},
{"id":"17-5","q":"Burchakka qo'shni burchak shu burchakdan 2 marta kichik. Bu burchakni toping.","options":["120°","100°","110°","130°"],"correct":0,"solution":"x+x/2=180° → (3x/2)=180° → x=120°.","topic":"m17","q_ru":"Смежный с углом угол в 2 раза меньше этого угла. Найдите угол.","options_ru":["120°","100°","110°","130°"],"solution_ru":"x+x/2=180° → (3x/2)=180° → x=120°."},
{"id":"17-9","q":"To'g'ri burchakli uchburchakda o'tkir burchaklardan biri 28° bo'lsa, ikkinchisini toping.","options":["62°","72°","52°","58°"],"correct":0,"solution":"To'g'ri burchak=90°, ikkinchi o'tkir burchak=90°−28°=62°.","topic":"m17","q_ru":"В прямоугольном треугольнике один из острых углов равен 28°. Найдите второй острый угол.","options_ru":["62°","72°","52°","58°"],"solution_ru":"Прямой угол=90°, второй острый угол=90°−28°=62°."},
{"id":"17-6","q":"Ikki shahar orasidagi masofa xaritada 1:500000 masshtabda 6 sm. Haqiqiy masofani km da toping.","options":["30 km","25 km","35 km","20 km"],"correct":0,"solution":"6 sm·500000=3000000 sm=30000 m=30 km.","topic":"m17","q_ru":"Расстояние между двумя городами на карте масштаба 1:500000 равно 6 см. Найдите реальное расстояние в км.","options_ru":["30 км","25 км","35 км","20 км"],"solution_ru":"6 см·500000=3000000 см=30000 м=30 км."},
{"id":"17-40","q":"Vertikal burchaklar haqidagi fikrlardan qaysi biri to'g'ri? 1) Vertikal burchaklar teng. 2) Vertikal burchaklar yig'indisi 180°.","options":["Faqat 1","Faqat 2","Ikkalasi ham","Hech biri"],"correct":0,"solution":"Vertikal burchaklar har doim teng — 1 to'g'ri.\nYig'indisi 180° bo'lishi qo'shni burchaklarga xos, vertikal burchaklar uchun bu faqat 90° bo'lganda bajariladi — 2 noto'g'ri.","topic":"m17","q_ru":"Какое утверждение о вертикальных углах верно? 1) Вертикальные углы равны. 2) Сумма вертикальных углов равна 180°.","options_ru":["Только 1","Только 2","Оба","Ни одно"],"solution_ru":"Вертикальные углы всегда равны — 1 верно.\nСумма 180° — свойство смежных углов; для вертикальных это выполняется лишь при 90° — 2 неверно."},
{"id":"17-37","q":"Uchburchakning ikkinchi burchagi birinchisidan 20° katta, uchinchisi esa birinchisidan 2 marta katta. Eng kichik burchakni toping.","options":["40°","60°","80°","45°"],"correct":0,"solution":"Burchaklar: x, x + 20°, 2x.\nx + x + 20° + 2x = 180° → 4x = 160° → x = 40°.\nBurchaklar: 40°, 60°, 80°.","topic":"m17","q_ru":"Второй угол треугольника на 20° больше первого, а третий в 2 раза больше первого. Найдите наименьший угол.","options_ru":["40°","60°","80°","45°"],"solution_ru":"Углы: x, x + 20°, 2x.\nx + x + 20° + 2x = 180° → 4x = 160° → x = 40°.\nУглы: 40°, 60°, 80°."},
{"id":"17-4","q":"To'g'ri yo'lda turgan ikkita kuzatuvchi orasidagi masofa 1:10000 masshtabdagi rejada 3,5 sm bilan ko'rsatilgan. Haqiqiy masofani metrda toping.","options":["350 m","300 m","400 m","250 m"],"correct":0,"solution":"3,5 sm·10000=35000 sm=350 m.","topic":"m17","q_ru":"Расстояние между двумя наблюдателями, стоящими на прямой дороге, на плане масштаба 1:10000 показано как 3,5 см. Найдите реальное расстояние в метрах.","options_ru":["350 м","300 м","400 м","250 м"],"solution_ru":"3,5 см·10000=35000 см=350 м."},
{"id":"18-20","q":"4 xil rangli bayroqdan 2 tasini tanlab, ularni ketma-ket joylashtirish mumkin bo'lgan usullar sonini toping.","options":["12","8","6","16"],"correct":0,"solution":"Tartibli tanlash (o'rin almashtirish): A(4,2)=4·3=12.","topic":"m18","q_ru":"Из 4 флагов разного цвета выберите 2 и определите количество способов их расположения в ряд.","options_ru":["12","8","6","16"],"solution_ru":"Упорядоченный выбор (размещение): A(4,2)=4·3=12."},
{"id":"18-4","q":"5 nafar o'quvchidan 3 nafarini sport musobaqasiga (o'rinlarsiz, faqat tarkib) tanlash necha xil usulda mumkin?","options":["10","15","20","60"],"correct":0,"solution":"C(5,3)=5!/(3!·2!)=10.","topic":"m18","q_ru":"Сколькими способами можно выбрать 3 учеников из 5 для участия в спортивном соревновании (без учёта мест, только состав)?","options_ru":["10","15","20","60"],"solution_ru":"C(5,3)=5!/(3!·2!)=10."},
{"id":"18-12","q":"3 xil shapka va 4 xil sharf bor. Ulardan bittadan tanlab kiyish necha xil usulda mumkin?","options":["12","7","9","10"],"correct":0,"solution":"Ko'paytirish qoidasi: 3·4=12.","topic":"m18","q_ru":"Есть 3 вида шапок и 4 вида шарфов. Сколькими способами можно выбрать по одному из них?","options_ru":["12","7","9","10"],"solution_ru":"Правило умножения: 3·4=12."},
{"id":"18-47","q":"0,1,2,3 raqamlaridan takrorlanmaydigan 2 xonali sonlar nechta tuzish mumkin (birinchi raqam 0 bo'lmasin)?","options":["9","12","6","16"],"correct":0,"solution":"Birinchi raqam: 1,2,3 dan biri (3 xil).\nIkkinchi raqam: qolgan 3 ta raqamdan biri (3 xil).\nJami: 3·3=9.","topic":"m18","q_ru":"Сколько 2-значных чисел без повторения цифр можно составить из цифр 0,1,2,3 (первая цифра не равна 0)?","options_ru":["9","12","6","16"],"solution_ru":"Первая цифра: одна из 1,2,3 (3 варианта).\nВторая цифра: одна из оставшихся 3 цифр (3 варианта).\nВсего: 3·3=9."},
{"id":"18-5","q":"6 nafar do'stdan 2 nafarini navbatchilikka (kun va tartib farqsiz) tanlash necha xil usulda mumkin?","options":["15","30","12","20"],"correct":0,"solution":"C(6,2)=6!/(2!·4!)=15.","topic":"m18","q_ru":"Сколькими способами можно выбрать 2 из 6 друзей для дежурства (без учёта дня и порядка)?","options_ru":["15","30","12","20"],"solution_ru":"C(6,2)=6!/(2!·4!)=15."},
{"id":"18-1","q":"4 xil rangli sharlardan 3 tasini tanlab, ularni qutiga ketma-ket (rang tartibi muhim) joylashtirish necha xil usulda mumkin?","options":["24","12","6","8"],"correct":0,"solution":"A(4,3)=4·3·2=24.","topic":"m18","q_ru":"Из 4 шаров разного цвета выберите 3 и определите количество способов расположить их в коробке по порядку (порядок цветов важен).","options_ru":["24","12","6","8"],"solution_ru":"A(4,3)=4·3·2=24."},
{"id":"18-28","q":"Tanga 3 marta tashlanadi. Kamida bir marta 'gerb' tushishi mumkin bo'lgan natijalar sonini toping (jami natijalar 8 ta).","options":["7","6","8","5"],"correct":0,"solution":"Hech qachon gerb tushmasligi 1 ta natija (RRR).\n8−1=7.","topic":"m18","q_ru":"Монета бросается 3 раза. Найдите количество исходов, в которых хотя бы раз выпадет «орёл» (всего исходов 8).","options_ru":["7","6","8","5"],"solution_ru":"Ни одного орла — 1 исход (РРР).\n8−1=7."},
{"id":"18-30","q":"7 kishi orasidan 1 ta rais va 1 ta o'rinbosar (turli kishilar) tanlash necha xil usulda mumkin?","options":["42","49","21","14"],"correct":0,"solution":"Rais uchun 7 tanlov, o'rinbosar uchun qolgan 6 tanlov.\n7·6=42.","topic":"m18","q_ru":"Сколькими способами можно выбрать из 7 человек 1 председателя и 1 заместителя (разные люди)?","options_ru":["42","49","21","14"],"solution_ru":"Для председателя 7 вариантов, для заместителя — оставшиеся 6.\n7·6=42."},
{"id":"18-2","q":"5 xil kitobni tokchaga ketma-ket terib qo'yish necha xil usulda mumkin?","options":["120","60","24","20"],"correct":0,"solution":"5!=5·4·3·2·1=120.","topic":"m18","q_ru":"Сколькими способами можно расставить 5 разных книг на полке по порядку?","options_ru":["120","60","24","20"],"solution_ru":"5!=5·4·3·2·1=120."},
{"id":"18-43","q":"Bir sirli kodda 2 ta harf (A,B,V dan, takrorlanishi mumkin) va so'ngida 1 ta raqam (1-5 dan) ishlatiladi. Jami nechta turli kod tuzish mumkin?","options":["45","30","15","60"],"correct":0,"solution":"Har bir harf uchun 3 tanlov: 3·3=9.\nRaqam uchun 5 tanlov.\nJami: 9·5=45.","topic":"m18","q_ru":"В секретном коде используются 2 буквы (из А,Б,В, с повторением) и в конце 1 цифра (от 1 до 5). Сколько всего различных кодов можно составить?","options_ru":["45","30","15","60"],"solution_ru":"Для каждой буквы 3 варианта: 3·3=9.\nДля цифры 5 вариантов.\nВсего: 9·5=45."},

{"id":"7-37","q":"Ikki son 3:5 nisbatda bo'lib, yig'indisi 64. Kattaroq sonni toping.","options":["24","40","32","45"],"correct":1,"solution":"Jami qism: 3+5=8. 1 qism = 64/8 = 8.\nKatta son = 5×8 = 40.","topic":"m7","q_ru":"Два числа в отношении 3:5, их сумма 64. Найдите большее число.","solution_ru":"Всего частей: 3+5=8. 1 часть = 64/8 = 8.\nБольшее число = 5×8 = 40."},
{"id":"15-40","q":"Ona qizidan 24 yosh katta. 6 yildan keyin ona qizidan 3 marta katta bo'ladi. Hozir qizning yoshini toping.","options":["6","8","10","12"],"correct":0,"solution":"Qiz = x, ona = x+24.\n6 yildan keyin: x+24+6 = 3(x+6).\nx+30 = 3x+18 → 12 = 2x → x = 6.","topic":"m15","q_ru":"Мать старше дочери на 24 года. Через 6 лет мать будет в 3 раза старше дочери. Найдите нынешний возраст дочери.","solution_ru":"Дочь = x, мать = x+24.\nЧерез 6 лет: x+24+6 = 3(x+6).\nx+30 = 3x+18 → 12 = 2x → x = 6."},

{"id":"2-21","q":"Uchta qo'ng'iroq mos ravishda har 4, 6 va 8 soniyada jiringlaydi. Birga jiringlagandan keyin necha soniyada yana birga jiringlaydi?","options":["12","24","48","16"],"correct":1,"solution":"EKUK(4,6,8): 4=2², 6=2·3, 8=2³.\nEKUK = 2³·3 = 24 soniya.","topic":"m2","q_ru":"Три звонка звонят каждые 4, 6 и 8 секунд. Через сколько секунд после одновременного звонка они снова прозвенят вместе?","solution_ru":"НОК(4,6,8): 4=2², 6=2·3, 8=2³.\nНОК = 2³·3 = 24 секунды."},
{"id":"18-16","q":"5 nafar o'quvchidan 2 nafarlik navbatchilik tanlanadi. Bu necha xil usulda bo'ladi?","options":["20","25","7","10"],"correct":3,"solution":"Tartib muhim emas: C(5,2) = (5×4)/(2×1) = 10.","topic":"m18","q_ru":"Из 5 учеников выбирают 2 дежурных. Сколькими способами это можно сделать?","solution_ru":"Порядок не важен: C(5,2) = (5×4)/(2×1) = 10."},
{"id":"1-20","q":"Ketma-ket uchta juft sonning yig'indisi 48. Ulardan o'rtadagisini toping.","options":["14","16","18","12"],"correct":1,"solution":"Sonlar: n−2, n, n+2.\nYig'indi = 3n = 48 → n = 16 (o'rtadagi).","topic":"m1","q_ru":"Сумма трёх подряд идущих чётных чисел равна 48. Найдите среднее из них.","solution_ru":"Числа: n−2, n, n+2.\nСумма = 3n = 48 → n = 16 (среднее)."},

{"id":"3-34","q":"Bog'ning 2/5 qismiga olma, 1/3 qismiga nok ekilgan. Bo'sh qolgan qism qancha?","options":["3/8","2/15","7/15","4/15"],"correct":3,"solution":"Ekilgan: 2/5 + 1/3 = 6/15 + 5/15 = 11/15.\nBo'sh: 1 − 11/15 = 4/15.","topic":"m3","q_ru":"2/5 сада засажено яблонями, 1/3 — грушами. Какая часть осталась пустой?","solution_ru":"Засажено: 2/5 + 1/3 = 6/15 + 5/15 = 11/15.\nПусто: 1 − 11/15 = 4/15."},

{"id":"17-36","q":"Soat 4:30 ni ko'rsatganda soat va minut millari orasidagi burchak necha gradus?","options":["45°","30°","60°","15°"],"correct":0,"solution":"Minut mili 6 da (180°).\nSoat mili 4 va 5 ning o'rtasida: 4,5 · 30° = 135°.\n180° − 135° = 45°.","topic":"m17","q_ru":"Какой угол образуют часовая и минутная стрелки в 4:30?","options_ru":["45°","30°","60°","15°"],"solution_ru":"Минутная стрелка на 6 (180°).\nЧасовая — посередине между 4 и 5: 4,5 · 30° = 135°.\n180° − 135° = 45°."},
{"id":"16-43","q":"5 ta sonning o'rtacha arifmetigi 12. Ularga yana 18 soni qo'shilsa, 6 ta sonning o'rtachasini toping.","options":["12,5","13","15","14"],"correct":1,"solution":"5 ta sonning yig'indisi = 5 × 12 = 60.\nYangi yig'indi = 60 + 18 = 78.\nO'rtacha = 78 / 6 = 13.","topic":"m16","q_ru":"Среднее арифметическое 5 чисел равно 12. Если добавить число 18, найдите среднее 6 чисел.","solution_ru":"Сумма 5 чисел = 5 × 12 = 60.\nНовая сумма = 60 + 18 = 78.\nСреднее = 78 / 6 = 13."},

{"id":"15-26","q":"Bir ishchi ishni 6 kunda, ikkinchisi 12 kunda bajaradi. Ikkalasi birga ishlasa, necha kunda bajaradi?","options":["9 kun","4 kun","3 kun","8 kun"],"correct":1,"solution":"1 kunlik ish: 1/6 + 1/12 = 2/12 + 1/12 = 3/12 = 1/4.\nVaqt = 1 / (1/4) = 4 kun.","topic":"m15","q_ru":"Один рабочий выполняет работу за 6 дней, другой — за 12. За сколько дней они выполнят её вместе?","options_ru":["9 дней","4 дня","3 дня","8 дней"],"solution_ru":"Работа за 1 день: 1/6 + 1/12 = 2/12 + 1/12 = 3/12 = 1/4.\nВремя = 1 / (1/4) = 4 дня."},

{"id":"14-50","q":"2 ta daftar va 3 ta ruchka 13 000 so'm, 1 ta daftar va 2 ta ruchka 8 000 so'm turadi. Bitta ruchka narxini toping.","options":["2 000 so'm","2 500 so'm","3 000 so'm","3 500 so'm"],"correct":2,"solution":"2d + 3r = 13000, d + 2r = 8000.\nIkkinchisidan: d = 8000 − 2r.\n2(8000−2r)+3r = 13000 → 16000 − r = 13000 → r = 3000 so'm.","topic":"m14","q_ru":"2 тетради и 3 ручки стоят 13 000 сум, 1 тетрадь и 2 ручки — 8 000 сум. Найдите цену одной ручки.","options_ru":["2 000 сум","2 500 сум","3 000 сум","3 500 сум"],"solution_ru":"2d + 3r = 13000, d + 2r = 8000.\nИз второго: d = 8000 − 2r.\n2(8000−2r)+3r = 13000 → 16000 − r = 13000 → r = 3000 сум."},

{"id":"1-55","q":"Uch xonali sonning raqamlari yig'indisi 20 ga teng. Shunday sonlarning eng kattasini toping.","options":["992","983","999","920"],"correct":0,"solution":"Son eng katta bo'lishi uchun yuzlar xonasi iloji boricha katta bo'lishi kerak: 9.\nQolgan ikki raqam yig'indisi 20 − 9 = 11, o'nlar xonasini katta olamiz: 9, birlar = 2.\nJavob: 992.","topic":"m1","q_ru":"Сумма цифр трёхзначного числа равна 20. Найдите наибольшее такое число.","options_ru":["992","983","999","920"],"solution_ru":"Чтобы число было наибольшим, цифра сотен должна быть максимальной: 9.\nСумма двух других цифр 20 − 9 = 11; берём цифру десятков 9, тогда единицы = 2.\nОтвет: 992."},
{"id":"1-21","q":"Kitobda 240 bet bor. Aziz har kuni 15 betdan o'qiydi. U 9 kun o'qigandan keyin necha bet qoladi?","options":["105","135","225","95"],"correct":0,"solution":"9 kunda o'qilgan: 9 · 15 = 135 bet.\nQolgan: 240 − 135 = 105 bet.","topic":"m1","q_ru":"В книге 240 страниц. Азиз читает по 15 страниц в день. Сколько страниц останется через 9 дней?","options_ru":["105","135","225","95"],"solution_ru":"За 9 дней прочитано: 9 · 15 = 135 страниц.\nОсталось: 240 − 135 = 105 страниц."},
{"id":"1-44","q":"Ikki sonning yig'indisi 100, ulardan biri ikkinchisidan 28 ta katta. Katta sonni toping.","options":["64","72","36","56"],"correct":0,"solution":"Kichik son x bo'lsa, katta son x + 28.\nx + x + 28 = 100 → 2x = 72 → x = 36.\nKatta son: 36 + 28 = 64.","topic":"m1","q_ru":"Сумма двух чисел равна 100, одно из них на 28 больше другого. Найдите большее число.","options_ru":["64","72","36","56"],"solution_ru":"Пусть меньшее число x, тогда большее x + 28.\nx + x + 28 = 100 → 2x = 72 → x = 36.\nБольшее число: 36 + 28 = 64."},
{"id":"1-49","q":"1 dan 100 gacha bo'lgan sonlar ichida nechtasi 3 ga ham, 5 ga ham bo'linmaydi?","options":["53","47","52","60"],"correct":0,"solution":"3 ga bo'linadiganlar: 33 ta, 5 ga: 20 ta, ikkalasiga (15 ga): 6 ta.\n3 yoki 5 ga bo'linadiganlar: 33 + 20 − 6 = 47 ta.\nBo'linmaydiganlar: 100 − 47 = 53 ta.","topic":"m1","q_ru":"Сколько чисел от 1 до 100 не делятся ни на 3, ни на 5?","options_ru":["53","47","52","60"],"solution_ru":"Делятся на 3: 33 числа, на 5: 20 чисел, на оба (на 15): 6 чисел.\nДелятся на 3 или на 5: 33 + 20 − 6 = 47.\nНе делятся: 100 − 47 = 53."},
{"id":"1-37","q":"Qatordagi qonuniyatni toping va keyingi sonni yozing: 1, 3, 7, 15, 31, …","options":["63","47","62","64"],"correct":0,"solution":"Har bir son oldingisini 2 ga ko'paytirib, 1 qo'shishdan hosil bo'ladi: 1·2+1=3, 3·2+1=7, …\n31 · 2 + 1 = 63.","topic":"m1","q_ru":"Найдите закономерность и следующее число: 1, 3, 7, 15, 31, …","options_ru":["63","47","62","64"],"solution_ru":"Каждое число получается из предыдущего умножением на 2 и прибавлением 1: 1·2+1=3, 3·2+1=7, …\n31 · 2 + 1 = 63."},
{"id":"1-51","q":"Uch xonali son 7 raqami bilan tugaydi. Shu 7 raqamini sonning boshiga o'tkazsak, son 216 ga ortadi. Sonni toping.","options":["537","357","573","753"],"correct":0,"solution":"Son 10a + 7 ko'rinishida (a — ikki xonali son), yangi son 700 + a.\n700 + a − (10a + 7) = 216 → 693 − 9a = 216 → 9a = 477 → a = 53.\nSon: 537. Tekshirish: 753 − 537 = 216 ✓","topic":"m1","q_ru":"Трёхзначное число оканчивается цифрой 7. Если эту цифру переставить в начало, число увеличится на 216. Найдите число.","options_ru":["537","357","573","753"],"solution_ru":"Число имеет вид 10a + 7 (a — двузначное), новое число 700 + a.\n700 + a − (10a + 7) = 216 → 693 − 9a = 216 → 9a = 477 → a = 53.\nЧисло: 537. Проверка: 753 − 537 = 216 ✓"},

{"id":"2-53","q":"4325□ sonidagi □ o'rniga qanday raqam qo'yilsa, son 6 ga qoldiqsiz bo'linadi?","options":["4","1","6","2"],"correct":0,"solution":"6 ga bo'linishi uchun son 2 ga ham, 3 ga ham bo'linishi kerak.\nRaqamlar yig'indisi: 4+3+2+5+□ = 14+□ → □ = 1, 4 yoki 7 bo'lsa 3 ga bo'linadi.\nJuft bo'lishi uchun □ = 4.","topic":"m2","q_ru":"Какую цифру нужно поставить вместо □ в числе 4325□, чтобы оно делилось на 6?","options_ru":["4","1","6","2"],"solution_ru":"Число делится на 6, если оно делится и на 2, и на 3.\nСумма цифр: 4+3+2+5+□ = 14+□ → делится на 3 при □ = 1, 4 или 7.\nЧтобы число было чётным: □ = 4."},

{"id":"2-45","q":"Sinf o'quvchilarini 4 tadan ham, 6 tadan ham qatorga tizganda har safar 1 kishi ortib qoladi. Sinfda 30 dan ko'p, 40 dan kam o'quvchi bor. Sinfda nechta o'quvchi bor?","options":["37","36","35","25"],"correct":0,"solution":"O'quvchilar soni − 1 soni 4 ga ham, 6 ga ham bo'linadi, ya'ni EKUK(4, 6) = 12 ga karrali.\n12k + 1: 13, 25, 37, 49, … — 30 va 40 orasida faqat 37.","topic":"m2","q_ru":"Если учеников класса строить по 4 или по 6 в ряд, каждый раз остаётся 1 человек. В классе больше 30, но меньше 40 учеников. Сколько учеников в классе?","options_ru":["37","36","35","25"],"solution_ru":"Число учеников минус 1 делится и на 4, и на 6, то есть кратно НОК(4, 6) = 12.\n12k + 1: 13, 25, 37, 49, … — между 30 и 40 только 37."},

{"id":"2-51","q":"Oyim 48 ta olma va 36 ta nokni bolalarga teng bo'lib bermoqchi (hech narsa ortib qolmasin). Eng ko'pi bilan nechta bolaga bo'lib berish mumkin?","options":["12","6","24","4"],"correct":0,"solution":"Bolalar soni 48 ning ham, 36 ning ham bo'luvchisi bo'lishi kerak.\nEng kattasi: EKUB(48, 36) = 12.\nHar bir bolaga 4 ta olma va 3 ta nok tegadi.","topic":"m2","q_ru":"Мама хочет поровну разделить 48 яблок и 36 груш между детьми (чтобы ничего не осталось). Наибольшее число детей?","options_ru":["12","6","24","4"],"solution_ru":"Число детей должно делить и 48, и 36.\nНаибольшее: НОД(48, 36) = 12.\nКаждый получит 4 яблока и 3 груши."},

{"id":"2-47","q":"1 dan 100 gacha bo'lgan sonlardan nechtasining natural bo'luvchilari soni toq?","options":["10","9","11","50"],"correct":0,"solution":"Bo'luvchilar juft-juft bo'lib keladi (d va n:d). Faqat to'liq kvadratlarda bitta bo'luvchi (√n) juftsiz qoladi.\n1 dan 100 gacha to'liq kvadratlar: 1, 4, 9, …, 100 — 10 ta.","topic":"m2","q_ru":"У скольких чисел от 1 до 100 нечётное количество натуральных делителей?","options_ru":["10","9","11","50"],"solution_ru":"Делители идут парами (d и n:d). Только у полных квадратов один делитель (√n) остаётся без пары.\nПолных квадратов от 1 до 100: 1, 4, 9, …, 100 — 10."},
{"id":"2-52","q":"Ikki tub sonning yig'indisi 25 ga teng. Ularning ko'paytmasini toping.","options":["46","66","114","156"],"correct":0,"solution":"25 toq son. Ikki toq tub sonning yig'indisi juft bo'ladi, demak sonlardan biri 2 (yagona juft tub son).\nIkkinchisi: 25 − 2 = 23 (tub).\nKo'paytma: 2 · 23 = 46.","topic":"m2","q_ru":"Сумма двух простых чисел равна 25. Найдите их произведение.","options_ru":["46","66","114","156"],"solution_ru":"25 — нечётное. Сумма двух нечётных простых чётна, значит одно из чисел 2 (единственное чётное простое).\nВторое: 25 − 2 = 23 (простое).\nПроизведение: 2 · 23 = 46."},

{"id":"8-48","q":"Kvadrat va to'g'ri to'rtburchakning perimetrlari teng. To'g'ri to'rtburchakning tomonlari 9 sm va 5 sm. Qaysi shaklning yuzi katta va qanchaga?","options":["Kvadratniki, 4 sm² ga","To'g'ri to'rtburchakniki, 4 sm² ga","Yuzlar teng","Kvadratniki, 14 sm² ga"],"correct":0,"solution":"Perimetr: 2(9 + 5) = 28 sm → kvadrat tomoni 7 sm.\nKvadrat yuzi 49 sm², to'g'ri to'rtburchakniki 45 sm².\nKvadratniki 4 sm² ga katta.","topic":"m8","q_ru":"Периметры квадрата и прямоугольника равны. Стороны прямоугольника 9 см и 5 см. У какой фигуры площадь больше и на сколько?","options_ru":["У квадрата, на 4 см²","У прямоугольника, на 4 см²","Площади равны","У квадрата, на 14 см²"],"solution_ru":"Периметр: 2(9 + 5) = 28 см → сторона квадрата 7 см.\nПлощадь квадрата 49 см², прямоугольника 45 см².\nУ квадрата больше на 4 см²."},

{"id":"8-29","q":"Tomoni 4 sm bo'lgan kvadratning har bir tomoni 1 sm ga uzaytirildi. Kvadratning yuzi necha sm² ga ortdi?","options":["9 sm²","4 sm²","1 sm²","8 sm²"],"correct":0,"solution":"Yangi yuza: 5² = 25 sm², eskisi: 4² = 16 sm².\n25 − 16 = 9 sm².","topic":"m8","q_ru":"Каждую сторону квадрата со стороной 4 см увеличили на 1 см. На сколько см² увеличилась площадь?","options_ru":["9 см²","4 см²","1 см²","8 см²"],"solution_ru":"Новая площадь: 5² = 25 см², старая: 4² = 16 см².\n25 − 16 = 9 см²."},

{"id":"9-52","q":"Qirrasi 3 sm bo'lgan kubning sirti bo'yaldi, so'ng u qirrasi 1 sm bo'lgan kubchalarga kesildi. Nechta kubchaning faqat bitta yog'i bo'yalgan?","options":["6","8","12","1"],"correct":0,"solution":"Faqat bitta yog'i bo'yalgan kubchalar — har bir yoqning markazidagi kubcha.\nKubning 6 ta yog'i bor → 6 ta kubcha.\n(Uchlaridagi 8 tasining 3 ta, qirralaridagi 12 tasining 2 ta yog'i bo'yalgan.)","topic":"m9","q_ru":"Поверхность куба с ребром 3 см покрасили, а затем разрезали его на кубики с ребром 1 см. У скольких кубиков покрашена ровно одна грань?","options_ru":["6","8","12","1"],"solution_ru":"Ровно одна грань покрашена у центральных кубиков каждой грани.\nУ куба 6 граней → 6 кубиков.\n(У 8 угловых покрашены 3 грани, у 12 рёберных — 2.)"},
{"id":"9-50","q":"Gugurt qutisining o'lchamlari 5 sm × 3 sm × 2 sm. Qirrasi 30 sm bo'lgan kub shaklidagi yashikka nechta gugurt qutisi to'liq sig'adi?","options":["900","300","1000","450"],"correct":0,"solution":"Yashik hajmi: 30³ = 27 000 sm³, quti hajmi: 5 · 3 · 2 = 30 sm³.\n27 000 : 30 = 900.\nQutilar aniq joylashadi: 30:5 = 6, 30:3 = 10, 30:2 = 15 → 6 · 10 · 15 = 900.","topic":"m9","q_ru":"Размеры спичечного коробка 5 см × 3 см × 2 см. Сколько коробков полностью поместится в ящик-куб с ребром 30 см?","options_ru":["900","300","1000","450"],"solution_ru":"Объём ящика: 30³ = 27 000 см³, коробка: 5 · 3 · 2 = 30 см³.\n27 000 : 30 = 900.\nКоробки укладываются точно: 30:5 = 6, 30:3 = 10, 30:2 = 15 → 6 · 10 · 15 = 900."},

{"id":"9-51","q":"Qirrasi 2 sm bo'lgan uchta bir xil kub yonma-yon qo'yilib, parallelepiped hosil qilindi. Uning to'la sirtini toping.","options":["56 sm²","72 sm²","48 sm²","64 sm²"],"correct":0,"solution":"Parallelepiped o'lchamlari: 6 × 2 × 2 sm.\nS = 2(6·2 + 6·2 + 2·2) = 2(12 + 12 + 4) = 56 sm².\n(72 sm² — uchta kub sirtlari yig'indisi, lekin bir-biriga tegib turgan 4 ta yoq sirtga kirmaydi.)","topic":"m9","q_ru":"Три одинаковых куба с ребром 2 см поставили в ряд и получили параллелепипед. Найдите площадь его полной поверхности.","options_ru":["56 см²","72 см²","48 см²","64 см²"],"solution_ru":"Размеры параллелепипеда: 6 × 2 × 2 см.\nS = 2(6·2 + 6·2 + 2·2) = 2(12 + 12 + 4) = 56 см².\n(72 см² — сумма поверхностей трёх кубов, но 4 соприкасающиеся грани не входят в поверхность.)"},

{"id":"10-55","q":"Dars 45 daqiqa, tanaffuslar 10 daqiqadan davom etadi. 1-dars 8:30 da boshlansa, 4-dars soat nechada tugaydi?","options":["12:00","11:30","12:10","11:50"],"correct":0,"solution":"4 ta dars: 4 · 45 = 180 daqiqa, ular orasida 3 ta tanaffus: 3 · 10 = 30 daqiqa.\nJami 210 daqiqa = 3 soat 30 daqiqa.\n8:30 + 3:30 = 12:00.","topic":"m10","q_ru":"Урок длится 45 минут, перемены — по 10 минут. Если 1-й урок начинается в 8:30, во сколько закончится 4-й урок?","options_ru":["12:00","11:30","12:10","11:50"],"solution_ru":"4 урока: 4 · 45 = 180 минут, между ними 3 перемены: 3 · 10 = 30 минут.\nВсего 210 минут = 3 ч 30 мин.\n8:30 + 3:30 = 12:00."},

{"id":"11-40","q":"Quyidagi birhadlardan qaysi biri −3x²y ga o'xshash?","options":["5x²y","−3xy²","3x²y²","−3x²"],"correct":0,"solution":"O'xshash birhadlarning harfiy qismi bir xil bo'ladi: x²y.\nFaqat 5x²y ning harfiy qismi x²y.","topic":"m11","q_ru":"Какой из одночленов подобен −3x²y?","options_ru":["5x²y","−3xy²","3x²y²","−3x²"],"solution_ru":"У подобных одночленов одинаковая буквенная часть: x²y.\nТолько у 5x²y буквенная часть x²y."},
{"id":"11-36","q":"□ · 3ab² = 12a³b⁵ tenglikda □ o'rniga qaysi birhad turishi kerak?","options":["4a²b³","9a²b³","4a³b⁵","36a⁴b⁷"],"correct":0,"solution":"□ = 12a³b⁵ : 3ab² = 4a²b³.\nTekshirish: 4a²b³ · 3ab² = 12a³b⁵ ✓","topic":"m11","q_ru":"Какой одночлен нужно поставить вместо □: □ · 3ab² = 12a³b⁵?","options_ru":["4a²b³","9a²b³","4a³b⁵","36a⁴b⁷"],"solution_ru":"□ = 12a³b⁵ : 3ab² = 4a²b³.\nПроверка: 4a²b³ · 3ab² = 12a³b⁵ ✓"},

{"id":"11-31","q":"To'g'ri to'rtburchakning bo'yi 5x, eni 2x. Uning perimetri va yuzini toping.","options":["P = 14x, S = 10x²","P = 7x, S = 10x²","P = 14x, S = 10x","P = 10x², S = 14x"],"correct":0,"solution":"P = 2(5x + 2x) = 14x.\nS = 5x · 2x = 10x².","topic":"m11","q_ru":"Длина прямоугольника 5x, ширина 2x. Найдите его периметр и площадь.","options_ru":["P = 14x, S = 10x²","P = 7x, S = 10x²","P = 14x, S = 10x","P = 10x², S = 14x"],"solution_ru":"P = 2(5x + 2x) = 14x.\nS = 5x · 2x = 10x²."},

{"id":"11-24","q":"4x³yⁿ birhadning darajasi 5 ga teng bo'lishi uchun n nechaga teng bo'lishi kerak?","options":["2","5","1","8"],"correct":0,"solution":"Birhadning darajasi — harflar ko'rsatkichlari yig'indisi: 3 + n = 5 → n = 2.","topic":"m11","q_ru":"При каком n степень одночлена 4x³yⁿ равна 5?","options_ru":["2","5","1","8"],"solution_ru":"Степень одночлена — сумма показателей букв: 3 + n = 5 → n = 2."},

{"id":"11-21","q":"(−a)² · (−a)³ ifodani soddalashtiring.","options":["−a⁵","a⁵","−a⁶","a⁶"],"correct":0,"solution":"(−a)² · (−a)³ = (−a)⁵ = −a⁵ (toq daraja — ishora saqlanadi).","topic":"m11","q_ru":"Упростите выражение (−a)² · (−a)³.","options_ru":["−a⁵","a⁵","−a⁶","a⁶"],"solution_ru":"(−a)² · (−a)³ = (−a)⁵ = −a⁵ (нечётная степень — знак сохраняется)."},

{"id":"12-41","q":"Qulay usulda hisoblang: 101² − 99²","options":["400","4","200","2"],"correct":0,"solution":"Kvadratlar ayirmasi: a² − b² = (a − b)(a + b).\n(101 − 99)(101 + 99) = 2 · 200 = 400.","topic":"m12","q_ru":"Вычислите удобным способом: 101² − 99²","options_ru":["400","4","200","2"],"solution_ru":"Разность квадратов: a² − b² = (a − b)(a + b).\n(101 − 99)(101 + 99) = 2 · 200 = 400."},
{"id":"12-36","q":"Qulay usulda hisoblang: 47² + 2 · 47 · 3 + 3²","options":["2500","2209","2401","2509"],"correct":0,"solution":"Yig'indi kvadrati: a² + 2ab + b² = (a + b)².\n(47 + 3)² = 50² = 2500.","topic":"m12","q_ru":"Вычислите удобным способом: 47² + 2 · 47 · 3 + 3²","options_ru":["2500","2209","2401","2509"],"solution_ru":"Квадрат суммы: a² + 2ab + b² = (a + b)².\n(47 + 3)² = 50² = 2500."},
{"id":"12-34","q":"x + 1/x = 3 bo'lsa, x² + 1/x² ning qiymatini toping.","options":["7","9","11","3"],"correct":0,"solution":"(x + 1/x)² = x² + 2 + 1/x².\n9 = x² + 1/x² + 2 → x² + 1/x² = 7.","topic":"m12","q_ru":"Если x + 1/x = 3, найдите значение x² + 1/x².","options_ru":["7","9","11","3"],"solution_ru":"(x + 1/x)² = x² + 2 + 1/x².\n9 = x² + 1/x² + 2 → x² + 1/x² = 7."},
{"id":"12-35","q":"a − b = 5 va ab = 6 bo'lsa, a² + b² ni toping.","options":["37","13","31","25"],"correct":0,"solution":"(a − b)² = a² − 2ab + b² → a² + b² = (a − b)² + 2ab.\n25 + 12 = 37.","topic":"m12","q_ru":"Если a − b = 5 и ab = 6, найдите a² + b².","options_ru":["37","13","31","25"],"solution_ru":"(a − b)² = a² − 2ab + b² → a² + b² = (a − b)² + 2ab.\n25 + 12 = 37."},
{"id":"12-16","q":"Ko'paytuvchilarga ajrating: ax + ay + 3x + 3y","options":["(x + y)(a + 3)","(x + 3)(a + y)","(a + x)(y + 3)","3a(x + y)"],"correct":0,"solution":"Guruhlaymiz: a(x + y) + 3(x + y) = (x + y)(a + 3).","topic":"m12","q_ru":"Разложите на множители: ax + ay + 3x + 3y","options_ru":["(x + y)(a + 3)","(x + 3)(a + y)","(a + x)(y + 3)","3a(x + y)"],"solution_ru":"Группируем: a(x + y) + 3(x + y) = (x + y)(a + 3)."},

{"id":"12-46","q":"(x + 3)² − (x + 1)(x + 5) ifodaning qiymati x ga bog'liq emas. Shu qiymatni toping.","options":["4","14","0","−4"],"correct":0,"solution":"(x + 3)² = x² + 6x + 9.\n(x + 1)(x + 5) = x² + 6x + 5.\nAyirma: 9 − 5 = 4.","topic":"m12","q_ru":"Значение выражения (x + 3)² − (x + 1)(x + 5) не зависит от x. Найдите его.","options_ru":["4","14","0","−4"],"solution_ru":"(x + 3)² = x² + 6x + 9.\n(x + 1)(x + 5) = x² + 6x + 5.\nРазность: 9 − 5 = 4."},
{"id":"12-28","q":"x = 4 bo'lganda 2x² + 5 ko'phadning qiymatini toping.","options":["13","38","37","69"],"correct":2,"solution":"2x² = 2 · 16 = 32.\n32 + 5 = 37.","topic":"m12","q_ru":"При x = 4 найдите значение многочлена 2x² + 5.","options_ru":["13","38","37","69"],"solution_ru":"2x² = 2 · 16 = 32.\n32 + 5 = 37."},
{"id":"12-17","q":"Bo'yi (2x + 3), eni (x − 1) bo'lgan to'g'ri to'rtburchakning yuzini ko'phad ko'rinishida yozing.","options":["2x² + x − 3","2x² − x − 3","2x² + 5x − 3","3x + 2"],"correct":0,"solution":"S = (2x + 3)(x − 1) = 2x² − 2x + 3x − 3 = 2x² + x − 3.","topic":"m12","q_ru":"Запишите в виде многочлена площадь прямоугольника с длиной (2x + 3) и шириной (x − 1).","options_ru":["2x² + x − 3","2x² − x − 3","2x² + 5x − 3","3x + 2"],"solution_ru":"S = (2x + 3)(x − 1) = 2x² − 2x + 3x − 3 = 2x² + x − 3."},
{"id":"12-32","q":"x = 105 bo'lganda x² − 10x + 25 ifodaning qiymatini toping.","options":["10 000","9 975","1 000","11 025"],"correct":0,"solution":"x² − 10x + 25 = (x − 5)².\n(105 − 5)² = 100² = 10 000.","topic":"m12","q_ru":"Найдите значение выражения x² − 10x + 25 при x = 105.","options_ru":["10 000","9 975","1 000","11 025"],"solution_ru":"x² − 10x + 25 = (x − 5)².\n(105 − 5)² = 100² = 10 000."},
{"id":"12-25","q":"x = 2 bo'lganda 3x² + 8 ko'phadning qiymatini toping.","options":["44","20","21","14"],"correct":1,"solution":"3x² = 3 · 4 = 12.\n12 + 8 = 20.","topic":"m12","q_ru":"При x = 2 найдите значение многочлена 3x² + 8.","options_ru":["44","20","21","14"],"solution_ru":"3x² = 3 · 4 = 12.\n12 + 8 = 20."},
{"id":"13-11","q":"3 ta daftar va 1 ta ruchka birgalikda 14 000 so'm turadi. Ruchka 2 000 so'm bo'lsa, bitta daftar necha so'm?","options":["4 000 so'm","3 000 so'm","6 000 so'm","12 000 so'm"],"correct":0,"solution":"3x + 2 000 = 14 000 → 3x = 12 000 → x = 4 000 so'm.","topic":"m13","q_ru":"3 тетради и 1 ручка вместе стоят 14 000 сумов. Ручка стоит 2 000 сумов. Сколько стоит одна тетрадь?","options_ru":["4 000 сумов","3 000 сумов","6 000 сумов","12 000 сумов"],"solution_ru":"3x + 2 000 = 14 000 → 3x = 12 000 → x = 4 000 сумов."},

{"id":"13-32","q":"Uchta ketma-ket natural sonning yig'indisi 72. Ularning eng kattasini toping.","options":["25","24","23","26"],"correct":0,"solution":"Sonlar: n − 1, n, n + 1. Yig'indi 3n = 72 → n = 24.\nEng kattasi: 25.","topic":"m13","q_ru":"Сумма трёх последовательных натуральных чисел равна 72. Найдите наибольшее из них.","options_ru":["25","24","23","26"],"solution_ru":"Числа: n − 1, n, n + 1. Сумма 3n = 72 → n = 24.\nНаибольшее: 25."},
{"id":"13-53","q":"Aka ukasidan 3 marta katta. 6 yildan keyin aka ukasidan 2 marta katta bo'ladi. Uka hozir necha yoshda?","options":["6","12","18","3"],"correct":0,"solution":"Uka x, aka 3x yoshda.\n3x + 6 = 2(x + 6) → 3x + 6 = 2x + 12 → x = 6.\nTekshirish: hozir 6 va 18, 6 yildan keyin 12 va 24 ✓","topic":"m13","q_ru":"Старший брат в 3 раза старше младшего. Через 6 лет он будет старше в 2 раза. Сколько лет младшему брату сейчас?","options_ru":["6","12","18","3"],"solution_ru":"Младшему x лет, старшему 3x.\n3x + 6 = 2(x + 6) → 3x + 6 = 2x + 12 → x = 6.\nПроверка: сейчас 6 и 18, через 6 лет 12 и 24 ✓"},
{"id":"13-10","q":"ax − 5 = 7 tenglamaning ildizi x = 3 bo'lishi uchun a nechaga teng bo'lishi kerak?","options":["4","3","12","6"],"correct":0,"solution":"x = 3 ni qo'yamiz: 3a − 5 = 7 → 3a = 12 → a = 4.","topic":"m13","q_ru":"При каком a корнем уравнения ax − 5 = 7 является x = 3?","options_ru":["4","3","12","6"],"solution_ru":"Подставляем x = 3: 3a − 5 = 7 → 3a = 12 → a = 4."},
{"id":"13-30","q":"Sinfda o'g'il bolalar qizlardan 4 nafar ko'p. Jami 28 o'quvchi bo'lsa, sinfda nechta qiz bor?","options":["12","16","14","24"],"correct":0,"solution":"Qizlar x, o'g'il bolalar x + 4.\nx + x + 4 = 28 → 2x = 24 → x = 12.","topic":"m13","q_ru":"В классе мальчиков на 4 больше, чем девочек. Всего 28 учеников. Сколько девочек в классе?","options_ru":["12","16","14","24"],"solution_ru":"Девочек x, мальчиков x + 4.\nx + x + 4 = 28 → 2x = 24 → x = 12."},
{"id":"13-20","q":"Tenglamani yeching: 4x + 3 = 39.","options":["36","10","8","9"],"correct":3,"solution":"4x = 39 − 3 = 36.\nx = 36 : 4 = 9.","topic":"m13","q_ru":"Решите уравнение: 4x + 3 = 39.","options_ru":["36","10","8","9"],"solution_ru":"4x = 39 − 3 = 36.\nx = 36 : 4 = 9."},
{"id":"13-55","q":"Hovlida tovuqlar va quyonlar bor: jami 10 ta bosh va 28 ta oyoq. Nechta quyon bor?","options":["4","6","7","3"],"correct":0,"solution":"Quyonlar x, tovuqlar 10 − x.\n4x + 2(10 − x) = 28 → 2x + 20 = 28 → x = 4.\nTekshirish: 4 quyon (16 oyoq) + 6 tovuq (12 oyoq) = 28 ✓","topic":"m13","q_ru":"Во дворе куры и кролики: всего 10 голов и 28 ног. Сколько кроликов?","options_ru":["4","6","7","3"],"solution_ru":"Кроликов x, кур 10 − x.\n4x + 2(10 − x) = 28 → 2x + 20 = 28 → x = 4.\nПроверка: 4 кролика (16 ног) + 6 кур (12 ног) = 28 ✓"},

{"id":"13-31","q":"|x − 3| = 5 tenglama ildizlarining yig'indisini toping.","options":["6","8","10","−2"],"correct":0,"solution":"x − 3 = 5 → x = 8 yoki x − 3 = −5 → x = −2.\nYig'indi: 8 + (−2) = 6.","topic":"m13","q_ru":"Найдите сумму корней уравнения |x − 3| = 5.","options_ru":["6","8","10","−2"],"solution_ru":"x − 3 = 5 → x = 8 или x − 3 = −5 → x = −2.\nСумма: 8 + (−2) = 6."},
{"id":"13-41","q":"Velosipedchi A dan B ga 15 km/soat, qaytishda 10 km/soat tezlikda yurdi. U jami 5 soat yo'lda bo'ldi. A va B orasidagi masofani toping.","options":["30 km","25 km","62,5 km","50 km"],"correct":0,"solution":"Masofa d bo'lsa: d/15 + d/10 = 5.\nUmumiy maxraj 30: 2d + 3d = 150 → d = 30 km.","topic":"m13","q_ru":"Велосипедист ехал из A в B со скоростью 15 км/ч, а обратно — 10 км/ч. Всего он был в пути 5 часов. Найдите расстояние между A и B.","options_ru":["30 км","25 км","62,5 км","50 км"],"solution_ru":"Пусть расстояние d: d/15 + d/10 = 5.\nОбщий знаменатель 30: 2d + 3d = 150 → d = 30 км."},
{"id":"13-44","q":"Tenglamani yeching: 7x + 6 = 3x + 46.","options":["11","10","52","9"],"correct":1,"solution":"7x − 3x = 46 − 6.\n4x = 40.\nx = 40/4 = 10.","topic":"m13","q_ru":"Решите уравнение: 7x + 6 = 3x + 46.","options_ru":["11","10","52","9"],"solution_ru":"7x − 3x = 46 − 6.\n4x = 40.\nx = 40/4 = 10."},
{"id":"13-29","q":"Tenglamani yeching: 0,4(x − 5) = 0,6x − 3","options":["5","−5","25","0,5"],"correct":0,"solution":"0,4x − 2 = 0,6x − 3.\n−2 + 3 = 0,6x − 0,4x → 1 = 0,2x → x = 5.","topic":"m13","q_ru":"Решите уравнение: 0,4(x − 5) = 0,6x − 3","options_ru":["5","−5","25","0,5"],"solution_ru":"0,4x − 2 = 0,6x − 3.\n−2 + 3 = 0,6x − 0,4x → 1 = 0,2x → x = 5."},
{"id":"14-2","q":"Sistemani yeching va x ni toping: 2x + 3y = 43, x + y = 17.","options":["26","9","8","17"],"correct":2,"solution":"Ikkinchidan y = 17 − x. Birinchiga qo'yamiz: 2x + 3(17 − x) = 43 → 51 − x = 43 → x = 8.","topic":"m14","q_ru":"Решите систему и найдите x: 2x + 3y = 43, x + y = 17.","options_ru":["26","9","8","17"],"solution_ru":"Из второго: y = 17 − x. Подставляем в первое: 2x + 3(17 − x) = 43 → 51 − x = 43 → x = 8."},
{"id":"14-42","q":"Ikki sonning yig'indisi 30. Birinchi sonning 3 barobari ikkinchi sonning 2 barobariga teng. Kichik sonni toping.","options":["12","18","10","15"],"correct":0,"solution":"x + y = 30, 3x = 2y → y = 1,5x.\nx + 1,5x = 30 → 2,5x = 30 → x = 12, y = 18.\nKichik son: 12.","topic":"m14","q_ru":"Сумма двух чисел равна 30. Утроенное первое число равно удвоенному второму. Найдите меньшее число.","options_ru":["12","18","10","15"],"solution_ru":"x + y = 30, 3x = 2y → y = 1,5x.\nx + 1,5x = 30 → 2,5x = 30 → x = 12, y = 18.\nМеньшее число: 12."},
{"id":"14-39","q":"Tenglamalar sistemasi nechta yechimga ega?<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + y = 7</span><span>4x + 2y = 14</span></span></span>","options":["Cheksiz ko'p","Bitta","Ikkita","Yechimi yo'q"],"correct":0,"solution":"Ikkinchi tenglama birinchisini 2 ga ko'paytirishdan hosil bo'lgan — bu bitta to'g'ri chiziq.\nDemak, sistema cheksiz ko'p yechimga ega.","topic":"m14","q_ru":"Сколько решений имеет система?<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + y = 7</span><span>4x + 2y = 14</span></span></span>","options_ru":["Бесконечно много","Одно","Два","Нет решений"],"solution_ru":"Второе уравнение получено умножением первого на 2 — это одна и та же прямая.\nЗначит, решений бесконечно много."},
{"id":"14-4","q":"Tenglamalar sistemasini yeching va x ni toping: x + y = 12, x − y = -4.","options":["12","4","-4","8"],"correct":1,"solution":"Ikkala tenglamani qo'shamiz: 2x = 8, x = 4.\nU holda y = 8.","topic":"m14","q_ru":"Решите систему уравнений и найдите x: x + y = 12, x − y = -4.","options_ru":["12","4","-4","8"],"solution_ru":"Складываем оба уравнения: 2x = 8, x = 4.\nТогда y = 8."},
{"id":"14-31","q":"Tenglamalar sistemasi nechta yechimga ega?<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 5</span><span>x + y = 8</span></span></span>","options":["Yechimi yo'q","Bitta","Cheksiz ko'p","Ikkita"],"correct":0,"solution":"Bir xil x + y ifoda bir vaqtda 5 ga ham, 8 ga ham teng bo'lolmaydi.\nTo'g'ri chiziqlar parallel — sistema yechimga ega emas.","topic":"m14","q_ru":"Сколько решений имеет система?<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>x + y = 5</span><span>x + y = 8</span></span></span>","options_ru":["Нет решений","Одно","Бесконечно много","Два"],"solution_ru":"Одно и то же выражение x + y не может одновременно равняться 5 и 8.\nПрямые параллельны — решений нет."},
{"id":"14-14","q":"Velosipedchi 2 soat tekis yo'lda va 1 soat tog' yo'lida jami 50 km yurdi. Tekis yo'ldagi tezligi tog' yo'lidagidan 10 km/soat ko'p. Tog' yo'lidagi tezlikni toping.","options":["10 km/soat","20 km/soat","15 km/soat","12 km/soat"],"correct":0,"solution":"Tog' yo'lida v, tekis yo'lda v + 10.\n2(v + 10) + v = 50 → 3v = 30 → v = 10 km/soat.","topic":"m14","q_ru":"Велосипедист ехал 2 часа по ровной дороге и 1 час по горной, всего 50 км. По ровной дороге его скорость на 10 км/ч больше. Найдите скорость на горной дороге.","options_ru":["10 км/ч","20 км/ч","15 км/ч","12 км/ч"],"solution_ru":"По горной v, по ровной v + 10.\n2(v + 10) + v = 50 → 3v = 30 → v = 10 км/ч."},
{"id":"14-12","q":"Teng yonli uchburchakning perimetri 24 sm, asosi yon tomonidan 3 sm qisqa. Yon tomonini toping.","options":["9 sm","6 sm","8 sm","10,5 sm"],"correct":0,"solution":"Yon tomon a, asos a − 3.\n2a + (a − 3) = 24 → 3a = 27 → a = 9 sm (asos 6 sm).","topic":"m14","q_ru":"Периметр равнобедренного треугольника 24 см, основание на 3 см короче боковой стороны. Найдите боковую сторону.","options_ru":["9 см","6 см","8 см","10,5 см"],"solution_ru":"Боковая сторона a, основание a − 3.\n2a + (a − 3) = 24 → 3a = 27 → a = 9 см (основание 6 см)."},
{"id":"14-35","q":"Ikki xonali sonning raqamlari yig'indisi 9. Raqamlarining o'rni almashtirilsa, son 27 ga kamayadi. Sonni toping.","options":["63","36","54","72"],"correct":0,"solution":"Son 10a + b: a + b = 9 va (10a + b) − (10b + a) = 27 → 9(a − b) = 27 → a − b = 3.\na = 6, b = 3 → son 63. Tekshirish: 63 − 36 = 27 ✓","topic":"m14","q_ru":"Сумма цифр двузначного числа равна 9. Если поменять цифры местами, число уменьшится на 27. Найдите число.","options_ru":["63","36","54","72"],"solution_ru":"Число 10a + b: a + b = 9 и (10a + b) − (10b + a) = 27 → 9(a − b) = 27 → a − b = 3.\na = 6, b = 3 → число 63. Проверка: 63 − 36 = 27 ✓"},
{"id":"14-52","q":"3 kg olma va 2 kg nok 46 000 so'm, 2 kg olma va 3 kg nok 49 000 so'm turadi. 1 kg nok necha so'm?","options":["11 000 so'm","8 000 so'm","9 500 so'm","19 000 so'm"],"correct":0,"solution":"3o + 2n = 46 000, 2o + 3n = 49 000.\nQo'shamiz: 5(o + n) = 95 000 → o + n = 19 000.\nAyiramiz: n − o = 3 000.\nn = (19 000 + 3 000) : 2 = 11 000 so'm.","topic":"m14","q_ru":"3 кг яблок и 2 кг груш стоят 46 000 сумов, а 2 кг яблок и 3 кг груш — 49 000 сумов. Сколько стоит 1 кг груш?","options_ru":["11 000 сумов","8 000 сумов","9 500 сумов","19 000 сумов"],"solution_ru":"3я + 2г = 46 000, 2я + 3г = 49 000.\nСкладываем: 5(я + г) = 95 000 → я + г = 19 000.\nВычитаем: г − я = 3 000.\nг = (19 000 + 3 000) : 2 = 11 000 сумов."},
{"id":"14-15","q":"Sistemadan x + y ning qiymatini toping:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + 2y = 17</span><span>2x + 3y = 18</span></span></span>","options":["7","35","5","1"],"correct":0,"solution":"Tenglamalarni qo'shamiz: 5x + 5y = 35 → x + y = 7.\n(x va y ni alohida topish shart emas.)","topic":"m14","q_ru":"Найдите значение x + y из системы:<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>3x + 2y = 17</span><span>2x + 3y = 18</span></span></span>","options_ru":["7","35","5","1"],"solution_ru":"Складываем уравнения: 5x + 5y = 35 → x + y = 7.\n(Находить x и y по отдельности не нужно.)"},
{"id":"14-16","q":"a ning qanday qiymatida sistema yechimga ega bo'lmaydi?<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + 3y = 5</span><span>4x + ay = 1</span></span></span>","options":["6","3","1","−6"],"correct":0,"solution":"Yechim bo'lmasligi uchun to'g'ri chiziqlar parallel bo'lishi kerak: 4/2 = a/3 ≠ 1/5.\na = 6.","topic":"m14","q_ru":"При каком значении a система не имеет решений?<br><span style='display:inline-flex;align-items:center;gap:6px;vertical-align:middle'><span style='font-size:42px;font-weight:300;line-height:1'>{</span><span style='display:inline-flex;flex-direction:column;text-align:left;font-weight:600;line-height:1.5'><span>2x + 3y = 5</span><span>4x + ay = 1</span></span></span>","options_ru":["6","3","1","−6"],"solution_ru":"Решений нет, если прямые параллельны: 4/2 = a/3 ≠ 1/5.\na = 6."},
{"id":"14-51","q":"Ota va o'g'ilning yoshlari yig'indisi 44. 4 yil oldin ota o'g'lidan 5 marta katta edi. O'g'il hozir necha yoshda?","options":["10","6","34","8"],"correct":0,"solution":"o + s = 44, o − 4 = 5(s − 4) → o = 5s − 16.\n5s − 16 + s = 44 → 6s = 60 → s = 10.\nTekshirish: ota 34, 4 yil oldin 30 va 6 ✓","topic":"m14","q_ru":"Сумма возрастов отца и сына 44 года. 4 года назад отец был старше сына в 5 раз. Сколько лет сыну сейчас?","options_ru":["10","6","34","8"],"solution_ru":"о + с = 44, о − 4 = 5(с − 4) → о = 5с − 16.\n5с − 16 + с = 44 → 6с = 60 → с = 10.\nПроверка: отцу 34, 4 года назад 30 и 6 ✓"},
{"id":"14-9","q":"Sinfda 30 o'quvchi bor. Har bir o'g'il bola 2 tadan, har bir qiz 3 tadan ko'chat ekdi, jami 74 ta ko'chat ekildi. Sinfda nechta qiz bor?","options":["14","16","15","12"],"correct":0,"solution":"o + q = 30, 2o + 3q = 74.\n2(30 − q) + 3q = 74 → 60 + q = 74 → q = 14.","topic":"m14","q_ru":"В классе 30 учеников. Каждый мальчик посадил 2 саженца, каждая девочка — 3, всего 74 саженца. Сколько девочек в классе?","options_ru":["14","16","15","12"],"solution_ru":"м + д = 30, 2м + 3д = 74.\n2(30 − д) + 3д = 74 → 60 + д = 74 → д = 14."},
{"id":"15-7","q":"Avtomobil soatiga 85 km tezlik bilan 4 soat yurdi. U necha km yo'l bosgan?","options":["425 km","340 km","89 km","255 km"],"correct":1,"solution":"Yo'l = tezlik · vaqt = 85 · 4 = 340 km.","topic":"m15","q_ru":"Автомобиль ехал 4 ч со скоростью 85 км/ч. Сколько км он проехал?","options_ru":["425 км","340 км","89 км","255 км"],"solution_ru":"Путь = скорость · время = 85 · 4 = 340 км."},
{"id":"15-28","q":"Do'konga 120 kg olma keltirildi. Birinchi kuni 3/8 qismi, ikkinchi kuni qolganining yarmi sotildi. Necha kg olma qoldi?","options":["37,5 kg","45 kg","30 kg","75 kg"],"correct":0,"solution":"1-kuni: 120 · 3/8 = 45 kg, qoldi 75 kg.\n2-kuni: 75 : 2 = 37,5 kg sotildi, qoldi 37,5 kg.","topic":"m15","q_ru":"В магазин привезли 120 кг яблок. В первый день продали 3/8, во второй — половину остатка. Сколько килограммов осталось?","options_ru":["37,5 кг","45 кг","30 кг","75 кг"],"solution_ru":"В 1-й день: 120 · 3/8 = 45 кг, осталось 75 кг.\nВо 2-й день продали 75 : 2 = 37,5 кг, осталось 37,5 кг."},
{"id":"15-32","q":"Arqonni 6 ta teng bo'lakka bo'lish uchun uni necha joyidan kesish kerak?","options":["5","6","7","3"],"correct":0,"solution":"Har bir kesish bo'laklar sonini 1 taga oshiradi: 1 → 2 → … → 6.\nDemak 6 − 1 = 5 marta kesish kerak.","topic":"m15","q_ru":"Сколько разрезов нужно сделать, чтобы разделить верёвку на 6 равных частей?","options_ru":["5","6","7","3"],"solution_ru":"Каждый разрез увеличивает число кусков на 1: 1 → 2 → … → 6.\nЗначит, нужно 6 − 1 = 5 разрезов."},
{"id":"15-27","q":"Ko'chaning bir tomoniga 100 m masofada har 10 m da daraxt ekildi (boshida ham, oxirida ham). Nechta daraxt ekilgan?","options":["11","10","9","12"],"correct":0,"solution":"Oraliqlar soni: 100 : 10 = 10 ta.\nDaraxtlar oraliqlardan bitta ko'p: 10 + 1 = 11 ta.","topic":"m15","q_ru":"Вдоль одной стороны улицы на протяжении 100 м через каждые 10 м посадили деревья (и в начале, и в конце). Сколько деревьев посадили?","options_ru":["11","10","9","12"],"solution_ru":"Промежутков: 100 : 10 = 10.\nДеревьев на одно больше: 10 + 1 = 11."},
{"id":"15-54","q":"Kitob sahifalarini 1 dan 120 gacha raqamlash uchun jami nechta raqam yozilgan?","options":["252","120","360","243"],"correct":0,"solution":"1–9: 9 ta raqam.\n10–99: 90 ta son × 2 = 180 ta raqam.\n100–120: 21 ta son × 3 = 63 ta raqam.\nJami: 9 + 180 + 63 = 252.","topic":"m15","q_ru":"Сколько всего цифр написано при нумерации страниц книги с 1 по 120?","options_ru":["252","120","360","243"],"solution_ru":"1–9: 9 цифр.\n10–99: 90 чисел × 2 = 180 цифр.\n100–120: 21 число × 3 = 63 цифры.\nВсего: 9 + 180 + 63 = 252."},
{"id":"15-55","q":"Ikki poyezd bir-biriga qarab 60 km/soat va 80 km/soat tezlik bilan harakatlanmoqda. Uchrashishdan 1 soat oldin ular orasidagi masofa qancha bo'ladi?","options":["140 km","20 km","70 km","280 km"],"correct":0,"solution":"Yaqinlashish tezligi: 60 + 80 = 140 km/soat.\nUchrashishdan 1 soat oldin ular orasida aynan 1 soatlik yaqinlashish masofasi qoladi: 140 km.\n(Dastlabki masofa kerak emas.)","topic":"m15","q_ru":"Два поезда движутся навстречу друг другу со скоростями 60 км/ч и 80 км/ч. Какое расстояние будет между ними за 1 час до встречи?","options_ru":["140 км","20 км","70 км","280 км"],"solution_ru":"Скорость сближения: 60 + 80 = 140 км/ч.\nЗа 1 час до встречи между ними ровно часовой путь сближения: 140 км.\n(Начальное расстояние не нужно.)"},
{"id":"15-29","q":"5 ta qalam va 3 ta daftar birgalikda 25 000 so'm turadi. Daftar qalamdan 3 000 so'm qimmat. Bitta qalam necha so'm?","options":["2 000 so'm","5 000 so'm","3 125 so'm","2 500 so'm"],"correct":0,"solution":"Qalam x, daftar x + 3 000.\n5x + 3(x + 3 000) = 25 000 → 8x + 9 000 = 25 000 → x = 2 000 so'm.","topic":"m15","q_ru":"5 карандашей и 3 тетради вместе стоят 25 000 сумов. Тетрадь дороже карандаша на 3 000 сумов. Сколько стоит карандаш?","options_ru":["2 000 сумов","5 000 сумов","3 125 сумов","2 500 сумов"],"solution_ru":"Карандаш x, тетрадь x + 3 000.\n5x + 3(x + 3 000) = 25 000 → 8x + 9 000 = 25 000 → x = 2 000 сумов."},
{"id":"15-30","q":"Bolalar bir qatorga tizilishdi. Ali chapdan 7-, o'ngdan 9-o'rinda turibdi. Qatorda nechta bola bor?","options":["15","16","14","17"],"correct":0,"solution":"Alining chap tomonida 6 ta, o'ng tomonida 8 ta bola bor.\nJami: 6 + 8 + 1 (Alining o'zi) = 15.","topic":"m15","q_ru":"Дети выстроились в ряд. Али стоит 7-м слева и 9-м справа. Сколько детей в ряду?","options_ru":["15","16","14","17"],"solution_ru":"Слева от Али 6 детей, справа — 8.\nВсего: 6 + 8 + 1 (сам Али) = 15."},
{"id":"15-45","q":"Velosipedchi shahardan 15 km/soat tezlikda chiqdi. 2 soatdan keyin uning ortidan mototsiklchi 45 km/soat tezlikda chiqdi. Mototsiklchi velosipedchini necha soatda quvib yetadi?","options":["1 soat","2 soat","0,5 soat","1,5 soat"],"correct":0,"solution":"2 soatda velosipedchi 30 km uzoqlashdi.\nQuvish tezligi: 45 − 15 = 30 km/soat.\n30 : 30 = 1 soat.","topic":"m15","q_ru":"Велосипедист выехал из города со скоростью 15 км/ч. Через 2 часа вслед за ним выехал мотоциклист со скоростью 45 км/ч. Через сколько часов мотоциклист догонит велосипедиста?","options_ru":["1 час","2 часа","0,5 часа","1,5 часа"],"solution_ru":"За 2 часа велосипедист удалился на 30 км.\nСкорость сближения: 45 − 15 = 30 км/ч.\n30 : 30 = 1 час."},
{"id":"15-10","q":"Bir sonni 4 ga bo'lganda bo'linma 12, qoldiq 3 bo'ldi. Shu sonni toping.","options":["51","48","45","52"],"correct":0,"solution":"Son = bo'luvchi · bo'linma + qoldiq = 4 · 12 + 3 = 51.","topic":"m15","q_ru":"При делении числа на 4 получилось частное 12 и остаток 3. Найдите число.","options_ru":["51","48","45","52"],"solution_ru":"Число = делитель · частное + остаток = 4 · 12 + 3 = 51."},
{"id":"15-34","q":"Sinfda 30 o'quvchi bor. 18 tasi ingliz tilini, 15 tasi rus tilini o'rganadi, har bir o'quvchi kamida bitta tilni o'rganadi. Nechta o'quvchi ikkala tilni ham o'rganadi?","options":["3","0","12","15"],"correct":0,"solution":"18 + 15 = 33 — bu 30 dan 3 ta ko'p.\nOrtiqcha 3 ta ikkala tilni o'rganuvchilar (ular ikki marta sanalgan).","topic":"m15","q_ru":"В классе 30 учеников. 18 изучают английский, 15 — русский, каждый изучает хотя бы один язык. Сколько учеников изучают оба языка?","options_ru":["3","0","12","15"],"solution_ru":"18 + 15 = 33 — это на 3 больше 30.\nЛишние 3 — те, кто изучает оба языка (они посчитаны дважды)."},
{"id":"15-9","q":"Kitob 15 000 so'm va yana kitob narxining yarmicha turadi. Kitob necha so'm?","options":["30 000 so'm","22 500 so'm","15 000 so'm","7 500 so'm"],"correct":0,"solution":"x = 15 000 + x/2 → x/2 = 15 000 → x = 30 000 so'm.","topic":"m15","q_ru":"Книга стоит 15 000 сумов и ещё половину стоимости книги. Сколько стоит книга?","options_ru":["30 000 сумов","22 500 сумов","15 000 сумов","7 500 сумов"],"solution_ru":"x = 15 000 + x/2 → x/2 = 15 000 → x = 30 000 сумов."},
{"id":"15-24","q":"Hovuzni 1-quvur 3 soatda to'ldiradi, 2-quvur esa to'la hovuzni 6 soatda bo'shatadi. Ikkalasi birga ochilsa, bo'sh hovuz necha soatda to'ladi?","options":["6 soat","2 soat","9 soat","4,5 soat"],"correct":0,"solution":"1 soatda: 1/3 − 1/6 = 1/6 qismi to'ladi.\nTo'liq hovuz: 6 soatda.","topic":"m15","q_ru":"Первая труба наполняет бассейн за 3 часа, вторая опустошает полный бассейн за 6 часов. За сколько часов наполнится пустой бассейн, если открыть обе?","options_ru":["6 часов","2 часа","9 часов","4,5 часа"],"solution_ru":"За 1 час: 1/3 − 1/6 = 1/6 бассейна.\nПолный бассейн — за 6 часов."},
{"id":"15-36","q":"Ota 38 yoshda, uning uch farzandi 6, 8 va 12 yoshda. Necha yildan keyin otaning yoshi farzandlari yoshlari yig'indisiga teng bo'ladi?","options":["6","12","4","8"],"correct":0,"solution":"Hozir farzandlar yig'indisi 26. Har yili ota 1 yoshga, yig'indi 3 yoshga ortadi.\n38 + n = 26 + 3n → 12 = 2n → n = 6.","topic":"m15","q_ru":"Отцу 38 лет, его троим детям 6, 8 и 12 лет. Через сколько лет возраст отца будет равен сумме возрастов детей?","options_ru":["6","12","4","8"],"solution_ru":"Сейчас сумма возрастов детей 26. Каждый год отцу прибавляется 1 год, а сумме — 3.\n38 + n = 26 + 3n → 12 = 2n → n = 6."},
